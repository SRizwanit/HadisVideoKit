<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="svg10-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="svg10-col" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0.75"/>
    </linearGradient>
    <style>
      @keyframes svg10-k1 {
        0%   { transform: scale(0.6); opacity: 0.7; }
        30%  { transform: scale(1);   opacity: 1; }
        90%  { transform: scale(1);   opacity: 1; }
        100% { transform: scale(0.6); opacity: 0.7; }
      }
      @keyframes svg10-k2 {
        0%, 30%  { opacity: 0; }
        48%, 88% { opacity: 1; }
        100%     { opacity: 0; }
      }
      @keyframes svg10-k3 {
        0%, 63%  { opacity: 0; transform: translateY(-80px); }
        78%, 88% { opacity: 1; transform: translateY(0px); }
        100%     { opacity: 0; transform: translateY(0px); }
      }
      @keyframes svg10-beam {
        0%, 63%  { transform: rotate(0deg); }
        80%, 88% { transform: rotate(8deg); }
        100%     { transform: rotate(0deg); }
      }
      @keyframes svg10-hl {
        0%, 63%  { transform: translateY(0px); }
        80%, 88% { transform: translateY(-32px); }
        100%     { transform: translateY(0px); }
      }
      @keyframes svg10-hr {
        0%, 63%  { transform: translateY(0px); }
        80%, 88% { transform: translateY(32px); }
        100%     { transform: translateY(0px); }
      }
      @keyframes svg10-twinkle {
        0%, 100% { opacity: 0.3; }
        50%      { opacity: 1; }
      }
      .svg10-s1 { animation: svg10-k1 6s ease-in-out infinite; transform-origin: 500px 860px; }
      .svg10-s2 { animation: svg10-k2 6s ease-in-out infinite; }
      .svg10-s3 { animation: svg10-k3 6s ease-in-out infinite; }
      .svg10-beam { animation: svg10-beam 6s ease-in-out infinite; transform-origin: 500px 400px; }
      .svg10-hl { animation: svg10-hl 6s ease-in-out infinite; }
      .svg10-hr { animation: svg10-hr 6s ease-in-out infinite; }
      .svg10-tw1 { animation: svg10-twinkle 2s ease-in-out infinite; }
      .svg10-tw2 { animation: svg10-twinkle 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Stage 1: দাঁড়িপাল্লা -->
  <g class="svg10-s1">
    <path d="M380 865 L620 865 Q600 825 500 825 Q400 825 380 865 Z" fill="#f5d77a" fill-opacity="0.3" stroke="#f5d77a" stroke-width="8" stroke-linejoin="round"/>
    <line x1="500" y1="400" x2="500" y2="830" stroke="#f5d77a" stroke-width="14" stroke-linecap="round"/>
    <g class="svg10-beam">
      <line x1="270" y1="400" x2="730" y2="400" stroke="#f0c040" stroke-width="14" stroke-linecap="round"/>
      <circle cx="270" cy="400" r="10" fill="#ffffff"/>
      <circle cx="730" cy="400" r="10" fill="#ffffff"/>
    </g>
    <circle cx="500" cy="400" r="22" fill="#ffffff"/>
  </g>

  <!-- Stage 2: দুই পাল্লায় একই আকৃতির বাক্স -->
  <g class="svg10-s2">
    <g class="svg10-hl">
      <line x1="270" y1="400" x2="190" y2="560" stroke="#8fd3ff" stroke-width="5" stroke-linecap="round"/>
      <line x1="270" y1="400" x2="350" y2="560" stroke="#8fd3ff" stroke-width="5" stroke-linecap="round"/>
      <path d="M180 560 L360 560 Q340 610 270 610 Q200 610 180 560 Z" fill="#1abc9c" fill-opacity="0.35" stroke="#1abc9c" stroke-width="8" stroke-linejoin="round"/>
      <rect x="230" y="498" width="80" height="62" rx="6" fill="#8fd3ff" fill-opacity="0.25" stroke="#8fd3ff" stroke-width="7"/>
      <line x1="230" y1="520" x2="310" y2="520" stroke="#ffffff" stroke-width="5" stroke-opacity="0.8"/>
    </g>
    <g class="svg10-hr">
      <line x1="730" y1="400" x2="650" y2="560" stroke="#8fd3ff" stroke-width="5" stroke-linecap="round"/>
      <line x1="730" y1="400" x2="810" y2="560" stroke="#8fd3ff" stroke-width="5" stroke-linecap="round"/>
      <path d="M640 560 L820 560 Q800 610 730 610 Q660 610 640 560 Z" fill="#1abc9c" fill-opacity="0.35" stroke="#1abc9c" stroke-width="8" stroke-linejoin="round"/>
      <rect x="690" y="498" width="80" height="62" rx="6" fill="#8fd3ff" fill-opacity="0.25" stroke="#8fd3ff" stroke-width="7"/>
      <line x1="690" y1="520" x2="770" y2="520" stroke="#ffffff" stroke-width="5" stroke-opacity="0.8"/>
    </g>
    <circle class="svg10-tw1" cx="140" cy="380" r="7" fill="#ffffff"/>
    <circle class="svg10-tw2" cx="860" cy="330" r="7" fill="#8fd3ff"/>
  </g>

  <!-- Stage 3: এক পাল্লায় আলো নামে, সেই দিক ভারী হয় -->
  <g class="svg10-s3">
    <path d="M700 120 L760 120 L810 545 L650 545 Z" fill="url(#svg10-col)"/>
    <circle cx="730" cy="540" r="120" fill="url(#svg10-glow)"/>
    <circle class="svg10-tw1" cx="730" cy="180" r="10" fill="#ffffff"/>
    <circle class="svg10-tw2" cx="680" cy="260" r="7" fill="#fff6c8"/>
    <circle class="svg10-tw1" cx="780" cy="300" r="7" fill="#fff6c8"/>
  </g>
</svg>
