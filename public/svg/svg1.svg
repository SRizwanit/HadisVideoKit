<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialGradient id="svg1-glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6c8" stop-opacity=".9"/><stop offset="1" stop-color="#f5d77a" stop-opacity="0"/></radialGradient>
<radialGradient id="svg1-rayg" gradientUnits="userSpaceOnUse" cx="500" cy="520" r="440"><stop offset="0" stop-color="#f5d77a" stop-opacity=".42"/><stop offset="1" stop-color="#f5d77a" stop-opacity="0"/></radialGradient>
<radialGradient id="svg1-gt" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#5fe3b8"/><stop offset="1" stop-color="#1abc9c"/></radialGradient>
<radialGradient id="svg1-gb" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#d4efff"/><stop offset="1" stop-color="#8fd3ff"/></radialGradient>
<path id="svg1-route" d="M292,472 Q335,405 438,358 L562,358 Q665,405 708,472"/>
<style>
@keyframes svg1-k1 { 0% { opacity:.5; transform:scale(.85); } 10%,90% { opacity:1; transform:scale(1); } 100% { opacity:.5; transform:scale(.85); } }
@keyframes svg1-k2 { 0%,9% { opacity:0; transform:scale(.6); } 14% { opacity:1; transform:scale(1.08); } 17%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg1-k3 { 0%,19% { opacity:0; transform:scale(.6); } 24% { opacity:1; transform:scale(1.08); } 27%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg1-k4 { 0%,29% { opacity:0; transform:scale(.6); } 34% { opacity:1; transform:scale(1.08); } 37%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg1-k5 { 0%,39% { opacity:0; } 45%,90% { opacity:1; } 100% { opacity:0; } }
@keyframes svg1-k6 { 0%,49% { opacity:0; transform:scale(.6); } 54% { opacity:1; transform:scale(1.08); } 57%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg1-k7 { 0%,59% { opacity:0; } 65%,90% { opacity:1; } 100% { opacity:0; } }
@keyframes svg1-k8 { 0%,68% { opacity:0; } 71%,90% { opacity:1; } 100% { opacity:0; } }
@keyframes svg1-k9 { 0%,79% { opacity:0; transform:scale(.6); } 84% { opacity:1; transform:scale(1.08); } 87%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg1-k10 { 0%,89% { opacity:0; transform:scale(.5); } 93% { opacity:.9; } 100% { opacity:0; transform:scale(2.6); } }
@keyframes svg1-spin { from { transform:rotate(0deg); } to { transform:rotate(22.5deg); } }
@keyframes svg1-dash { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
@keyframes svg1-twinkle { 0%,100% { opacity:.25; transform:scale(.6); } 50% { opacity:1; transform:scale(1.15); } }
@keyframes svg1-float { 0% { transform:translateY(0); opacity:0; } 20% { opacity:.9; } 100% { transform:translateY(-90px); opacity:0; } }
.svg1-s1 { animation:svg1-k1 6s ease-in-out infinite; transform-origin:500px 520px; }
.svg1-rays { animation:svg1-spin 6s linear infinite; transform-origin:500px 520px; }
.svg1-s2 { animation:svg1-k2 6s ease-in-out infinite; transform-origin:500px 780px; }
.svg1-s3 { animation:svg1-k3 6s ease-in-out infinite; transform-origin:500px 780px; }
.svg1-s4 { animation:svg1-k4 6s ease-in-out infinite; transform-origin:230px 520px; }
.svg1-s5 { animation:svg1-k5 6s ease-in-out infinite; }
.svg1-s6 { animation:svg1-k6 6s ease-in-out infinite; transform-origin:500px 310px; }
.svg1-s7 { animation:svg1-k7 6s ease-in-out infinite; }
.svg1-s8 { animation:svg1-k8 6s ease-in-out infinite; }
.svg1-s9 { animation:svg1-k9 6s ease-in-out infinite; transform-origin:770px 520px; }
.svg1-s10 { animation:svg1-k10 6s ease-out infinite; transform-origin:500px 520px; }
.svg1-tw { animation:svg1-twinkle 2s ease-in-out infinite; }
.svg1-mote { animation:svg1-float 2s ease-out infinite; }
.svg1-dashring { animation:svg1-dash 6s linear infinite; transform-origin:770px 520px; }
</style>
</defs>

<!-- Stage 1 (0-10%): sunburst rays + soft glow (always present) -->
<g class="svg1-s1">
<circle cx="500" cy="520" r="330" fill="url(#svg1-glow)" opacity=".35"/>
<g class="svg1-rays"><polygon points="500,520 470,80 530,80" fill="url(#svg1-rayg)" transform="rotate(0.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg1-rayg)" transform="rotate(22.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg1-rayg)" transform="rotate(45.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg1-rayg)" transform="rotate(67.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg1-rayg)" transform="rotate(90.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg1-rayg)" transform="rotate(112.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg1-rayg)" transform="rotate(135.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg1-rayg)" transform="rotate(157.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg1-rayg)" transform="rotate(180.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg1-rayg)" transform="rotate(202.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg1-rayg)" transform="rotate(225.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg1-rayg)" transform="rotate(247.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg1-rayg)" transform="rotate(270.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg1-rayg)" transform="rotate(292.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg1-rayg)" transform="rotate(315.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg1-rayg)" transform="rotate(337.5 500 520)"/></g>
</g>

<!-- Stage 2 (10-20%): open hadith book -->
<g class="svg1-s2">
<ellipse cx="500" cy="880" rx="270" ry="22" fill="#ffffff" opacity=".12"/>
<path d="M240,715 L240,858 C330,830 440,830 500,868 C560,830 670,830 760,858 L760,715 Z" fill="#1abc9c" stroke="#f0c040" stroke-width="10" stroke-linejoin="round"/>
<path d="M500,712 C440,684 345,684 268,708 L268,834 C345,812 440,812 500,842 Z" fill="#fff6dc"/>
<path d="M500,712 C560,684 655,684 732,708 L732,834 C655,812 560,812 500,842 Z" fill="#f6e6b8"/>
<path d="M500,712 L500,842" stroke="#f0c040" stroke-width="6"/>
</g>

<!-- Stage 3 (20-30%): page lines, ribbon, light motes -->
<g class="svg1-s3">
<path d="M310,740 C370,724 440,726 478,744 M310,768 C370,752 440,754 478,772 M310,796 C370,780 440,782 478,800" fill="none" stroke="#f0c040" stroke-width="7" stroke-linecap="round" opacity=".75"/>
<path d="M522,744 C560,726 630,724 690,740 M522,772 C560,754 630,752 690,768 M522,800 C560,782 630,780 690,796" fill="none" stroke="#f0c040" stroke-width="7" stroke-linecap="round" opacity=".75"/>
<path d="M486,838 L486,905 L500,890 L514,905 L514,838 Z" fill="#2ecc71"/>
<circle class="svg1-mote" cx="440" cy="690" r="8" fill="#fff6c8"/>
<circle class="svg1-mote" style="animation-delay:-.7s" cx="500" cy="680" r="10" fill="#ffffff"/>
<circle class="svg1-mote" style="animation-delay:-1.4s" cx="565" cy="692" r="7" fill="#fff6c8"/>
</g>

<!-- Stage 4 (30-40%): first narrator medallion -->
<g class="svg1-s4"><circle cx="230" cy="520" r="94" fill="none" stroke="#f5d77a" stroke-opacity=".3" stroke-width="6"/><circle cx="230" cy="520" r="74" fill="url(#svg1-gt)" stroke="#f0c040" stroke-width="10"/><path d="M178,502 A56,56 0 0 1 240,464" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="7" stroke-linecap="round"/></g>

<!-- Stage 5 (40-50%): its star + first chain link to the next -->
<g class="svg1-s5">
<rect x="200" y="490" width="60" height="60" fill="#ffffff" transform="rotate(45 230 520)"/><rect x="200" y="490" width="60" height="60" fill="#ffffff"/><circle cx="230" cy="520" r="11" fill="#f0c040"/>
<path d="M292,472 Q335,405 438,358" fill="none" stroke="#f0c040" stroke-width="14" stroke-linecap="round" stroke-dasharray="26 14"/>
<path d="M292,472 Q335,405 438,358" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 26" stroke-dashoffset="-6"/>
<path class="svg1-tw" style="transform-origin:150px 410px; animation-delay:0s" d="M150,388 Q150,410 172,410 Q150,410 150,432 Q150,410 128,410 Q150,410 150,388 Z" fill="#fff6c8"/><path class="svg1-tw" style="transform-origin:320px 590px; animation-delay:-0.7s" d="M320,574 Q320,590 336,590 Q320,590 320,606 Q320,590 304,590 Q320,590 320,574 Z" fill="#fff6c8"/><path class="svg1-tw" style="transform-origin:300px 380px; animation-delay:-1.3s" d="M300,366 Q300,380 314,380 Q300,380 300,394 Q300,380 286,380 Q300,380 300,366 Z" fill="#fff6c8"/>
</g>

<!-- Stage 6 (50-60%): second narrator medallion -->
<g class="svg1-s6"><circle cx="500" cy="310" r="94" fill="none" stroke="#f5d77a" stroke-opacity=".3" stroke-width="6"/><circle cx="500" cy="310" r="74" fill="url(#svg1-gt)" stroke="#f0c040" stroke-width="10"/><path d="M448,292 A56,56 0 0 1 510,254" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="7" stroke-linecap="round"/></g>

<!-- Stage 7 (60-70%): its star + second chain + dashed third (next) medallion -->
<g class="svg1-s7">
<rect x="470" y="280" width="60" height="60" fill="#ffffff" transform="rotate(45 500 310)"/><rect x="470" y="280" width="60" height="60" fill="#ffffff"/><circle cx="500" cy="310" r="11" fill="#f0c040"/>
<path d="M562,358 Q665,405 708,472" fill="none" stroke="#f0c040" stroke-width="14" stroke-linecap="round" stroke-dasharray="26 14"/>
<path d="M562,358 Q665,405 708,472" fill="none" stroke="#ffffff" stroke-opacity=".8" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 26" stroke-dashoffset="-6"/>
<g class="svg1-dashring"><circle cx="770" cy="520" r="74" fill="none" stroke="#8fd3ff" stroke-opacity=".8" stroke-width="8" stroke-dasharray="14 12" stroke-linecap="round"/></g>
</g>

<!-- Stage 8 (70-80%): light of narration travels along the chain -->
<g class="svg1-s8">
<g>
<circle cx="0" cy="0" r="46" fill="url(#svg1-glow)"/>
<circle cx="0" cy="0" r="14" fill="#ffffff"/>
<animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7;0.8;1"><mpath href="#svg1-route"/></animateMotion>
</g>
</g>

<!-- Stage 9 (80-90%): the next narrator lights up -->
<g class="svg1-s9">
<circle cx="770" cy="520" r="100" fill="url(#svg1-glow)"/>
<circle cx="770" cy="520" r="94" fill="none" stroke="#f5d77a" stroke-opacity=".3" stroke-width="6"/><circle cx="770" cy="520" r="74" fill="url(#svg1-gb)" stroke="#f0c040" stroke-width="10"/><path d="M718,502 A56,56 0 0 1 780,464" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="7" stroke-linecap="round"/>
<rect x="740" y="490" width="60" height="60" fill="#ffffff" transform="rotate(45 770 520)"/><rect x="740" y="490" width="60" height="60" fill="#ffffff"/><circle cx="770" cy="520" r="11" fill="#f0c040"/>
<path class="svg1-tw" style="transform-origin:860px 400px; animation-delay:-0.3s" d="M860,378 Q860,400 882,400 Q860,400 860,422 Q860,400 838,400 Q860,400 860,378 Z" fill="#fff6c8"/><path class="svg1-tw" style="transform-origin:700px 600px; animation-delay:-1.0s" d="M700,584 Q700,600 716,600 Q700,600 700,616 Q700,600 684,600 Q700,600 700,584 Z" fill="#fff6c8"/><path class="svg1-tw" style="transform-origin:850px 620px; animation-delay:-1.6s" d="M850,606 Q850,620 864,620 Q850,620 850,634 Q850,620 836,620 Q850,620 850,606 Z" fill="#fff6c8"/><path class="svg1-tw" style="transform-origin:500px 190px; animation-delay:-0.5s" d="M500,172 Q500,190 518,190 Q500,190 500,208 Q500,190 482,190 Q500,190 500,172 Z" fill="#fff6c8"/>
</g>

<!-- Stage 10 (90-100%): halo pulse, then everything fades back to stage 1 -->
<g class="svg1-s10">
<circle cx="500" cy="520" r="150" fill="none" stroke="#f5d77a" stroke-width="12"/>
<circle cx="500" cy="520" r="150" fill="url(#svg1-glow)" opacity=".5"/>
</g>
</svg>
