<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="svg1-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f5d77a" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#f5d77a" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#fff6c8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <style>
      /* Stage 1: খালি হৃদয়ের রেখা (শুরুতে ছোট থেকে বড় হয়) */
      @keyframes svg1-k1 {
        0%   { transform: scale(0.6); opacity: 0.7; }
        30%  { transform: scale(1);   opacity: 1; }
        90%  { transform: scale(1);   opacity: 1; }
        100% { transform: scale(0.6); opacity: 0.7; }
      }
      /* Stage 2: ৩৩% এ ফোটে, ৯০% এ মিলিয়ে যায় */
      @keyframes svg1-k2 {
        0%, 30%   { opacity: 0; transform: scale(0.8); }
        45%, 88%  { opacity: 1; transform: scale(1); }
        100%      { opacity: 0; transform: scale(0.8); }
      }
      /* Stage 3: ৬৬% এ ফোটে, ৯০% এ মিলিয়ে যায় */
      @keyframes svg1-k3 {
        0%, 63%   { opacity: 0; }
        78%, 88%  { opacity: 1; }
        100%      { opacity: 0; }
      }
      @keyframes svg1-float {
        from { transform: translateY(0px); }
        to   { transform: translateY(-22px); }
      }
      @keyframes svg1-twinkle {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.35; }
      }
      @keyframes svg1-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .svg1-s1 { animation: svg1-k1 6s ease-in-out infinite; transform-origin: 500px 500px; }
      .svg1-s2 { animation: svg1-k2 6s ease-in-out infinite; transform-origin: 500px 500px; }
      .svg1-s3 { animation: svg1-k3 6s ease-in-out infinite; transform-origin: 500px 500px; }
      .svg1-floatA { animation: svg1-float 3s ease-in-out infinite alternate; }
      .svg1-floatB { animation: svg1-float 3s ease-in-out -1.5s infinite alternate; }
      .svg1-tw1 { animation: svg1-twinkle 2s ease-in-out infinite; }
      .svg1-tw2 { animation: svg1-twinkle 2s ease-in-out -0.7s infinite; }
      .svg1-tw3 { animation: svg1-twinkle 2s ease-in-out -1.3s infinite; }
      .svg1-ring { animation: svg1-spin 6s linear infinite; transform-origin: 500px 500px; }
    </style>
  </defs>

  <!-- Stage 1: মাঝখানে খালি হৃদয়ের রেখা -->
  <g class="svg1-s1">
    <path d="M500 700 C 300 560, 280 380, 400 330 C 450 310, 490 335, 500 365 C 510 335, 550 310, 600 330 C 720 380, 700 560, 500 700 Z" fill="none" stroke="#f5d77a" stroke-width="14" stroke-linejoin="round"/>
  </g>

  <!-- Stage 2: চারপাশে তারা ও প্রশংসার বুদবুদ -->
  <g class="svg1-s2">
    <g class="svg1-floatA">
      <circle cx="220" cy="470" r="52" fill="#ffffff" fill-opacity="0.12" stroke="#8fd3ff" stroke-width="6"/>
      <circle cx="790" cy="560" r="62" fill="#ffffff" fill-opacity="0.12" stroke="#8fd3ff" stroke-width="6"/>
      <circle cx="330" cy="810" r="40" fill="#ffffff" fill-opacity="0.12" stroke="#8fd3ff" stroke-width="6"/>
      <path d="M0 20 C -30 -2, -24 -26, -8 -22 C -3 -20, 0 -14, 0 -10 C 0 -14, 3 -20, 8 -22 C 24 -26, 30 -2, 0 20 Z" fill="#f0c040" transform="translate(790 560) scale(1.1)"/>
    </g>
    <g class="svg1-floatB">
      <circle cx="260" cy="250" r="46" fill="#ffffff" fill-opacity="0.12" stroke="#1abc9c" stroke-width="6"/>
      <circle cx="740" cy="270" r="56" fill="#ffffff" fill-opacity="0.12" stroke="#1abc9c" stroke-width="6"/>
      <circle cx="690" cy="800" r="44" fill="#ffffff" fill-opacity="0.12" stroke="#1abc9c" stroke-width="6"/>
      <path d="M0 20 C -30 -2, -24 -26, -8 -22 C -3 -20, 0 -14, 0 -10 C 0 -14, 3 -20, 8 -22 C 24 -26, 30 -2, 0 20 Z" fill="#f0c040" transform="translate(260 250)"/>
      <path d="M0 20 C -30 -2, -24 -26, -8 -22 C -3 -20, 0 -14, 0 -10 C 0 -14, 3 -20, 8 -22 C 24 -26, 30 -2, 0 20 Z" fill="#f0c040" transform="translate(220 470) scale(0.9)"/>
    </g>
    <path class="svg1-tw1" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="#ffffff" transform="translate(500 180)"/>
    <path class="svg1-tw2" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="#f5d77a" transform="translate(130 640)"/>
    <path class="svg1-tw3" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="#8fd3ff" transform="translate(880 400)"/>
    <path class="svg1-tw1" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="#ffffff" transform="translate(520 880)"/>
  </g>

  <!-- Stage 3: বাইরে ঝলমল, মাঝের হৃদয় ফাঁকাই -->
  <g class="svg1-s3">
    <circle cx="500" cy="500" r="430" fill="url(#svg1-glow)"/>
    <g class="svg1-ring">
      <circle cx="500" cy="500" r="385" fill="none" stroke="#f5d77a" stroke-width="6" stroke-dasharray="18 26" stroke-opacity="0.8"/>
    </g>
    <path d="M500 700 C 300 560, 280 380, 400 330 C 450 310, 490 335, 500 365 C 510 335, 550 310, 600 330 C 720 380, 700 560, 500 700 Z" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="10 16" stroke-opacity="0.5" transform="translate(500 510) scale(0.55) translate(-500 -510)"/>
    <path class="svg1-tw1" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="#fff6c8" transform="translate(190 210) scale(1.6)"/>
    <path class="svg1-tw2" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="#fff6c8" transform="translate(810 190) scale(1.6)"/>
    <path class="svg1-tw3" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="#fff6c8" transform="translate(830 800) scale(1.6)"/>
    <path class="svg1-tw1" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="#fff6c8" transform="translate(170 790) scale(1.6)"/>
  </g>
</svg>
