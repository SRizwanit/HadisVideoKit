<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="svg1-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <style>
      /* Stage 1 (0-2s): bottom star appears */
      @keyframes svg1-k1 {
        0%   { transform: scale(0.6); opacity: 0.7; }
        30%  { transform: scale(1);   opacity: 1; }
        90%  { transform: scale(1);   opacity: 1; }
        100% { transform: scale(0.6); opacity: 0.7; }
      }
      /* Stage 2 (2-4s): first line + middle star */
      @keyframes svg1-k2 {
        0%, 30%  { opacity: 0; }
        42%, 88% { opacity: 1; }
        100%     { opacity: 0; }
      }
      /* Stage 3 (4-6s): second line + top star + glow */
      @keyframes svg1-k3 {
        0%, 63%  { opacity: 0; }
        75%, 88% { opacity: 1; }
        100%     { opacity: 0; }
      }
      @keyframes svg1-draw1 {
        0%, 30%  { stroke-dashoffset: 1; }
        42%, 100% { stroke-dashoffset: 0; }
      }
      @keyframes svg1-draw2 {
        0%, 63%  { stroke-dashoffset: 1; }
        75%, 100% { stroke-dashoffset: 0; }
      }
      @keyframes svg1-pop2 {
        0%, 32%  { transform: scale(0.5); }
        46%      { transform: scale(1.12); }
        54%, 100% { transform: scale(1); }
      }
      @keyframes svg1-pop3 {
        0%, 65%  { transform: scale(0.5); }
        79%      { transform: scale(1.12); }
        87%, 100% { transform: scale(1); }
      }
      @keyframes svg1-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes svg1-pulse {
        0%, 100% { transform: scale(0.9); opacity: 0.55; }
        50%      { transform: scale(1.1); opacity: 1; }
      }
      @keyframes svg1-twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.7); }
        50%      { opacity: 1;   transform: scale(1.2); }
      }

      .svg1-s1 { animation: svg1-k1 6s ease-in-out infinite; transform-origin: 500px 800px; }
      .svg1-s2 { animation: svg1-k2 6s ease-in-out infinite; }
      .svg1-s3 { animation: svg1-k3 6s ease-in-out infinite; }

      .svg1-ring  { animation: svg1-spin 6s linear infinite; transform-origin: 500px 800px; }
      .svg1-halo1 { animation: svg1-pulse 3s ease-in-out infinite; transform-origin: 500px 800px; }

      .svg1-line1 { stroke-dasharray: 1; stroke-dashoffset: 1; animation: svg1-draw1 6s ease-in-out infinite; }
      .svg1-line2 { stroke-dasharray: 1; stroke-dashoffset: 1; animation: svg1-draw2 6s ease-in-out infinite; }

      .svg1-n2    { animation: svg1-pop2 6s ease-in-out infinite; transform-origin: 500px 500px; }
      .svg1-n3    { animation: svg1-pop3 6s ease-in-out infinite; transform-origin: 500px 200px; }
      .svg1-ring2 { animation: svg1-spin 6s linear infinite; transform-origin: 500px 500px; }

      .svg1-halo3 { animation: svg1-pulse 3s ease-in-out infinite; transform-origin: 500px 200px; }
      .svg1-sp1 { animation: svg1-twinkle 2s ease-in-out infinite; transform-origin: 360px 120px; }
      .svg1-sp2 { animation: svg1-twinkle 2s ease-in-out infinite -0.7s; transform-origin: 640px 120px; }
      .svg1-sp3 { animation: svg1-twinkle 2s ease-in-out infinite -1.3s; transform-origin: 300px 250px; }
      .svg1-sp4 { animation: svg1-twinkle 2s ease-in-out infinite -0.4s; transform-origin: 700px 250px; }
      .svg1-sp5 { animation: svg1-twinkle 3s ease-in-out infinite -1s; transform-origin: 420px 330px; }
      .svg1-sp6 { animation: svg1-twinkle 3s ease-in-out infinite -2s; transform-origin: 580px 330px; }
    </style>
  </defs>

  <!-- Stage 1: first narrator, bottom star with a rotating ring -->
  <g class="svg1-s1">
    <circle class="svg1-halo1" cx="500" cy="800" r="150" fill="url(#svg1-glow)"/>
    <g class="svg1-ring">
      <circle cx="500" cy="800" r="125" fill="none" stroke="#1abc9c" stroke-width="6" stroke-dasharray="14 18" opacity="0.8"/>
    </g>
    <rect x="430" y="730" width="140" height="140" rx="10" fill="#f5d77a" fill-opacity="0.18" stroke="#f5d77a" stroke-width="12"/>
    <rect x="430" y="730" width="140" height="140" rx="10" fill="#1abc9c" fill-opacity="0.12" stroke="#f0c040" stroke-width="12" transform="rotate(45 500 800)"/>
    <circle cx="500" cy="800" r="26" fill="#ffffff"/>
  </g>

  <!-- Stage 2: chain link to the second narrator -->
  <g class="svg1-s2">
    <path class="svg1-line1" pathLength="1" d="M500 700 L500 580" fill="none" stroke="#f5d77a" stroke-width="10" stroke-linecap="round"/>
    <circle cx="500" cy="640" r="9" fill="#ffffff"/>
    <g class="svg1-n2">
      <g class="svg1-ring2">
        <circle cx="500" cy="500" r="100" fill="none" stroke="#8fd3ff" stroke-width="5" stroke-dasharray="10 16" opacity="0.8"/>
      </g>
      <rect x="445" y="445" width="110" height="110" rx="8" fill="#f5d77a" fill-opacity="0.18" stroke="#f5d77a" stroke-width="10"/>
      <rect x="445" y="445" width="110" height="110" rx="8" fill="#1abc9c" fill-opacity="0.12" stroke="#2ecc71" stroke-width="10" transform="rotate(45 500 500)"/>
      <circle cx="500" cy="500" r="20" fill="#ffffff"/>
    </g>
  </g>

  <!-- Stage 3: chain link to the Prophet's words, top star, glow and sparkles -->
  <g class="svg1-s3">
    <circle class="svg1-halo3" cx="500" cy="200" r="190" fill="url(#svg1-glow)"/>
    <path class="svg1-line2" pathLength="1" d="M500 420 L500 280" fill="none" stroke="#f5d77a" stroke-width="10" stroke-linecap="round"/>
    <circle cx="500" cy="350" r="9" fill="#ffffff"/>
    <g class="svg1-n3">
      <rect x="445" y="145" width="110" height="110" rx="8" fill="#f5d77a" fill-opacity="0.25" stroke="#f5d77a" stroke-width="10"/>
      <rect x="445" y="145" width="110" height="110" rx="8" fill="#8fd3ff" fill-opacity="0.15" stroke="#ffffff" stroke-width="10" transform="rotate(45 500 200)"/>
      <circle cx="500" cy="200" r="22" fill="#ffffff"/>
    </g>
    <circle class="svg1-sp1" cx="360" cy="120" r="9" fill="#ffffff"/>
    <circle class="svg1-sp2" cx="640" cy="120" r="9" fill="#f0c040"/>
    <circle class="svg1-sp3" cx="300" cy="250" r="8" fill="#8fd3ff"/>
    <circle class="svg1-sp4" cx="700" cy="250" r="8" fill="#ffffff"/>
    <circle class="svg1-sp5" cx="420" cy="330" r="7" fill="#f5d77a"/>
    <circle class="svg1-sp6" cx="580" cy="330" r="7" fill="#2ecc71"/>
  </g>
</svg>
