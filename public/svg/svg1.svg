<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="svg1-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes svg1-link {
        0%   { opacity: 0.55; stroke-width: 14; }
        40%  { opacity: 0.55; stroke-width: 14; }
        50%  { opacity: 1;    stroke-width: 22; }
        60%  { opacity: 0.55; stroke-width: 14; }
        100% { opacity: 0.55; stroke-width: 14; }
      }
      @keyframes svg1-travel {
        0%     { transform: translateX(0px);   opacity: 0; }
        4%     { transform: translateX(0px);   opacity: 1; }
        83.3%  { transform: translateX(600px); opacity: 1; }
        92%    { transform: translateX(600px); opacity: 0; }
        100%   { transform: translateX(0px);   opacity: 0; }
      }
      @keyframes svg1-twinkle {
        0%, 100% { opacity: 0.2; }
        50%      { opacity: 0.9; }
      }
      .svg1-ring { fill: none; opacity: 0.55; stroke-width: 14; animation: svg1-link 6s ease-in-out infinite; }
      .svg1-gold { stroke: #f5d77a; }
      .svg1-teal { stroke: #1abc9c; }
      .svg1-r1 { animation-delay: -3s; }
      .svg1-r2 { animation-delay: -1.75s; }
      .svg1-r3 { animation-delay: -0.5s; }
      .svg1-r4 { animation-delay: -5.25s; }
      .svg1-r5 { animation-delay: -4s; }
      .svg1-dot { animation: svg1-travel 6s linear infinite; }
      .svg1-star { fill: #ffffff; animation: svg1-twinkle 3s ease-in-out infinite; }
      .svg1-s2 { animation-delay: -1s; }
      .svg1-s3 { animation-delay: -2s; }
    </style>
  </defs>

  <circle class="svg1-star" cx="260" cy="300" r="7"/>
  <circle class="svg1-star svg1-s2" cx="500" cy="260" r="9"/>
  <circle class="svg1-star svg1-s3" cx="740" cy="300" r="7"/>
  <circle class="svg1-star svg1-s3" cx="350" cy="720" r="7"/>
  <circle class="svg1-star" cx="650" cy="720" r="7"/>
  <circle class="svg1-star svg1-s2" cx="500" cy="760" r="9"/>

  <circle class="svg1-ring svg1-gold svg1-r1" cx="200" cy="500" r="95"/>
  <circle class="svg1-ring svg1-teal svg1-r2" cx="350" cy="500" r="95"/>
  <circle class="svg1-ring svg1-gold svg1-r3" cx="500" cy="500" r="95"/>
  <circle class="svg1-ring svg1-teal svg1-r4" cx="650" cy="500" r="95"/>
  <circle class="svg1-ring svg1-gold svg1-r5" cx="800" cy="500" r="95"/>

  <g class="svg1-dot">
    <circle cx="200" cy="500" r="70" fill="url(#svg1-glow)"/>
    <circle cx="200" cy="500" r="18" fill="#ffffff"/>
  </g>
</svg>
