<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Part 9C নমুনা svg1: CSS @keyframes অ্যানিমেশন, ৬ সেকেন্ডের লুপ, স্বচ্ছ ব্যাকগ্রাউন্ড.
       নিজের svg1.svg আপলোড করলে এটা বদলে যাবে। -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes svg1-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes svg1-spin-rev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes svg1-pulse { 0%, 100% { transform: scale(0.82); opacity: 0.35; } 50% { transform: scale(1.12); opacity: 1; } }
      @keyframes svg1-twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
      .svg1-star { animation: svg1-spin 6s linear infinite; transform-origin: 500px 500px; }
      .svg1-orbit { animation: svg1-spin-rev 6s linear infinite; transform-origin: 500px 500px; }
      .svg1-ring { animation: svg1-pulse 3s ease-in-out infinite; transform-origin: 500px 500px; }
      .svg1-glow { animation: svg1-twinkle 2s ease-in-out infinite; }
    </style>
  </defs>
  <circle class="svg1-glow" cx="500" cy="500" r="330" fill="url(#glow)"/>
  <circle class="svg1-ring" cx="500" cy="500" r="400" fill="none" stroke="#2ecc71" stroke-width="10"/>
  <g class="svg1-star">
    <rect x="290" y="290" width="420" height="420" rx="18" fill="none" stroke="#f5d77a" stroke-width="16"/>
    <rect x="290" y="290" width="420" height="420" rx="18" fill="none" stroke="#1abc9c" stroke-width="16" transform="rotate(45 500 500)"/>
  </g>
  <g class="svg1-orbit">
    <circle cx="500" cy="120" r="30" fill="#ffffff"/>
    <circle cx="880" cy="500" r="24" fill="#f5d77a"/>
    <circle cx="500" cy="880" r="30" fill="#2ecc71"/>
    <circle cx="120" cy="500" r="24" fill="#ffffff"/>
  </g>
  <circle cx="500" cy="500" r="46" fill="#f5d77a"/>
</svg>
