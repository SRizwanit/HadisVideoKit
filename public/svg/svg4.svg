<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="svg4-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <style>
      /* ===== ১০ stage, ৬ সেকেন্ড লুপ: প্রতি stage = ১০% = ০.৬ সেকেন্ড ===== */

      /* Stage 1 (0-10%): দাঁড়িপাল্লার স্ট্যান্ড, সবসময় দৃশ্যমান */
      @keyframes svg4-k1 {
        0%   { transform: scale(0.6); opacity: 0.7; }
        8%   { transform: scale(1);   opacity: 1; }
        96%  { transform: scale(1);   opacity: 1; }
        100% { transform: scale(0.6); opacity: 0.7; }
      }
      /* Stage 2..10: নিজের stage-এ ফোটে, ৯৬% থেকে ১০০% এ মিলিয়ে যায় */
      @keyframes svg4-k2  { 0%, 10% { opacity: 0; } 14%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg4-k3  { 0%, 20% { opacity: 0; } 24%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg4-k4  { 0%, 30% { opacity: 0; } 34%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg4-k5  { 0%, 40% { opacity: 0; } 44%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg4-k6  { 0%, 50% { opacity: 0; } 54%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg4-k7  { 0%, 60% { opacity: 0; } 64%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg4-k8  { 0%, 70% { opacity: 0; } 74%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg4-k9  { 0%, 80% { opacity: 0; } 84%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg4-k10 { 0%, 90% { opacity: 0; } 94%, 96% { opacity: 1; } 100% { opacity: 0; } }

      /* দাঁড়িপাল্লার দণ্ড: নিয়ত বসলে বাঁয়ে হেলে, ফল বসলে সমান হয় */
      @keyframes svg4-beam {
        0%, 30%   { transform: rotate(0deg); }
        40%, 56%  { transform: rotate(-6deg); }
        66%, 100% { transform: rotate(0deg); }
      }
      /* বাঁ পাল্লা নামে, ডান পাল্লা ওঠে — দণ্ডের সঙ্গে মিলিয়ে */
      @keyframes svg4-lp {
        0%, 30%   { transform: translateY(0px); }
        40%, 56%  { transform: translateY(25px); }
        66%, 100% { transform: translateY(0px); }
      }
      @keyframes svg4-rp {
        0%, 30%   { transform: translateY(0px); }
        40%, 56%  { transform: translateY(-25px); }
        66%, 100% { transform: translateY(0px); }
      }

      /* হৃদয় ওপর থেকে বাঁ পাল্লায় পড়ে (stage 4) */
      @keyframes svg4-hd {
        0%, 30% { transform: translateY(-150px); }
        36%     { transform: translateY(8px); }
        40%, 100% { transform: translateY(0px); }
      }
      /* ফল ওপর থেকে ডান পাল্লায় পড়ে (stage 6) */
      @keyframes svg4-fd {
        0%, 50% { transform: translateY(-150px); }
        56%     { transform: translateY(8px); }
        60%, 100% { transform: translateY(0px); }
      }

      /* আলোর সংযোগ-রেখা প্রবাহ (৩০ একক = এক পুনরাবৃত্তি) */
      @keyframes svg4-dash { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -30; } }

      /* ছোট বাড়তি অ্যানিমেশন (৬ সেকেন্ডে সমান ভাগ হয়) */
      @keyframes svg4-twinkle { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes svg4-pulse   { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @keyframes svg4-spin    { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      .svg4-s1  { animation: svg4-k1 6s ease-in-out infinite; transform-origin: 500px 600px; }
      .svg4-s2  { animation: svg4-k2 6s ease-in-out infinite; }
      .svg4-s3  { animation: svg4-k3 6s ease-in-out infinite; }
      .svg4-s4  { animation: svg4-k4 6s ease-in-out infinite; }
      .svg4-s5  { animation: svg4-k5 6s ease-in-out infinite; }
      .svg4-s6  { animation: svg4-k6 6s ease-in-out infinite; }
      .svg4-s7  { animation: svg4-k7 6s ease-in-out infinite; }
      .svg4-s8  { animation: svg4-k8 6s ease-in-out infinite; }
      .svg4-s9  { animation: svg4-k9 6s ease-in-out infinite; }
      .svg4-s10 { animation: svg4-k10 6s ease-in-out infinite; }

      .svg4-beam { animation: svg4-beam 6s ease-in-out infinite; transform-origin: 500px 400px; }
      .svg4-lp   { animation: svg4-lp 6s ease-in-out infinite; }
      .svg4-rp   { animation: svg4-rp 6s ease-in-out infinite; }
      .svg4-hd   { animation: svg4-hd 6s ease-out infinite; }
      .svg4-fd   { animation: svg4-fd 6s ease-out infinite; }

      .svg4-link { stroke-dasharray: 14 16; animation: svg4-dash 1.5s linear infinite; }
      .svg4-gear { animation: svg4-spin 6s linear infinite; transform-origin: 500px 190px; }

      .svg4-halo  { animation: svg4-pulse 2s ease-in-out infinite; }
      .svg4-star  { animation: svg4-twinkle 2s ease-in-out infinite; }
      .svg4-star2 { animation: svg4-twinkle 2s ease-in-out infinite; animation-delay: -1s; }
      .svg4-ring  { animation: svg4-spin 6s linear infinite; transform-origin: 500px 500px; }
    </style>
  </defs>

  <!-- Stage 1 (0.0-0.6 s): দাঁড়িপাল্লার স্ট্যান্ড ও কেন্দ্রবিন্দু -->
  <g class="svg4-s1">
    <rect x="420" y="800" width="160" height="36" rx="8" fill="#f5d77a" fill-opacity="0.25" stroke="#f5d77a" stroke-width="8"/>
    <rect x="488" y="420" width="24" height="380" rx="6" fill="#f5d77a" fill-opacity="0.25" stroke="#f5d77a" stroke-width="8"/>
    <circle cx="500" cy="400" r="22" fill="#ffffff" stroke="#f5d77a" stroke-width="8"/>
  </g>

  <!-- Stage 2 (0.6-1.2 s): সমান দণ্ড -->
  <g class="svg4-s2">
    <g class="svg4-beam">
      <line x1="260" y1="400" x2="740" y2="400" stroke="#f5d77a" stroke-width="12" stroke-linecap="round"/>
      <circle cx="260" cy="400" r="12" fill="#ffffff"/>
      <circle cx="740" cy="400" r="12" fill="#ffffff"/>
    </g>
  </g>

  <!-- Stage 3 (1.2-1.8 s): দুই পাল্লা ঝুলে আসে -->
  <g class="svg4-s3">
    <g class="svg4-lp">
      <line x1="260" y1="400" x2="180" y2="540" stroke="#f5d77a" stroke-width="5" stroke-linecap="round"/>
      <line x1="260" y1="400" x2="340" y2="540" stroke="#f5d77a" stroke-width="5" stroke-linecap="round"/>
      <path d="M180 540 L340 540 Q340 600 260 600 Q180 600 180 540 Z" fill="#1abc9c" fill-opacity="0.25" stroke="#1abc9c" stroke-width="8" stroke-linejoin="round"/>
    </g>
    <g class="svg4-rp">
      <line x1="740" y1="400" x2="660" y2="540" stroke="#f5d77a" stroke-width="5" stroke-linecap="round"/>
      <line x1="740" y1="400" x2="820" y2="540" stroke="#f5d77a" stroke-width="5" stroke-linecap="round"/>
      <path d="M660 540 L820 540 Q820 600 740 600 Q660 600 660 540 Z" fill="#1abc9c" fill-opacity="0.25" stroke="#1abc9c" stroke-width="8" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Stage 4 (1.8-2.4 s): নিয়তের হৃদয় বাঁ পাল্লায় পড়ে, পাল্লা নামে -->
  <g class="svg4-s4">
    <g class="svg4-lp">
      <g class="svg4-hd">
        <path transform="translate(260 508) scale(0.35) translate(-500 -260)" d="M500 350 C380 270 390 170 450 170 C475 170 495 185 500 205 C505 185 525 170 550 170 C610 170 620 270 500 350 Z" fill="#f5d77a" fill-opacity="0.35" stroke="#f5d77a" stroke-width="22" stroke-linejoin="round"/>
        <circle cx="260" cy="507" r="6" fill="#ffffff"/>
      </g>
    </g>
  </g>

  <!-- Stage 5 (2.4-3.0 s): আমলের চাকা ঘোরে, নিয়তের সঙ্গে আলোর সংযোগ -->
  <g class="svg4-s5">
    <g class="svg4-gear">
      <g fill="#8fd3ff" stroke="#8fd3ff" stroke-width="2">
        <rect x="490" y="120" width="20" height="22" rx="3"/>
        <rect x="490" y="120" width="20" height="22" rx="3" transform="rotate(45 500 190)"/>
        <rect x="490" y="120" width="20" height="22" rx="3" transform="rotate(90 500 190)"/>
        <rect x="490" y="120" width="20" height="22" rx="3" transform="rotate(135 500 190)"/>
        <rect x="490" y="120" width="20" height="22" rx="3" transform="rotate(180 500 190)"/>
        <rect x="490" y="120" width="20" height="22" rx="3" transform="rotate(225 500 190)"/>
        <rect x="490" y="120" width="20" height="22" rx="3" transform="rotate(270 500 190)"/>
        <rect x="490" y="120" width="20" height="22" rx="3" transform="rotate(315 500 190)"/>
      </g>
      <circle cx="500" cy="190" r="52" fill="#8fd3ff" fill-opacity="0.25" stroke="#8fd3ff" stroke-width="8"/>
      <circle cx="500" cy="190" r="16" fill="#ffffff"/>
    </g>
    <path class="svg4-link" d="M455 215 Q300 260 262 455" fill="none" stroke="#fff6c8" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Stage 6 (3.0-3.6 s): ফল ডান পাল্লায় পড়ে, দণ্ড আবার সমান হতে থাকে -->
  <g class="svg4-s6">
    <g class="svg4-rp">
      <g class="svg4-fd">
        <g fill="#f0c040" stroke="#ffffff" stroke-width="4">
          <circle cx="705" cy="524" r="16"/>
          <circle cx="743" cy="524" r="16"/>
          <circle cx="781" cy="524" r="16"/>
          <circle cx="724" cy="492" r="16"/>
          <circle cx="762" cy="492" r="16"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Stage 7 (3.6-4.2 s): আমল থেকে ফলের দিকে আলোর সংযোগ -->
  <g class="svg4-s7">
    <path class="svg4-link" d="M545 215 Q700 260 738 450" fill="none" stroke="#fff6c8" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Stage 8 (4.2-4.8 s): ভারসাম্য — দুই পাল্লা ও কেন্দ্রে আলো -->
  <g class="svg4-s8">
    <circle class="svg4-halo" cx="500" cy="400" r="110" fill="url(#svg4-glow)"/>
    <circle class="svg4-halo" cx="260" cy="520" r="100" fill="url(#svg4-glow)"/>
    <circle class="svg4-halo" cx="740" cy="520" r="100" fill="url(#svg4-glow)"/>
  </g>

  <!-- Stage 9 (4.8-5.4 s): অর্ধচন্দ্র ও ঝিকিমিকি তারা -->
  <g class="svg4-s9">
    <path transform="translate(-340 0)" d="M530 125 A50 50 0 1 0 530 215 A46 46 0 0 1 530 125 Z" fill="#f5d77a"/>
    <path class="svg4-star" d="M860 188 L866 204 L882 210 L866 216 L860 232 L854 216 L838 210 L854 204 Z" fill="#8fd3ff"/>
    <path class="svg4-star2" d="M895 328 L900 341 L913 346 L900 351 L895 364 L890 351 L877 346 L890 341 Z" fill="#ffffff"/>
    <path class="svg4-star2" d="M110 318 L116 334 L132 340 L116 346 L110 362 L104 346 L88 340 L104 334 Z" fill="#ffffff"/>
    <path class="svg4-star" d="M860 678 L865 691 L878 696 L865 701 L860 714 L855 701 L842 696 L855 691 Z" fill="#8fd3ff"/>
    <path class="svg4-star" d="M140 698 L145 711 L158 716 L145 721 L140 734 L135 721 L122 716 L135 711 Z" fill="#8fd3ff"/>
  </g>

  <!-- Stage 10 (5.4-6.0 s): আলোর বলয় ও কেন্দ্রের চারপাশে আভা -->
  <g class="svg4-s10">
    <circle class="svg4-ring" cx="500" cy="500" r="400" fill="none" stroke="#f0c040" stroke-width="6" stroke-dasharray="20 18" opacity="0.7"/>
    <circle class="svg4-halo" cx="500" cy="400" r="62" fill="none" stroke="#ffffff" stroke-width="5"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
