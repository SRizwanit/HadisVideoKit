<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="svg4-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes svg4-beam {
        0%, 100% { transform: rotate(-7deg); }
        50%      { transform: rotate(3deg); }
      }
      @keyframes svg4-panleft {
        0%, 100% { transform: translateY(30px); }
        50%      { transform: translateY(-13px); }
      }
      @keyframes svg4-panright {
        0%, 100% { transform: translateY(-30px); }
        50%      { transform: translateY(13px); }
      }
      @keyframes svg4-heart {
        0%, 100% { transform: scale(0.9); }
        50%      { transform: scale(1.12); }
      }
      @keyframes svg4-halo {
        0%, 100% { transform: scale(0.8); opacity: 0.45; }
        50%      { transform: scale(1.15); opacity: 1; }
      }
      @keyframes svg4-twinkle {
        0%, 100% { opacity: 0.2; }
        50%      { opacity: 0.95; }
      }
      .svg4-beam { animation: svg4-beam 6s ease-in-out infinite; transform-origin: 500px 300px; }
      .svg4-panleft { animation: svg4-panleft 6s ease-in-out infinite; }
      .svg4-panright { animation: svg4-panright 6s ease-in-out infinite; }
      .svg4-bar { stroke: #f5d77a; stroke-width: 16; stroke-linecap: round; }
      .svg4-knob { fill: #ffffff; }
      .svg4-pillar { stroke: #1abc9c; stroke-width: 18; stroke-linecap: round; }
      .svg4-base { fill: #f5d77a; fill-opacity: 0.9; stroke: #ffffff; stroke-width: 8; stroke-linejoin: round; }
      .svg4-chain { stroke: #8fd3ff; stroke-width: 6; stroke-linecap: round; opacity: 0.9; }
      .svg4-bowl { fill: #f5d77a; fill-opacity: 0.9; stroke: #ffffff; stroke-width: 8; stroke-linejoin: round; }
      .svg4-halo { animation: svg4-halo 2s ease-in-out infinite; transform-origin: 250px 425px; }
      .svg4-heart { fill: #ffffff; stroke: #f0c040; stroke-width: 6; stroke-linejoin: round; animation: svg4-heart 2s ease-in-out infinite; transform-origin: 250px 425px; }
      .svg4-stone { fill: #1abc9c; stroke: #ffffff; stroke-width: 4; }
      .svg4-star { fill: #ffffff; animation: svg4-twinkle 3s ease-in-out infinite; }
      .svg4-s2 { animation-delay: -1s; }
      .svg4-s3 { animation-delay: -2s; }
    </style>
  </defs>

  <circle class="svg4-star" cx="200" cy="170" r="8"/>
  <circle class="svg4-star svg4-s2" cx="800" cy="170" r="10"/>
  <circle class="svg4-star svg4-s3" cx="150" cy="780" r="7"/>
  <circle class="svg4-star" cx="850" cy="780" r="7"/>

  <line class="svg4-pillar" x1="500" y1="300" x2="500" y2="800"/>
  <polygon class="svg4-base" points="380,800 620,800 590,850 410,850"/>

  <g class="svg4-panleft">
    <line class="svg4-chain" x1="250" y1="300" x2="175" y2="470"/>
    <line class="svg4-chain" x1="250" y1="300" x2="325" y2="470"/>
    <circle class="svg4-halo" cx="250" cy="425" r="95" fill="url(#svg4-glow)"/>
    <path class="svg4-heart" d="M250 462 C205 430 200 385 228 378 C242 375 250 385 250 395 C250 385 258 375 272 378 C300 385 295 430 250 462 Z"/>
    <path class="svg4-bowl" d="M165 470 L335 470 Q250 575 165 470 Z"/>
  </g>

  <g class="svg4-panright">
    <line class="svg4-chain" x1="750" y1="300" x2="675" y2="470"/>
    <line class="svg4-chain" x1="750" y1="300" x2="825" y2="470"/>
    <circle class="svg4-stone" cx="728" cy="452" r="20"/>
    <circle class="svg4-stone" cx="772" cy="456" r="16"/>
    <path class="svg4-bowl" d="M665 470 L835 470 Q750 575 665 470 Z"/>
  </g>

  <g class="svg4-beam">
    <line class="svg4-bar" x1="250" y1="300" x2="750" y2="300"/>
    <circle class="svg4-knob" cx="250" cy="300" r="16"/>
    <circle class="svg4-knob" cx="750" cy="300" r="16"/>
  </g>

  <circle class="svg4-knob" cx="500" cy="300" r="26"/>
  <circle class="svg4-knob" cx="500" cy="255" r="14"/>
</svg>
