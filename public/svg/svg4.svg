<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="svg4-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <style>
      /* Stage 1 (0-2s): the balance scale appears */
      @keyframes svg4-k1 {
        0%   { transform: scale(0.65); opacity: 0.7; }
        30%  { transform: scale(1);    opacity: 1; }
        90%  { transform: scale(1);    opacity: 1; }
        100% { transform: scale(0.65); opacity: 0.7; }
      }
      /* Stage 2 (2-4s): the intention and its result drop into the pans */
      @keyframes svg4-k2 {
        0%, 30%  { opacity: 0; }
        42%, 88% { opacity: 1; }
        100%     { opacity: 0; }
      }
      @keyframes svg4-drop {
        0%, 30%   { transform: translateY(-110px); }
        46%       { transform: translateY(8px); }
        52%, 100% { transform: translateY(0); }
      }
      /* Stage 3 (4-6s): balance is complete, light spreads */
      @keyframes svg4-k3 {
        0%, 63%  { opacity: 0; }
        75%, 88% { opacity: 1; }
        100%     { opacity: 0; }
      }
      @keyframes svg4-wave {
        0%   { transform: scale(0.4); opacity: 0; }
        20%  { opacity: 0.9; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      @keyframes svg4-pulse {
        0%, 100% { transform: scale(0.9); opacity: 0.55; }
        50%      { transform: scale(1.1); opacity: 1; }
      }
      @keyframes svg4-twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.7); }
        50%      { opacity: 1;   transform: scale(1.2); }
      }
      @keyframes svg4-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      .svg4-s1 { animation: svg4-k1 6s ease-in-out infinite; transform-origin: 500px 860px; }
      .svg4-s2 { animation: svg4-k2 6s ease-in-out infinite; }
      .svg4-s3 { animation: svg4-k3 6s ease-in-out infinite; }

      .svg4-halo1 { animation: svg4-pulse 3s ease-in-out infinite; transform-origin: 500px 560px; }
      .svg4-pivot { animation: svg4-pulse 3s ease-in-out infinite; transform-origin: 500px 330px; }

      .svg4-heart { animation: svg4-drop 6s ease-in infinite; }
      .svg4-gem   { animation: svg4-drop 6s ease-in infinite; }

      .svg4-halo3 { animation: svg4-pulse 3s ease-in-out infinite; transform-origin: 500px 330px; }
      .svg4-ring  { animation: svg4-spin 6s linear infinite; transform-origin: 500px 330px; }
      .svg4-w1 { animation: svg4-wave 3s ease-out infinite;     transform-origin: 500px 330px; }
      .svg4-w2 { animation: svg4-wave 3s ease-out infinite -1.5s; transform-origin: 500px 330px; }
      .svg4-sp1 { animation: svg4-twinkle 2s ease-in-out infinite;       transform-origin: 260px 330px; }
      .svg4-sp2 { animation: svg4-twinkle 2s ease-in-out infinite -0.7s; transform-origin: 740px 330px; }
      .svg4-sp3 { animation: svg4-twinkle 3s ease-in-out infinite -1.4s; transform-origin: 500px 190px; }
      .svg4-sp4 { animation: svg4-twinkle 3s ease-in-out infinite -0.5s; transform-origin: 340px 230px; }
      .svg4-sp5 { animation: svg4-twinkle 2s ease-in-out infinite -1.2s; transform-origin: 660px 230px; }
      .svg4-sp6 { animation: svg4-twinkle 2s ease-in-out infinite -0.3s; transform-origin: 500px 700px; }
    </style>
  </defs>

  <!-- Stage 1: the balance scale (pillar, beam, hanging pans) -->
  <g class="svg4-s1">
    <circle class="svg4-halo1" cx="500" cy="560" r="330" fill="url(#svg4-glow)"/>
    <rect x="380" y="835" width="240" height="30" rx="8" fill="#f5d77a" fill-opacity="0.25" stroke="#f5d77a" stroke-width="8"/>
    <rect x="440" y="800" width="120" height="35" rx="8" fill="#1abc9c" fill-opacity="0.25" stroke="#1abc9c" stroke-width="8"/>
    <rect x="488" y="340" width="24" height="460" rx="8" fill="#f5d77a"/>
    <rect x="240" y="322" width="520" height="16" rx="8" fill="#f0c040"/>
    <circle class="svg4-pivot" cx="500" cy="330" r="22" fill="#ffffff"/>
    <path d="M260 330 L190 520 M260 330 L330 520" fill="none" stroke="#8fd3ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M740 330 L670 520 M740 330 L810 520" fill="none" stroke="#8fd3ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M170 520 Q260 625 350 520 Z" fill="#f5d77a" fill-opacity="0.2" stroke="#f5d77a" stroke-width="10" stroke-linejoin="round"/>
    <path d="M650 520 Q740 625 830 520 Z" fill="#f5d77a" fill-opacity="0.2" stroke="#f5d77a" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="260" cy="330" r="10" fill="#ffffff"/>
    <circle cx="740" cy="330" r="10" fill="#ffffff"/>
  </g>

  <!-- Stage 2: a heart (intention) drops in the left pan, a gem (result) in the right pan -->
  <g class="svg4-s2">
    <g class="svg4-heart">
      <path d="M260 548 C220 518 220 478 245 478 C255 478 260 486 260 494 C260 486 265 478 275 478 C300 478 300 518 260 548 Z" fill="#2ecc71" fill-opacity="0.45" stroke="#2ecc71" stroke-width="8" stroke-linejoin="round"/>
    </g>
    <g class="svg4-gem">
      <path d="M740 470 L778 512 L740 560 L702 512 Z" fill="#f0c040" fill-opacity="0.5" stroke="#f0c040" stroke-width="8" stroke-linejoin="round"/>
      <path d="M702 512 L778 512" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Stage 3: the scale is in perfect balance, light and sparkles spread -->
  <g class="svg4-s3">
    <circle class="svg4-halo3" cx="500" cy="330" r="260" fill="url(#svg4-glow)"/>
    <g class="svg4-ring">
      <circle cx="500" cy="330" r="130" fill="none" stroke="#8fd3ff" stroke-width="5" stroke-dasharray="10 18" opacity="0.8"/>
    </g>
    <circle class="svg4-w1" cx="500" cy="330" r="250" fill="none" stroke="#ffffff" stroke-width="7"/>
    <circle class="svg4-w2" cx="500" cy="330" r="250" fill="none" stroke="#f5d77a" stroke-width="7"/>
    <circle class="svg4-sp1" cx="260" cy="330" r="9" fill="#ffffff"/>
    <circle class="svg4-sp2" cx="740" cy="330" r="9" fill="#f0c040"/>
    <circle class="svg4-sp3" cx="500" cy="190" r="9" fill="#8fd3ff"/>
    <circle class="svg4-sp4" cx="340" cy="230" r="8" fill="#f5d77a"/>
    <circle class="svg4-sp5" cx="660" cy="230" r="8" fill="#2ecc71"/>
    <circle class="svg4-sp6" cx="500" cy="700" r="8" fill="#ffffff"/>
  </g>
</svg>
