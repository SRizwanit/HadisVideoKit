<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialGradient id="svg4-glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6c8" stop-opacity=".9"/><stop offset="1" stop-color="#f5d77a" stop-opacity="0"/></radialGradient>
<radialGradient id="svg4-rayg" gradientUnits="userSpaceOnUse" cx="500" cy="520" r="440"><stop offset="0" stop-color="#f5d77a" stop-opacity=".42"/><stop offset="1" stop-color="#f5d77a" stop-opacity="0"/></radialGradient>
<radialGradient id="svg4-gh" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#7ff0c0"/><stop offset="1" stop-color="#1abc9c"/></radialGradient>
<linearGradient id="svg4-gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fe3b8"/><stop offset="1" stop-color="#1abc9c"/></linearGradient>
<linearGradient id="svg4-gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset="1" stop-color="#f0c040"/></linearGradient>
<radialGradient id="svg4-gf" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fff6c8"/><stop offset="1" stop-color="#f0c040"/></radialGradient>
<path id="svg4-route" d="M260,520 Q500,60 740,520"/>
<style>
@keyframes svg4-k1 { 0% { opacity:.5; transform:scale(.85); } 10%,90% { opacity:1; transform:scale(1); } 100% { opacity:.5; transform:scale(.85); } }
@keyframes svg4-k2 { 0%,9% { opacity:0; transform:scale(.6); } 14% { opacity:1; transform:scale(1.08); } 17%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg4-k3 { 0%,19% { opacity:0; transform:scale(.6); } 24% { opacity:1; transform:scale(1.08); } 27%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg4-k4 { 0%,29% { opacity:0; transform:scale(.6); } 34% { opacity:1; transform:scale(1.08); } 37%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg4-k5 { 0%,39% { opacity:0; transform:scale(.6); } 44% { opacity:1; transform:scale(1.08); } 47%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg4-k6 { 0%,49% { opacity:0; transform:scale(.6); } 54% { opacity:1; transform:scale(1.08); } 57%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg4-k7 { 0%,59% { opacity:0; transform:scale(.6); } 64% { opacity:1; transform:scale(1.08); } 67%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg4-k8 { 0%,68% { opacity:0; } 71%,90% { opacity:1; } 100% { opacity:0; } }
@keyframes svg4-k9 { 0%,79% { opacity:0; } 85%,90% { opacity:1; } 100% { opacity:0; } }
@keyframes svg4-k10 { 0%,89% { opacity:0; transform:scale(.5); } 93% { opacity:.9; } 100% { opacity:0; transform:scale(2.6); } }
@keyframes svg4-spin { from { transform:rotate(0deg); } to { transform:rotate(22.5deg); } }
@keyframes svg4-twinkle { 0%,100% { opacity:.25; transform:scale(.6); } 50% { opacity:1; transform:scale(1.15); } }
@keyframes svg4-bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
.svg4-s1 { animation:svg4-k1 6s ease-in-out infinite; transform-origin:500px 520px; }
.svg4-rays { animation:svg4-spin 6s linear infinite; transform-origin:500px 520px; }
.svg4-s2 { animation:svg4-k2 6s ease-in-out infinite; transform-origin:500px 870px; }
.svg4-s3 { animation:svg4-k3 6s ease-in-out infinite; transform-origin:500px 400px; }
.svg4-s4 { animation:svg4-k4 6s ease-in-out infinite; transform-origin:260px 400px; }
.svg4-s5 { animation:svg4-k5 6s ease-in-out infinite; transform-origin:740px 400px; }
.svg4-s6 { animation:svg4-k6 6s ease-in-out infinite; transform-origin:260px 612px; }
.svg4-s7 { animation:svg4-k7 6s ease-in-out infinite; transform-origin:740px 608px; }
.svg4-s8 { animation:svg4-k8 6s ease-in-out infinite; }
.svg4-s9 { animation:svg4-k9 6s ease-in-out infinite; }
.svg4-s10 { animation:svg4-k10 6s ease-out infinite; transform-origin:500px 520px; }
.svg4-tw { animation:svg4-twinkle 2s ease-in-out infinite; }
.svg4-bob { animation:svg4-bob 2s ease-in-out infinite; }
</style>
</defs>

<!-- Stage 1 (0-10%): sunburst rays + soft glow -->
<g class="svg4-s1">
<circle cx="500" cy="520" r="330" fill="url(#svg4-glow)" opacity=".35"/>
<g class="svg4-rays"><polygon points="500,520 470,80 530,80" fill="url(#svg4-rayg)" transform="rotate(0.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg4-rayg)" transform="rotate(22.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg4-rayg)" transform="rotate(45.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg4-rayg)" transform="rotate(67.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg4-rayg)" transform="rotate(90.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg4-rayg)" transform="rotate(112.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg4-rayg)" transform="rotate(135.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg4-rayg)" transform="rotate(157.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg4-rayg)" transform="rotate(180.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg4-rayg)" transform="rotate(202.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg4-rayg)" transform="rotate(225.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg4-rayg)" transform="rotate(247.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg4-rayg)" transform="rotate(270.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg4-rayg)" transform="rotate(292.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg4-rayg)" transform="rotate(315.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg4-rayg)" transform="rotate(337.5 500 520)"/></g>
</g>

<!-- Stage 2 (10-20%): scale base, pillar and finial -->
<g class="svg4-s2">
<ellipse cx="500" cy="886" rx="200" ry="16" fill="#ffffff" opacity=".12"/>
<path d="M380,880 L420,830 H580 L620,880 Z" fill="url(#svg4-gt)" stroke="#f0c040" stroke-width="8" stroke-linejoin="round"/>
<rect x="484" y="400" width="32" height="432" rx="10" fill="url(#svg4-gt)" stroke="#f0c040" stroke-width="6"/>
</g>

<!-- Stage 3 (20-30%): balanced beam, pivot and finial -->
<g class="svg4-s3">
<rect x="240" y="388" width="520" height="24" rx="12" fill="url(#svg4-gg)" stroke="#fff0b0" stroke-width="4"/>
<circle cx="500" cy="400" r="30" fill="#f0c040" stroke="#fff6c8" stroke-width="6"/>
<circle cx="500" cy="400" r="11" fill="#ffffff"/>
<circle cx="500" cy="350" r="14" fill="#fff0b0"/>
</g>

<!-- Stage 4 (30-40%): left chains and pan (the heart side) -->
<g class="svg4-s4"><path d="M260,400 L180,610 M260,400 L340,610" stroke="#f0c040" stroke-width="6" stroke-linecap="round"/><path d="M160,610 H360 Q350,680 260,680 Q170,680 160,610 Z" fill="url(#svg4-gg)" stroke="#fff0b0" stroke-width="5" stroke-linejoin="round"/></g>

<!-- Stage 5 (40-50%): right chains and pan (the result side) -->
<g class="svg4-s5"><path d="M740,400 L660,610 M740,400 L820,610" stroke="#f0c040" stroke-width="6" stroke-linecap="round"/><path d="M640,610 H840 Q830,680 740,680 Q650,680 640,610 Z" fill="url(#svg4-gg)" stroke="#fff0b0" stroke-width="5" stroke-linejoin="round"/></g>

<!-- Stage 6 (50-60%): the heart (niyyah) lands in the left pan -->
<g class="svg4-s6">
<path d="M500,830 C380,750 330,690 345,640 C360,590 440,585 500,650 C560,585 640,590 655,640 C670,690 620,750 500,830 Z" transform="translate(260,612) scale(.3) translate(-500,-830)" fill="url(#svg4-gh)" stroke="#f0c040" stroke-width="30" stroke-linejoin="round"/>
</g>

<!-- Stage 7 (60-70%): the fruit (result) appears in the right pan -->
<g class="svg4-s7">
<circle cx="740" cy="562" r="46" fill="url(#svg4-gf)" stroke="#f0c040" stroke-width="5"/>
<path d="M716,548 A32,32 0 0 1 738,526" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="7" stroke-linecap="round"/>
<path d="M740,518 Q740,500 752,490" fill="none" stroke="#2ecc71" stroke-width="7" stroke-linecap="round"/>
<path d="M752,494 C764,478 786,480 792,490 C782,504 764,504 752,494 Z" fill="#2ecc71"/>
</g>

<!-- Stage 8 (70-80%): the light of intention travels to the result -->
<g class="svg4-s8">
<path d="M260,520 Q500,60 740,520" fill="none" stroke="#8fd3ff" stroke-opacity=".7" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 18"/>
<g>
<circle cx="0" cy="0" r="46" fill="url(#svg4-glow)"/>
<circle cx="0" cy="0" r="14" fill="#ffffff"/>
<animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7;0.8;1"><mpath href="#svg4-route"/></animateMotion>
</g>
</g>

<!-- Stage 9 (80-90%): both sides glow, a check badge appears -->
<g class="svg4-s9">
<circle cx="260" cy="570" r="120" fill="url(#svg4-glow)"/>
<circle cx="740" cy="562" r="120" fill="url(#svg4-glow)"/>
<circle cx="500" cy="200" r="44" fill="url(#svg4-gh)" stroke="#f0c040" stroke-width="7"/>
<path d="M478,202 L494,218 L525,184" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<path class="svg4-tw" style="transform-origin:150px 480px; animation-delay:-0.3s" d="M150,460 Q150,480 170,480 Q150,480 150,500 Q150,480 130,480 Q150,480 150,460 Z" fill="#fff6c8"/><path class="svg4-tw" style="transform-origin:860px 470px; animation-delay:-0.9s" d="M860,448 Q860,470 882,470 Q860,470 860,492 Q860,470 838,470 Q860,470 860,448 Z" fill="#fff6c8"/><path class="svg4-tw" style="transform-origin:380px 250px; animation-delay:-1.5s" d="M380,234 Q380,250 396,250 Q380,250 380,266 Q380,250 364,250 Q380,250 380,234 Z" fill="#fff6c8"/><path class="svg4-tw" style="transform-origin:640px 250px; animation-delay:-0.6s" d="M640,236 Q640,250 654,250 Q640,250 640,264 Q640,250 626,250 Q640,250 640,236 Z" fill="#fff6c8"/>
</g>

<!-- Stage 10 (90-100%): halo pulse, then fade back to stage 1 -->
<g class="svg4-s10">
<circle cx="500" cy="520" r="150" fill="none" stroke="#f5d77a" stroke-width="12"/>
<circle cx="500" cy="520" r="150" fill="url(#svg4-glow)" opacity=".5"/>
</g>
</svg>
