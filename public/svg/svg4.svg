<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="svg4-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9ffb8" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#2ecc71" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes svg4-coin {
        0%   { transform: translateY(0) scale(0.6); opacity: 0.7; }
        30%  { transform: translateY(0) scale(1); opacity: 1; }
        38%  { transform: translateY(0) scale(1); opacity: 1; }
        54%  { transform: translateY(270px) scale(0.85); opacity: 1; }
        60%  { transform: translateY(300px) scale(0.7); opacity: 0; }
        92%  { transform: translateY(300px) scale(0.7); opacity: 0; }
        96%  { transform: translateY(0) scale(0.6); opacity: 0; }
        100% { transform: translateY(0) scale(0.6); opacity: 0.7; }
      }
      @keyframes svg4-k2 {
        0%, 28%   { opacity: 0; }
        42%, 86%  { opacity: 1; }
        100%      { opacity: 0; }
      }
      @keyframes svg4-k3 {
        0%, 63%   { opacity: 0; transform: scale(0.85); }
        78%, 88%  { opacity: 1; transform: scale(1); }
        100%      { opacity: 0; transform: scale(0.85); }
      }
      @keyframes svg4-ra {
        0%, 55%  { opacity: 0; transform: scale(0.2); }
        58%      { opacity: 0.9; transform: scale(0.3); }
        80%      { opacity: 0; transform: scale(1.7); }
        100%     { opacity: 0; transform: scale(1.7); }
      }
      @keyframes svg4-rb {
        0%, 61%  { opacity: 0; transform: scale(0.2); }
        64%      { opacity: 0.8; transform: scale(0.3); }
        86%      { opacity: 0; transform: scale(1.7); }
        100%     { opacity: 0; transform: scale(1.7); }
      }
      @keyframes svg4-rc {
        0%, 67%  { opacity: 0; transform: scale(0.2); }
        70%      { opacity: 0.7; transform: scale(0.3); }
        92%      { opacity: 0; transform: scale(1.7); }
        100%     { opacity: 0; transform: scale(1.7); }
      }
      @keyframes svg4-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes svg4-twinkle { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      .svg4-s1 { animation: svg4-coin 6s ease-in-out infinite; transform-origin: 500px 330px; }
      .svg4-s2 { animation: svg4-k2 6s ease-in-out infinite; }
      .svg4-s3 { animation: svg4-k3 6s ease-in-out infinite; transform-origin: 500px 560px; }
      .svg4-r1 { animation: svg4-ra 6s ease-out infinite; transform-origin: 500px 650px; }
      .svg4-r2 { animation: svg4-rb 6s ease-out infinite; transform-origin: 500px 650px; }
      .svg4-r3 { animation: svg4-rc 6s ease-out infinite; transform-origin: 500px 650px; }
      .svg4-ring { animation: svg4-spin 6s linear infinite; transform-origin: 500px 560px; }
      .svg4-tw { animation: svg4-twinkle 2s ease-in-out infinite; }
      .svg4-tw2 { animation: svg4-twinkle 2s ease-in-out infinite; animation-delay: -1s; }
    </style>
  </defs>

  <!-- Stage 1: a small coin (falls into the bowl during stage 2) -->
  <g class="svg4-s1">
    <circle cx="500" cy="330" r="62" fill="#f0c040"/>
    <circle cx="500" cy="330" r="44" fill="none" stroke="#fff6c8" stroke-width="8"/>
    <circle cx="500" cy="330" r="12" fill="#ffffff"/>
  </g>

  <!-- Stage 2: bowl of water and spreading ripples -->
  <g class="svg4-s2">
    <path d="M360 650 Q360 810 500 810 Q640 810 640 650 Z" fill="#8fd3ff" fill-opacity="0.18" stroke="#8fd3ff" stroke-width="10" stroke-linejoin="round"/>
    <ellipse cx="500" cy="650" rx="140" ry="26" fill="#8fd3ff" fill-opacity="0.25" stroke="#8fd3ff" stroke-width="8"/>
    <ellipse class="svg4-r1" cx="500" cy="650" rx="110" ry="20" fill="none" stroke="#ffffff" stroke-width="6"/>
    <ellipse class="svg4-r2" cx="500" cy="650" rx="110" ry="20" fill="none" stroke="#1abc9c" stroke-width="6"/>
    <ellipse class="svg4-r3" cx="500" cy="650" rx="110" ry="20" fill="none" stroke="#8fd3ff" stroke-width="6"/>
  </g>

  <!-- Stage 3: soft green-gold glow of peace -->
  <g class="svg4-s3">
    <circle cx="500" cy="560" r="400" fill="url(#svg4-glow)"/>
    <g class="svg4-ring">
      <circle cx="500" cy="260" r="12" fill="#f5d77a"/>
      <circle cx="760" cy="410" r="10" fill="#2ecc71"/>
      <circle cx="760" cy="710" r="12" fill="#f5d77a"/>
      <circle cx="500" cy="860" r="10" fill="#2ecc71"/>
      <circle cx="240" cy="710" r="12" fill="#f5d77a"/>
      <circle cx="240" cy="410" r="10" fill="#2ecc71"/>
    </g>
    <circle class="svg4-tw" cx="330" cy="250" r="8" fill="#ffffff"/>
    <circle class="svg4-tw2" cx="680" cy="240" r="8" fill="#ffffff"/>
    <circle class="svg4-tw2" cx="500" cy="520" r="9" fill="#f5d77a"/>
  </g>
</svg>
