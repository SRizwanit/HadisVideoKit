<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Part 9D নমুনা svg2: শুধু SMIL অ্যানিমেশন (<animate>, <animateTransform>, <animateMotion>),
       ৬ সেকেন্ডের লুপ (সব সময় ৬-এর ভাজক: ২s/৩s/৬s), স্বচ্ছ ব্যাকগ্রাউন্ড, কোনো script ট্যাগ বা বাইরের ফাইল নেই।
       নিজের svg2.svg আপলোড করলে এটা বদলে যাবে। -->
  <defs>
    <radialGradient id="svg2-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9fff0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1abc9c" stop-opacity="0"/>
    </radialGradient>
    <path id="svg2-orbit" d="M500,60 A440,440 0 1 1 499.9,60 Z"/>
  </defs>

  <circle cx="500" cy="500" r="330" fill="url(#svg2-halo)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="500" cy="500" r="350" fill="none" stroke="#f5d77a" stroke-width="10">
    <animate attributeName="r" values="330;385;330" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 500 500" to="360 500 500" dur="6s" repeatCount="indefinite"/>
    <rect x="290" y="290" width="420" height="420" rx="18" fill="none" stroke="#2ecc71" stroke-width="16"/>
    <rect x="290" y="290" width="420" height="420" rx="18" fill="none" stroke="#ffffff" stroke-width="16" transform="rotate(45 500 500)"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 500 500" to="0 500 500" dur="3s" repeatCount="indefinite"/>
    <rect x="400" y="400" width="200" height="200" rx="10" fill="none" stroke="#f5d77a" stroke-width="10"/>
    <rect x="400" y="400" width="200" height="200" rx="10" fill="none" stroke="#1abc9c" stroke-width="10" transform="rotate(45 500 500)"/>
  </g>

  <path d="M517.8,406.7 A95,95 0 1 0 583.5,545.4 A78,78 0 1 1 517.8,406.7 Z" fill="#f5d77a">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="2s" repeatCount="indefinite"/>
  </path>

  <circle cx="0" cy="0" r="28" fill="#ffffff">
    <animateMotion dur="6s" begin="0s" repeatCount="indefinite"><mpath href="#svg2-orbit"/></animateMotion>
  </circle>
  <circle cx="0" cy="0" r="22" fill="#f5d77a">
    <animateMotion dur="6s" begin="-2s" repeatCount="indefinite"><mpath href="#svg2-orbit"/></animateMotion>
  </circle>
  <circle cx="0" cy="0" r="28" fill="#2ecc71">
    <animateMotion dur="6s" begin="-4s" repeatCount="indefinite"><mpath href="#svg2-orbit"/></animateMotion>
  </circle>
</svg>
