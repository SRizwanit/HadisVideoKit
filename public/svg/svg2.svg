<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="svg2-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <style>
      /* Stage 1 (0-2s): the minbar steps rise */
      @keyframes svg2-k1 {
        0%   { transform: scale(0.65); opacity: 0.7; }
        30%  { transform: scale(1);    opacity: 1; }
        90%  { transform: scale(1);    opacity: 1; }
        100% { transform: scale(0.65); opacity: 0.7; }
      }
      /* Stage 2 (2-4s): pillars, dome and crescent appear */
      @keyframes svg2-k2 {
        0%, 30%  { opacity: 0; transform: translateY(40px); }
        45%, 88% { opacity: 1; transform: translateY(0); }
        100%     { opacity: 0; transform: translateY(40px); }
      }
      /* Stage 3 (4-6s): voice waves and glow spread out */
      @keyframes svg2-k3 {
        0%, 63%  { opacity: 0; }
        78%, 88% { opacity: 1; }
        100%     { opacity: 0; }
      }
      @keyframes svg2-wave {
        0%   { transform: scale(0.4); opacity: 0; }
        20%  { opacity: 0.9; }
        100% { transform: scale(1.5); opacity: 0; }
      }
      @keyframes svg2-pulse {
        0%, 100% { transform: scale(0.9); opacity: 0.55; }
        50%      { transform: scale(1.1); opacity: 1; }
      }
      @keyframes svg2-twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.7); }
        50%      { opacity: 1;   transform: scale(1.2); }
      }
      @keyframes svg2-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      .svg2-s1 { animation: svg2-k1 6s ease-in-out infinite; transform-origin: 500px 840px; }
      .svg2-s2 { animation: svg2-k2 6s ease-in-out infinite; }
      .svg2-s3 { animation: svg2-k3 6s ease-in-out infinite; }

      .svg2-halo1 { animation: svg2-pulse 3s ease-in-out infinite; transform-origin: 500px 760px; }
      .svg2-moon  { animation: svg2-pulse 3s ease-in-out infinite; transform-origin: 500px 395px; }
      .svg2-ring  { animation: svg2-spin 6s linear infinite; transform-origin: 500px 520px; }

      .svg2-halo3 { animation: svg2-pulse 3s ease-in-out infinite; transform-origin: 500px 520px; }
      .svg2-w1 { animation: svg2-wave 3s ease-out infinite;       transform-origin: 500px 520px; }
      .svg2-w2 { animation: svg2-wave 3s ease-out infinite -1s;   transform-origin: 500px 520px; }
      .svg2-w3 { animation: svg2-wave 3s ease-out infinite -2s;   transform-origin: 500px 520px; }
      .svg2-sp1 { animation: svg2-twinkle 2s ease-in-out infinite;       transform-origin: 250px 300px; }
      .svg2-sp2 { animation: svg2-twinkle 2s ease-in-out infinite -0.7s; transform-origin: 750px 300px; }
      .svg2-sp3 { animation: svg2-twinkle 3s ease-in-out infinite -1.4s; transform-origin: 200px 560px; }
      .svg2-sp4 { animation: svg2-twinkle 3s ease-in-out infinite -0.5s; transform-origin: 800px 560px; }
      .svg2-sp5 { animation: svg2-twinkle 2s ease-in-out infinite -1.2s; transform-origin: 340px 200px; }
      .svg2-sp6 { animation: svg2-twinkle 2s ease-in-out infinite -0.3s; transform-origin: 660px 200px; }
    </style>
  </defs>

  <!-- Stage 1: the minbar's three steps and landing -->
  <g class="svg2-s1">
    <circle class="svg2-halo1" cx="500" cy="760" r="230" fill="url(#svg2-glow)"/>
    <rect x="320" y="790" width="360" height="60" rx="8" fill="#f5d77a" fill-opacity="0.2" stroke="#f5d77a" stroke-width="10"/>
    <rect x="370" y="730" width="260" height="60" rx="8" fill="#1abc9c" fill-opacity="0.18" stroke="#1abc9c" stroke-width="10"/>
    <rect x="420" y="670" width="160" height="60" rx="8" fill="#8fd3ff" fill-opacity="0.18" stroke="#8fd3ff" stroke-width="10"/>
    <rect x="400" y="640" width="200" height="30" rx="6" fill="#f0c040" fill-opacity="0.35" stroke="#f0c040" stroke-width="8"/>
    <circle cx="500" cy="820" r="9" fill="#ffffff"/>
    <circle cx="500" cy="760" r="9" fill="#ffffff"/>
    <circle cx="500" cy="700" r="9" fill="#ffffff"/>
  </g>

  <!-- Stage 2: pillars, dome canopy and crescent above the pulpit -->
  <g class="svg2-s2">
    <rect x="415" y="520" width="18" height="120" rx="6" fill="#f5d77a"/>
    <rect x="567" y="520" width="18" height="120" rx="6" fill="#f5d77a"/>
    <path d="M405 525 Q500 380 595 525 Z" fill="#1abc9c" fill-opacity="0.2" stroke="#f5d77a" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="500" cy="500" r="16" fill="#ffffff"/>
    <g class="svg2-moon">
      <path d="M500 345 A45 45 0 1 0 535 425 A36 36 0 1 1 500 345 Z" fill="#f0c040" stroke="#fff6c8" stroke-width="4"/>
    </g>
    <g class="svg2-ring">
      <circle cx="500" cy="520" r="170" fill="none" stroke="#8fd3ff" stroke-width="5" stroke-dasharray="10 18" opacity="0.7"/>
    </g>
  </g>

  <!-- Stage 3: the voice spreads in waves, sparkles and a glow -->
  <g class="svg2-s3">
    <circle class="svg2-halo3" cx="500" cy="520" r="300" fill="url(#svg2-glow)"/>
    <circle class="svg2-w1" cx="500" cy="520" r="280" fill="none" stroke="#ffffff" stroke-width="8"/>
    <circle class="svg2-w2" cx="500" cy="520" r="280" fill="none" stroke="#f5d77a" stroke-width="8"/>
    <circle class="svg2-w3" cx="500" cy="520" r="280" fill="none" stroke="#2ecc71" stroke-width="8"/>
    <circle class="svg2-sp1" cx="250" cy="300" r="9" fill="#ffffff"/>
    <circle class="svg2-sp2" cx="750" cy="300" r="9" fill="#f0c040"/>
    <circle class="svg2-sp3" cx="200" cy="560" r="8" fill="#8fd3ff"/>
    <circle class="svg2-sp4" cx="800" cy="560" r="8" fill="#ffffff"/>
    <circle class="svg2-sp5" cx="340" cy="200" r="7" fill="#f5d77a"/>
    <circle class="svg2-sp6" cx="660" cy="200" r="7" fill="#2ecc71"/>
  </g>
</svg>
