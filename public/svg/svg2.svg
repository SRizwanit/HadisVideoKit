<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="svg2-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes svg2-rays {
        from { transform: rotate(0deg); }
        to   { transform: rotate(45deg); }
      }
      @keyframes svg2-pulse {
        0%, 100% { transform: scale(0.85); opacity: 0.45; }
        50%      { transform: scale(1.08); opacity: 1; }
      }
      @keyframes svg2-twinkle {
        0%, 100% { opacity: 0.2; }
        50%      { opacity: 0.95; }
      }
      @keyframes svg2-finial {
        0%, 100% { transform: scale(0.8); opacity: 0.5; }
        50%      { transform: scale(1.5); opacity: 1; }
      }
      .svg2-rays { animation: svg2-rays 6s linear infinite; transform-origin: 490px 560px; }
      .svg2-ray { stroke: #f5d77a; stroke-width: 12; stroke-linecap: round; opacity: 0.4; }
      .svg2-halo { animation: svg2-pulse 3s ease-in-out infinite; transform-origin: 490px 560px; }
      .svg2-body { fill: #f5d77a; fill-opacity: 0.25; stroke: #f5d77a; stroke-width: 14; stroke-linejoin: round; }
      .svg2-post { stroke: #1abc9c; stroke-width: 14; stroke-linecap: round; }
      .svg2-dome { fill: #f5d77a; fill-opacity: 0.9; stroke: #ffffff; stroke-width: 8; stroke-linejoin: round; }
      .svg2-stem { stroke: #ffffff; stroke-width: 8; stroke-linecap: round; }
      .svg2-finial { fill: #ffffff; animation: svg2-finial 2s ease-in-out infinite; transform-origin: 595px 328px; }
      .svg2-star { fill: #ffffff; animation: svg2-twinkle 3s ease-in-out infinite; }
      .svg2-s2 { animation-delay: -1s; }
      .svg2-s3 { animation-delay: -2s; }
    </style>
  </defs>

  <circle class="svg2-halo" cx="490" cy="560" r="340" fill="url(#svg2-glow)"/>

  <g class="svg2-rays">
    <line class="svg2-ray" x1="490" y1="410" x2="490" y2="220"/>
    <line class="svg2-ray" x1="490" y1="410" x2="490" y2="220" transform="rotate(45 490 560)"/>
    <line class="svg2-ray" x1="490" y1="410" x2="490" y2="220" transform="rotate(90 490 560)"/>
    <line class="svg2-ray" x1="490" y1="410" x2="490" y2="220" transform="rotate(135 490 560)"/>
    <line class="svg2-ray" x1="490" y1="410" x2="490" y2="220" transform="rotate(180 490 560)"/>
    <line class="svg2-ray" x1="490" y1="410" x2="490" y2="220" transform="rotate(225 490 560)"/>
    <line class="svg2-ray" x1="490" y1="410" x2="490" y2="220" transform="rotate(270 490 560)"/>
    <line class="svg2-ray" x1="490" y1="410" x2="490" y2="220" transform="rotate(315 490 560)"/>
  </g>

  <circle class="svg2-star" cx="200" cy="260" r="8"/>
  <circle class="svg2-star svg2-s2" cx="800" cy="280" r="10"/>
  <circle class="svg2-star svg2-s3" cx="160" cy="620" r="7"/>
  <circle class="svg2-star" cx="850" cy="640" r="7"/>

  <path class="svg2-body" d="M310 800 L310 760 L380 760 L380 700 L450 700 L450 640 L520 640 L520 580 L660 580 L660 800 Z"/>

  <line class="svg2-post" x1="535" y1="580" x2="535" y2="450"/>
  <line class="svg2-post" x1="645" y1="580" x2="645" y2="450"/>

  <path class="svg2-dome" d="M520 450 A75 75 0 0 1 670 450 Z"/>
  <line class="svg2-stem" x1="595" y1="375" x2="595" y2="340"/>
  <circle class="svg2-finial" cx="595" cy="328" r="11"/>
</svg>
