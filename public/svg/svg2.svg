<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialGradient id="svg2-glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6c8" stop-opacity=".9"/><stop offset="1" stop-color="#f5d77a" stop-opacity="0"/></radialGradient>
<radialGradient id="svg2-rayg" gradientUnits="userSpaceOnUse" cx="500" cy="520" r="440"><stop offset="0" stop-color="#f5d77a" stop-opacity=".42"/><stop offset="1" stop-color="#f5d77a" stop-opacity="0"/></radialGradient>
<linearGradient id="svg2-gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fe3b8"/><stop offset="1" stop-color="#1abc9c"/></linearGradient>
<linearGradient id="svg2-gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset="1" stop-color="#f0c040"/></linearGradient>
<style>
@keyframes svg2-k1 { 0% { opacity:.5; transform:scale(.85); } 10%,90% { opacity:1; transform:scale(1); } 100% { opacity:.5; transform:scale(.85); } }
@keyframes svg2-k2 { 0%,9% { opacity:0; transform:scale(.6); } 14% { opacity:1; transform:scale(1.08); } 17%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg2-k3 { 0%,19% { opacity:0; } 25%,90% { opacity:1; } 100% { opacity:0; } }
@keyframes svg2-k4 { 0%,29% { opacity:0; } 35%,90% { opacity:1; } 100% { opacity:0; } }
@keyframes svg2-k5 { 0%,39% { opacity:0; transform:scale(.6); } 44% { opacity:1; transform:scale(1.08); } 47%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg2-k6 { 0%,49% { opacity:0; transform:scale(.6); } 54% { opacity:1; transform:scale(1.08); } 57%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg2-k7 { 0%,59% { opacity:0; transform:scale(.6); } 64% { opacity:1; transform:scale(1.08); } 67%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg2-k8 { 0%,68% { opacity:0; } 71%,90% { opacity:1; } 100% { opacity:0; } }
@keyframes svg2-k9 { 0%,79% { opacity:0; } 85%,90% { opacity:1; } 100% { opacity:0; } }
@keyframes svg2-k10 { 0%,89% { opacity:0; transform:scale(.5); } 93% { opacity:.9; } 100% { opacity:0; transform:scale(2.6); } }
@keyframes svg2-spin { from { transform:rotate(0deg); } to { transform:rotate(22.5deg); } }
@keyframes svg2-twinkle { 0%,100% { opacity:.25; transform:scale(.6); } 50% { opacity:1; transform:scale(1.15); } }
@keyframes svg2-ripple { 0% { opacity:.9; transform:scale(.35); } 100% { opacity:0; transform:scale(1.7); } }
.svg2-s1 { animation:svg2-k1 6s ease-in-out infinite; transform-origin:500px 520px; }
.svg2-rays { animation:svg2-spin 6s linear infinite; transform-origin:500px 520px; }
.svg2-s2 { animation:svg2-k2 6s ease-in-out infinite; transform-origin:500px 860px; }
.svg2-s3 { animation:svg2-k3 6s ease-in-out infinite; }
.svg2-s4 { animation:svg2-k4 6s ease-in-out infinite; }
.svg2-s5 { animation:svg2-k5 6s ease-in-out infinite; transform-origin:640px 660px; }
.svg2-s6 { animation:svg2-k6 6s ease-in-out infinite; transform-origin:640px 520px; }
.svg2-s7 { animation:svg2-k7 6s ease-in-out infinite; transform-origin:640px 385px; }
.svg2-s8 { animation:svg2-k8 6s ease-in-out infinite; }
.svg2-s9 { animation:svg2-k9 6s ease-in-out infinite; }
.svg2-s10 { animation:svg2-k10 6s ease-out infinite; transform-origin:500px 520px; }
.svg2-tw { animation:svg2-twinkle 2s ease-in-out infinite; }
.svg2-rp { animation:svg2-ripple 2s ease-out infinite; transform-origin:640px 590px; }
</style>
</defs>

<!-- Stage 1 (0-10%): sunburst rays + soft glow -->
<g class="svg2-s1">
<circle cx="500" cy="520" r="330" fill="url(#svg2-glow)" opacity=".35"/>
<g class="svg2-rays"><polygon points="500,520 470,80 530,80" fill="url(#svg2-rayg)" transform="rotate(0.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg2-rayg)" transform="rotate(22.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg2-rayg)" transform="rotate(45.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg2-rayg)" transform="rotate(67.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg2-rayg)" transform="rotate(90.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg2-rayg)" transform="rotate(112.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg2-rayg)" transform="rotate(135.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg2-rayg)" transform="rotate(157.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg2-rayg)" transform="rotate(180.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg2-rayg)" transform="rotate(202.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg2-rayg)" transform="rotate(225.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg2-rayg)" transform="rotate(247.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg2-rayg)" transform="rotate(270.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg2-rayg)" transform="rotate(292.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg2-rayg)" transform="rotate(315.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg2-rayg)" transform="rotate(337.5 500 520)"/></g>
</g>

<!-- Stage 2 (10-20%): the stepped minbar body -->
<g class="svg2-s2">
<ellipse cx="500" cy="880" rx="300" ry="20" fill="#ffffff" opacity=".12"/>
<path d="M240,860 L240,800 L380,800 L380,730 L520,730 L520,660 L760,660 L760,860 Z" fill="url(#svg2-gt)" stroke="#f0c040" stroke-width="10" stroke-linejoin="round"/>
</g>

<!-- Stage 3 (20-30%): gold step edges and inlay diamonds -->
<g class="svg2-s3">
<path d="M240,800 L380,800 L380,730 L520,730 L520,660 L760,660" fill="none" stroke="#fff0b0" stroke-width="8" stroke-linejoin="round" opacity=".9"/>
<path d="M580,760 L606,786 L580,812 L554,786 Z M640,760 L666,786 L640,812 L614,786 Z M700,760 L726,786 L700,812 L674,786 Z M450,770 L470,790 L450,810 L430,790 Z" fill="#fff6dc" opacity=".9"/>
<path d="M290,832 L304,846 L290,860 L276,846 Z" fill="#fff6dc" opacity=".0"/>
<path d="M270,830 H350 M545,835 H735" stroke="#f0c040" stroke-width="6" stroke-linecap="round" opacity=".8"/>
</g>

<!-- Stage 4 (30-40%): railing along the stairs -->
<g class="svg2-s4">
<path d="M250,730 L541,585" stroke="#f0c040" stroke-width="12" stroke-linecap="round"/>
<path d="M290,800 L290,710.0" stroke="#f0c040" stroke-width="8" stroke-linecap="round"/><path d="M350,800 L350,680.0" stroke="#f0c040" stroke-width="8" stroke-linecap="round"/><path d="M410,730 L410,650.0" stroke="#f0c040" stroke-width="8" stroke-linecap="round"/><path d="M480,730 L480,615.0" stroke="#f0c040" stroke-width="8" stroke-linecap="round"/>
</g>

<!-- Stage 5 (40-50%): top platform pillars and arch -->
<g class="svg2-s5">
<rect x="541" y="520" width="16" height="140" rx="6" fill="url(#svg2-gg)"/>
<rect x="723" y="520" width="16" height="140" rx="6" fill="url(#svg2-gg)"/>
<path d="M557,610 Q640,520 723,610" fill="none" stroke="#fff0b0" stroke-width="8" stroke-linecap="round"/>
<path class="svg2-tw" style="transform-origin:800px 600px; animation-delay:0s" d="M800,582 Q800,600 818,600 Q800,600 800,618 Q800,600 782,600 Q800,600 800,582 Z" fill="#fff6c8"/>
</g>

<!-- Stage 6 (50-60%): dome canopy -->
<g class="svg2-s6">
<path d="M526,528 Q530,430 640,415 Q750,430 754,528 Z" fill="url(#svg2-gg)" stroke="#f5d77a" stroke-width="6" stroke-linejoin="round"/>
<path d="M526,528 H754" stroke="#1abc9c" stroke-width="16" stroke-linecap="round"/>
<path d="M590,505 Q595,450 640,440" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="8" stroke-linecap="round"/>
</g>

<!-- Stage 7 (60-70%): crescent finial -->
<g class="svg2-s7">
<path d="M652,350 A26,26 0 1 0 652,402 A20,20 0 1 1 652,350 Z" fill="#fff0b0" stroke="#f0c040" stroke-width="4"/>
<circle cx="640" cy="330" r="8" fill="#ffffff"/>
</g>

<!-- Stage 8 (70-80%): the voice spreads (ripples) -->
<g class="svg2-s8">
<circle class="svg2-rp" cx="640" cy="590" r="170" fill="none" stroke="#8fd3ff" stroke-width="7"/>
<circle class="svg2-rp" style="animation-delay:-.67s" cx="640" cy="590" r="170" fill="none" stroke="#8fd3ff" stroke-width="7"/>
<circle class="svg2-rp" style="animation-delay:-1.34s" cx="640" cy="590" r="170" fill="none" stroke="#8fd3ff" stroke-width="7"/>
</g>

<!-- Stage 9 (80-90%): the whole minbar glows -->
<g class="svg2-s9">
<circle cx="640" cy="540" r="260" fill="url(#svg2-glow)"/>
<path class="svg2-tw" style="transform-origin:300px 600px; animation-delay:-0.3s" d="M300,580 Q300,600 320,600 Q300,600 300,620 Q300,600 280,600 Q300,600 300,580 Z" fill="#fff6c8"/><path class="svg2-tw" style="transform-origin:840px 470px; animation-delay:-0.9s" d="M840,448 Q840,470 862,470 Q840,470 840,492 Q840,470 818,470 Q840,470 840,448 Z" fill="#fff6c8"/><path class="svg2-tw" style="transform-origin:470px 450px; animation-delay:-1.5s" d="M470,434 Q470,450 486,450 Q470,450 470,466 Q470,450 454,450 Q470,450 470,434 Z" fill="#fff6c8"/><path class="svg2-tw" style="transform-origin:700px 330px; animation-delay:-0.6s" d="M700,316 Q700,330 714,330 Q700,330 700,344 Q700,330 686,330 Q700,330 700,316 Z" fill="#fff6c8"/>
</g>

<!-- Stage 10 (90-100%): halo pulse, then fade back to stage 1 -->
<g class="svg2-s10">
<circle cx="500" cy="520" r="150" fill="none" stroke="#f5d77a" stroke-width="12"/>
<circle cx="500" cy="520" r="150" fill="url(#svg2-glow)" opacity=".5"/>
</g>
</svg>
