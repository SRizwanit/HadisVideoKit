<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="svg2-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#8fd3ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8fd3ff" stop-opacity="0"/>
    </radialGradient>
    <style>
      /* Stage 1: মুদ্রা ও ক্যামেরার লেন্স (শুরুতে ছোট থেকে বড় হয়) */
      @keyframes svg2-k1 {
        0%   { transform: scale(0.6); opacity: 0.7; }
        30%  { transform: scale(1);   opacity: 1; }
        90%  { transform: scale(1);   opacity: 1; }
        100% { transform: scale(0.6); opacity: 0.7; }
      }
      /* মুদ্রা: শেষ ধাপে ম্লান হয়, লুপের শেষে আবার উজ্জ্বল */
      @keyframes svg2-coin {
        0%, 60%   { opacity: 1; }
        78%, 90%  { opacity: 0.22; }
        100%      { opacity: 1; }
      }
      /* Stage 2: ৩৩% এ ফোটে, ৯০% এ মিলিয়ে যায় */
      @keyframes svg2-k2 {
        0%, 30%   { opacity: 0; }
        38%, 88%  { opacity: 1; }
        100%      { opacity: 0; }
      }
      /* সংখ্যা ধাপে ধাপে বাড়ে */
      @keyframes svg2-k2a {
        0%, 32%   { opacity: 0; }
        40%, 88%  { opacity: 1; }
        100%      { opacity: 0; }
      }
      @keyframes svg2-k2b {
        0%, 42%   { opacity: 0; }
        50%, 88%  { opacity: 1; }
        100%      { opacity: 0; }
      }
      @keyframes svg2-k2c {
        0%, 52%   { opacity: 0; }
        60%, 88%  { opacity: 1; }
        100%      { opacity: 0; }
      }
      /* Stage 3: ৬৬% এ ফোটে, ৯০% এ মিলিয়ে যায় */
      @keyframes svg2-k3 {
        0%, 63%   { opacity: 0; }
        78%, 88%  { opacity: 1; }
        100%      { opacity: 0; }
      }
      @keyframes svg2-twinkle {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.4; }
      }
      @keyframes svg2-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .svg2-s1 { animation: svg2-k1 6s ease-in-out infinite; transform-origin: 500px 500px; }
      .svg2-coin { animation: svg2-coin 6s ease-in-out infinite; }
      .svg2-s2 { animation: svg2-k2 6s ease-in-out infinite; }
      .svg2-s2a { animation: svg2-k2a 6s ease-in-out infinite; }
      .svg2-s2b { animation: svg2-k2b 6s ease-in-out infinite; }
      .svg2-s2c { animation: svg2-k2c 6s ease-in-out infinite; }
      .svg2-s3 { animation: svg2-k3 6s ease-in-out infinite; }
      .svg2-tw1 { animation: svg2-twinkle 2s ease-in-out infinite; }
      .svg2-tw2 { animation: svg2-twinkle 2s ease-in-out -1s infinite; }
      .svg2-rays { animation: svg2-spin 6s linear infinite; transform-origin: 650px 515px; }
    </style>
  </defs>

  <!-- Stage 1: মুদ্রা ও ক্যামেরার লেন্স -->
  <g class="svg2-s1">
    <g class="svg2-coin">
      <circle cx="320" cy="520" r="110" fill="#f0c040" fill-opacity="0.25" stroke="#f0c040" stroke-width="14"/>
      <circle cx="320" cy="520" r="82" fill="none" stroke="#f5d77a" stroke-width="6"/>
      <path d="M0 -50 L13 -13 L50 0 L13 13 L0 50 L-13 13 L-50 0 L-13 -13 Z" fill="#f5d77a" transform="translate(320 520)"/>
    </g>
    <rect x="530" y="430" width="240" height="170" rx="22" fill="#ffffff" fill-opacity="0.1" stroke="#8fd3ff" stroke-width="10"/>
    <rect x="590" y="395" width="70" height="30" rx="8" fill="none" stroke="#8fd3ff" stroke-width="8"/>
    <circle cx="650" cy="515" r="58" fill="none" stroke="#ffffff" stroke-width="10"/>
    <circle cx="650" cy="515" r="32" fill="#8fd3ff" fill-opacity="0.35" stroke="#8fd3ff" stroke-width="6"/>
    <circle cx="738" cy="458" r="9" fill="#f5d77a"/>
  </g>

  <!-- Stage 2: লেন্সের চারপাশে হৃদয় ও তারার সংখ্যা বাড়ে -->
  <g class="svg2-s2">
    <g class="svg2-s2a">
      <path d="M0 20 C -30 -2, -24 -26, -8 -22 C -3 -20, 0 -14, 0 -10 C 0 -14, 3 -20, 8 -22 C 24 -26, 30 -2, 0 20 Z" fill="#f0c040" transform="translate(560 300) scale(1.3)"/>
      <path d="M0 20 C -30 -2, -24 -26, -8 -22 C -3 -20, 0 -14, 0 -10 C 0 -14, 3 -20, 8 -22 C 24 -26, 30 -2, 0 20 Z" fill="#2ecc71" transform="translate(790 330) scale(1.1)"/>
      <path class="svg2-tw1" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="#ffffff" transform="translate(680 250)"/>
    </g>
    <g class="svg2-s2b">
      <path d="M0 20 C -30 -2, -24 -26, -8 -22 C -3 -20, 0 -14, 0 -10 C 0 -14, 3 -20, 8 -22 C 24 -26, 30 -2, 0 20 Z" fill="#f0c040" transform="translate(850 560) scale(1.2)"/>
      <path d="M0 20 C -30 -2, -24 -26, -8 -22 C -3 -20, 0 -14, 0 -10 C 0 -14, 3 -20, 8 -22 C 24 -26, 30 -2, 0 20 Z" fill="#2ecc71" transform="translate(470 330)"/>
      <path class="svg2-tw2" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="#f5d77a" transform="translate(870 450)"/>
      <path class="svg2-tw1" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="#8fd3ff" transform="translate(500 210)"/>
    </g>
    <g class="svg2-s2c">
      <path d="M0 20 C -30 -2, -24 -26, -8 -22 C -3 -20, 0 -14, 0 -10 C 0 -14, 3 -20, 8 -22 C 24 -26, 30 -2, 0 20 Z" fill="#f0c040" transform="translate(700 700) scale(1.3)"/>
      <path d="M0 20 C -30 -2, -24 -26, -8 -22 C -3 -20, 0 -14, 0 -10 C 0 -14, 3 -20, 8 -22 C 24 -26, 30 -2, 0 20 Z" fill="#2ecc71" transform="translate(580 760)"/>
      <path d="M0 20 C -30 -2, -24 -26, -8 -22 C -3 -20, 0 -14, 0 -10 C 0 -14, 3 -20, 8 -22 C 24 -26, 30 -2, 0 20 Z" fill="#f0c040" transform="translate(850 680) scale(0.9)"/>
      <path class="svg2-tw2" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="#ffffff" transform="translate(790 790)"/>
      <path class="svg2-tw1" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="#f5d77a" transform="translate(500 700)"/>
    </g>
  </g>

  <!-- Stage 3: লেন্সের চারপাশে আলো, মুদ্রা ম্লান -->
  <g class="svg2-s3">
    <circle cx="650" cy="515" r="270" fill="url(#svg2-glow)"/>
    <g class="svg2-rays">
      <path d="M650 265 L650 325" stroke="#fff6c8" stroke-width="10" stroke-linecap="round" fill="none" transform="rotate(0 650 515)"/>
      <path d="M650 265 L650 325" stroke="#fff6c8" stroke-width="10" stroke-linecap="round" fill="none" transform="rotate(45 650 515)"/>
      <path d="M650 265 L650 325" stroke="#fff6c8" stroke-width="10" stroke-linecap="round" fill="none" transform="rotate(90 650 515)"/>
      <path d="M650 265 L650 325" stroke="#fff6c8" stroke-width="10" stroke-linecap="round" fill="none" transform="rotate(135 650 515)"/>
      <path d="M650 265 L650 325" stroke="#fff6c8" stroke-width="10" stroke-linecap="round" fill="none" transform="rotate(180 650 515)"/>
      <path d="M650 265 L650 325" stroke="#fff6c8" stroke-width="10" stroke-linecap="round" fill="none" transform="rotate(225 650 515)"/>
      <path d="M650 265 L650 325" stroke="#fff6c8" stroke-width="10" stroke-linecap="round" fill="none" transform="rotate(270 650 515)"/>
      <path d="M650 265 L650 325" stroke="#fff6c8" stroke-width="10" stroke-linecap="round" fill="none" transform="rotate(315 650 515)"/>
    </g>
    <path class="svg2-tw1" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="#fff6c8" transform="translate(180 250) scale(1.5)"/>
    <path class="svg2-tw2" d="M0 -26 L7 -7 L26 0 L7 7 L0 26 L-7 7 L-26 0 L-7 -7 Z" fill="#fff6c8" transform="translate(190 790) scale(1.3)"/>
  </g>
</svg>
