<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="svg2-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <style>
      /* ===== ১০ stage, ৬ সেকেন্ড লুপ: প্রতি stage = ১০% = ০.৬ সেকেন্ড ===== */

      /* Stage 1 (0-10%): মিম্বর, সবসময় দৃশ্যমান */
      @keyframes svg2-k1 {
        0%   { transform: scale(0.6); opacity: 0.7; }
        8%   { transform: scale(1);   opacity: 1; }
        96%  { transform: scale(1);   opacity: 1; }
        100% { transform: scale(0.6); opacity: 0.7; }
      }
      /* Stage 2..10: নিজের stage-এ ফোটে, ৯৬% থেকে ১০০% এ মিলিয়ে যায় */
      @keyframes svg2-k2  { 0%, 10% { opacity: 0; } 14%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg2-k3  { 0%, 20% { opacity: 0; } 24%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg2-k4  { 0%, 30% { opacity: 0; } 34%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg2-k5  { 0%, 40% { opacity: 0; } 44%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg2-k6  { 0%, 50% { opacity: 0; } 54%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg2-k7  { 0%, 60% { opacity: 0; } 64%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg2-k8  { 0%, 70% { opacity: 0; } 74%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg2-k9  { 0%, 80% { opacity: 0; } 84%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg2-k10 { 0%, 90% { opacity: 0; } 94%, 96% { opacity: 1; } 100% { opacity: 0; } }

      /* মিনার নিচ থেকে উঠে আসে (stage 2) */
      @keyframes svg2-rise {
        0%, 10% { transform: scaleY(0.2); }
        20%, 100% { transform: scaleY(1); }
      }

      /* বাতি দোলে (stage 3-এর পর থেকে) */
      @keyframes svg2-sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }

      /* শব্দতরঙ্গ ঝিলমিল */
      @keyframes svg2-wave { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

      /* ছোট বাড়তি অ্যানিমেশন (৬ সেকেন্ডে সমান ভাগ হয়) */
      @keyframes svg2-twinkle { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes svg2-pulse   { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @keyframes svg2-spin    { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes svg2-flow    { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

      .svg2-s1  { animation: svg2-k1 6s ease-in-out infinite; transform-origin: 500px 600px; }
      .svg2-s2  { animation: svg2-k2 6s ease-in-out infinite; }
      .svg2-s3  { animation: svg2-k3 6s ease-in-out infinite; }
      .svg2-s4  { animation: svg2-k4 6s ease-in-out infinite; }
      .svg2-s5  { animation: svg2-k5 6s ease-in-out infinite; }
      .svg2-s6  { animation: svg2-k6 6s ease-in-out infinite; }
      .svg2-s7  { animation: svg2-k7 6s ease-in-out infinite; }
      .svg2-s8  { animation: svg2-k8 6s ease-in-out infinite; }
      .svg2-s9  { animation: svg2-k9 6s ease-in-out infinite; }
      .svg2-s10 { animation: svg2-k10 6s ease-in-out infinite; }

      .svg2-mL { animation: svg2-rise 6s ease-out infinite; transform-origin: 145px 800px; }
      .svg2-mR { animation: svg2-rise 6s ease-out infinite; transform-origin: 855px 800px; }

      .svg2-lampL { animation: svg2-sway 3s ease-in-out infinite; transform-origin: 300px 150px; }
      .svg2-lampR { animation: svg2-sway 3s ease-in-out infinite; animation-delay: -1.5s; transform-origin: 700px 150px; }

      .svg2-w1 { animation: svg2-wave 3s ease-in-out infinite; }
      .svg2-w2 { animation: svg2-wave 3s ease-in-out infinite; animation-delay: -1s; }
      .svg2-w3 { animation: svg2-wave 3s ease-in-out infinite; animation-delay: -2s; }

      .svg2-halo  { animation: svg2-pulse 2s ease-in-out infinite; }
      .svg2-star  { animation: svg2-twinkle 2s ease-in-out infinite; }
      .svg2-star2 { animation: svg2-twinkle 2s ease-in-out infinite; animation-delay: -1s; }
      .svg2-ring  { animation: svg2-spin 6s linear infinite; transform-origin: 500px 500px; }
      .svg2-d1 { animation: svg2-flow 1.5s ease-in-out infinite; animation-delay: 0s; }
      .svg2-d2 { animation: svg2-flow 1.5s ease-in-out infinite; animation-delay: -0.5s; }
      .svg2-d3 { animation: svg2-flow 1.5s ease-in-out infinite; animation-delay: -1s; }
    </style>
  </defs>

  <!-- Stage 1 (0.0-0.6 s): মিম্বর — সিঁড়ি ও ছাউনিসহ -->
  <g class="svg2-s1">
    <g fill="#f5d77a" fill-opacity="0.2" stroke="#f5d77a" stroke-width="8" stroke-linejoin="round">
      <rect x="310" y="740" width="380" height="50" rx="6"/>
      <rect x="340" y="670" width="320" height="50" rx="6"/>
      <rect x="370" y="600" width="260" height="50" rx="6"/>
      <rect x="400" y="530" width="200" height="50" rx="6"/>
      <rect x="430" y="470" width="140" height="40" rx="6"/>
    </g>
    <path d="M440 470 L440 410 Q500 320 560 410 L560 470" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="500" cy="345" r="10" fill="#ffffff"/>
  </g>

  <!-- Stage 2 (0.6-1.2 s): দুই পাশে মিনার ওঠে -->
  <g class="svg2-s2">
    <g class="svg2-mL">
      <rect x="120" y="440" width="50" height="360" rx="6" fill="#1abc9c" fill-opacity="0.2" stroke="#1abc9c" stroke-width="8"/>
      <path d="M115 440 Q145 370 175 440 Z" fill="#1abc9c" fill-opacity="0.3" stroke="#1abc9c" stroke-width="8" stroke-linejoin="round"/>
      <circle cx="145" cy="355" r="8" fill="#ffffff"/>
    </g>
    <g class="svg2-mR">
      <rect x="830" y="440" width="50" height="360" rx="6" fill="#1abc9c" fill-opacity="0.2" stroke="#1abc9c" stroke-width="8"/>
      <path d="M825 440 Q855 370 885 440 Z" fill="#1abc9c" fill-opacity="0.3" stroke="#1abc9c" stroke-width="8" stroke-linejoin="round"/>
      <circle cx="855" cy="355" r="8" fill="#ffffff"/>
    </g>
  </g>

  <!-- Stage 3 (1.2-1.8 s): দুটি দোলা বাতি -->
  <g class="svg2-s3">
    <g class="svg2-lampL">
      <line x1="300" y1="150" x2="300" y2="240" stroke="#f5d77a" stroke-width="5" stroke-linecap="round"/>
      <path d="M284 240 L316 240 L300 222 Z" fill="#f5d77a"/>
      <rect x="280" y="240" width="40" height="70" rx="10" fill="#f0c040" fill-opacity="0.3" stroke="#f5d77a" stroke-width="6"/>
      <circle cx="300" cy="275" r="9" fill="#ffffff"/>
    </g>
    <g class="svg2-lampR">
      <line x1="700" y1="150" x2="700" y2="240" stroke="#f5d77a" stroke-width="5" stroke-linecap="round"/>
      <path d="M684 240 L716 240 L700 222 Z" fill="#f5d77a"/>
      <rect x="680" y="240" width="40" height="70" rx="10" fill="#f0c040" fill-opacity="0.3" stroke="#f5d77a" stroke-width="6"/>
      <circle cx="700" cy="275" r="9" fill="#ffffff"/>
    </g>
  </g>

  <!-- Stage 4 (1.8-2.4 s): মিম্বরের চূড়ায় আলো — যেখানে দাঁড়িয়ে বলা হচ্ছে -->
  <g class="svg2-s4">
    <circle class="svg2-halo" cx="500" cy="440" r="210" fill="url(#svg2-glow)"/>
  </g>

  <!-- Stage 5 (2.4-3.0 s): প্রথম শব্দতরঙ্গ -->
  <g class="svg2-s5">
    <g fill="none" stroke="#8fd3ff" stroke-width="10" stroke-linecap="round">
      <path class="svg2-w1" d="M664 405 A200 200 0 0 1 664 635"/>
      <path class="svg2-w1" d="M336 635 A200 200 0 0 1 336 405"/>
    </g>
  </g>

  <!-- Stage 6 (3.0-3.6 s): দ্বিতীয় শব্দতরঙ্গ -->
  <g class="svg2-s6">
    <g fill="none" stroke="#8fd3ff" stroke-width="9" stroke-linecap="round">
      <path class="svg2-w2" d="M709 374 A255 255 0 0 1 709 666"/>
      <path class="svg2-w2" d="M291 666 A255 255 0 0 1 291 374"/>
    </g>
  </g>

  <!-- Stage 7 (3.6-4.2 s): তৃতীয় শব্দতরঙ্গ — কণ্ঠ ছড়িয়ে পড়ে -->
  <g class="svg2-s7">
    <g fill="none" stroke="#8fd3ff" stroke-width="8" stroke-linecap="round">
      <path class="svg2-w3" d="M754 342 A310 310 0 0 1 754 698"/>
      <path class="svg2-w3" d="M246 698 A310 310 0 0 1 246 342"/>
    </g>
  </g>

  <!-- Stage 8 (4.2-4.8 s): নিচে সারি সারি জায়নামাজ — শ্রোতাদের প্রতীক -->
  <g class="svg2-s8">
    <g fill="#1abc9c" fill-opacity="0.2" stroke="#1abc9c" stroke-width="6" stroke-linejoin="round">
      <path d="M195 890 L195 845 Q240 810 285 845 L285 890 Z"/>
      <path d="M325 890 L325 845 Q370 810 415 845 L415 890 Z"/>
      <path d="M455 890 L455 845 Q500 810 545 845 L545 890 Z"/>
      <path d="M585 890 L585 845 Q630 810 675 845 L675 890 Z"/>
      <path d="M715 890 L715 845 Q760 810 805 845 L805 890 Z"/>
    </g>
  </g>

  <!-- Stage 9 (4.8-5.4 s): অর্ধচন্দ্র ও ঝিকিমিকি তারা -->
  <g class="svg2-s9">
    <path d="M530 125 A50 50 0 1 0 530 215 A46 46 0 0 1 530 125 Z" fill="#f5d77a"/>
    <path class="svg2-star" d="M400 163 L406 179 L422 185 L406 191 L400 207 L394 191 L378 185 L394 179 Z" fill="#ffffff"/>
    <path class="svg2-star2" d="M610 163 L616 179 L632 185 L616 191 L610 207 L604 191 L588 185 L604 179 Z" fill="#ffffff"/>
    <path class="svg2-star2" d="M215 228 L221 244 L237 250 L221 256 L215 272 L209 256 L193 250 L209 244 Z" fill="#8fd3ff"/>
    <path class="svg2-star" d="M785 228 L791 244 L807 250 L791 256 L785 272 L779 256 L763 250 L779 244 Z" fill="#8fd3ff"/>
  </g>

  <!-- Stage 10 (5.4-6.0 s): আলোর বলয় ও "বলছেন…" — তিনি বলেই চলেছেন -->
  <g class="svg2-s10">
    <circle class="svg2-ring" cx="500" cy="500" r="400" fill="none" stroke="#f0c040" stroke-width="6" stroke-dasharray="20 18" opacity="0.7"/>
    <circle class="svg2-d1" cx="590" cy="440" r="9" fill="#ffffff"/>
    <circle class="svg2-d2" cx="620" cy="440" r="9" fill="#ffffff"/>
    <circle class="svg2-d3" cx="650" cy="440" r="9" fill="#ffffff"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
