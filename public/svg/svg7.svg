<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="svg7-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes svg7-k1 {
        0%   { transform: scale(0.6); opacity: 0.7; }
        30%  { transform: scale(1);   opacity: 1; }
        90%  { transform: scale(1);   opacity: 1; }
        100% { transform: scale(0.6); opacity: 0.7; }
      }
      @keyframes svg7-k2 {
        0%, 30%  { opacity: 0; transform: translateY(90px); }
        50%      { opacity: 1; transform: translateY(40px); }
        88%      { opacity: 1; transform: translateY(0px); }
        100%     { opacity: 0; transform: translateY(0px); }
      }
      @keyframes svg7-k3 {
        0%, 63%  { opacity: 0; transform: scale(0.5); }
        78%      { opacity: 1; transform: scale(1.1); }
        88%      { opacity: 1; transform: scale(1); }
        100%     { opacity: 0; transform: scale(0.5); }
      }
      @keyframes svg7-twinkle {
        0%, 100% { opacity: 0.3; }
        50%      { opacity: 1; }
      }
      @keyframes svg7-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .svg7-s1 { animation: svg7-k1 6s ease-in-out infinite; transform-origin: 500px 700px; }
      .svg7-s2 { animation: svg7-k2 6s ease-in-out infinite; }
      .svg7-s3 { animation: svg7-k3 6s ease-in-out infinite; transform-origin: 500px 200px; }
      .svg7-rays { animation: svg7-spin 6s linear infinite; transform-origin: 500px 200px; }
      .svg7-tw1 { animation: svg7-twinkle 2s ease-in-out infinite; }
      .svg7-tw2 { animation: svg7-twinkle 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Stage 1: খোলা কিতাব -->
  <g class="svg7-s1">
    <path d="M500 780 Q390 735 260 760 L260 610 Q390 585 500 630 Z" fill="#f5d77a" fill-opacity="0.25" stroke="#f5d77a" stroke-width="10" stroke-linejoin="round"/>
    <path d="M500 780 Q610 735 740 760 L740 610 Q610 585 500 630 Z" fill="#f5d77a" fill-opacity="0.25" stroke="#f5d77a" stroke-width="10" stroke-linejoin="round"/>
    <line x1="500" y1="630" x2="500" y2="780" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <line x1="310" y1="650" x2="450" y2="672" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8"/>
    <line x1="310" y1="690" x2="450" y2="712" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8"/>
    <line x1="690" y1="650" x2="550" y2="672" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8"/>
    <line x1="690" y1="690" x2="550" y2="712" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8"/>
  </g>

  <!-- Stage 2: সংযুক্ত বৃত্তের শিকল ওপরে উঠে যায় -->
  <g class="svg7-s2">
    <circle cx="500" cy="560" r="36" fill="none" stroke="#1abc9c" stroke-width="10"/>
    <circle cx="500" cy="500" r="36" fill="none" stroke="#2ecc71" stroke-width="10"/>
    <circle cx="500" cy="440" r="36" fill="none" stroke="#1abc9c" stroke-width="10"/>
    <circle cx="500" cy="380" r="36" fill="none" stroke="#2ecc71" stroke-width="10"/>
    <circle cx="500" cy="320" r="36" fill="none" stroke="#1abc9c" stroke-width="10"/>
    <circle class="svg7-tw1" cx="380" cy="480" r="8" fill="#8fd3ff"/>
    <circle class="svg7-tw2" cx="620" cy="420" r="8" fill="#8fd3ff"/>
    <circle class="svg7-tw2" cx="400" cy="340" r="6" fill="#ffffff"/>
    <circle class="svg7-tw1" cx="610" cy="560" r="6" fill="#ffffff"/>
  </g>

  <!-- Stage 3: শিকলের মাথায় আলোকিত তারা -->
  <g class="svg7-s3">
    <circle cx="500" cy="200" r="190" fill="url(#svg7-glow)"/>
    <g class="svg7-rays">
      <line x1="500" y1="90" x2="500" y2="50" stroke="#f0c040" stroke-width="8" stroke-linecap="round"/>
      <line x1="500" y1="310" x2="500" y2="350" stroke="#f0c040" stroke-width="8" stroke-linecap="round" stroke-opacity="0.0"/>
      <line x1="390" y1="200" x2="350" y2="200" stroke="#f0c040" stroke-width="8" stroke-linecap="round"/>
      <line x1="610" y1="200" x2="650" y2="200" stroke="#f0c040" stroke-width="8" stroke-linecap="round"/>
      <line x1="422" y1="122" x2="394" y2="94" stroke="#f0c040" stroke-width="8" stroke-linecap="round"/>
      <line x1="578" y1="122" x2="606" y2="94" stroke="#f0c040" stroke-width="8" stroke-linecap="round"/>
    </g>
    <polygon points="500,140 514.1,180.6 557.1,181.5 522.8,207.4 535.3,248.5 500,224 464.7,248.5 477.2,207.4 442.9,181.5 485.9,180.6" fill="#fff6c8" stroke="#f0c040" stroke-width="8" stroke-linejoin="round"/>
  </g>
</svg>
