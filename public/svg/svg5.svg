<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="svg5-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="svg5-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="svg5-light" cx="50%" cy="60%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0.75"/>
    </radialGradient>
    <style>
      @keyframes svg5-halo {
        0%, 100% { transform: scale(0.85); opacity: 0.5; }
        50%      { transform: scale(1.1); opacity: 1; }
      }
      @keyframes svg5-beam {
        0%, 100% { transform: scaleX(0.75); opacity: 0.5; }
        50%      { transform: scaleX(1.1); opacity: 1; }
      }
      @keyframes svg5-twinkle {
        0%, 100% { opacity: 0.2; }
        50%      { opacity: 0.95; }
      }
      .svg5-halo { animation: svg5-halo 3s ease-in-out infinite; transform-origin: 500px 420px; }
      .svg5-beam { animation: svg5-beam 3s ease-in-out infinite; transform-origin: 500px 560px; }
      .svg5-guide { fill: none; stroke: #f5d77a; stroke-width: 10; stroke-linecap: round; stroke-dasharray: 1 28; opacity: 0.4; }
      .svg5-door { fill: url(#svg5-light); stroke: #f5d77a; stroke-width: 14; stroke-linejoin: round; }
      .svg5-leaf { fill: #1abc9c; fill-opacity: 0.85; stroke: #ffffff; stroke-width: 6; stroke-linejoin: round; }
      .svg5-step { fill: #f5d77a; fill-opacity: 0.9; stroke: #ffffff; stroke-width: 6; stroke-linejoin: round; }
      .svg5-dot { fill: #ffffff; stroke: #f0c040; stroke-width: 4; opacity: 0; }
      .svg5-star { fill: #8fd3ff; animation: svg5-twinkle 3s ease-in-out infinite; }
      .svg5-s2 { animation-delay: -1s; }
      .svg5-s3 { animation-delay: -2s; }
    </style>
  </defs>

  <circle class="svg5-star" cx="180" cy="300" r="8"/>
  <circle class="svg5-star svg5-s2" cx="820" cy="300" r="10"/>
  <circle class="svg5-star svg5-s3" cx="150" cy="560" r="7"/>
  <circle class="svg5-star" cx="850" cy="560" r="7"/>

  <circle class="svg5-halo" cx="500" cy="420" r="260" fill="url(#svg5-glow)"/>
  <polygon class="svg5-beam" points="400,560 600,560 760,830 240,830" fill="url(#svg5-beam)"/>

  <path class="svg5-guide" d="M300 880 C520 880 760 840 700 780 C640 720 340 760 340 690 C340 640 460 640 500 590"/>

  <polygon class="svg5-step" points="380,560 620,560 640,585 360,585"/>
  <path class="svg5-door" d="M400 560 L400 380 A100 100 0 0 1 600 380 L600 560 Z"/>
  <polygon class="svg5-leaf" points="400,560 335,582 335,420 400,380"/>

  <circle class="svg5-dot" cx="0" cy="0" r="24">
    <animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M300 880 C520 880 760 840 700 780 C640 720 340 760 340 690 C340 640 460 640 500 590"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="6s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="r" values="24;11" dur="6s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle class="svg5-dot" cx="0" cy="0" r="24">
    <animateMotion dur="6s" begin="-1s" repeatCount="indefinite" path="M300 880 C520 880 760 840 700 780 C640 720 340 760 340 690 C340 640 460 640 500 590"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="6s" begin="-1s" repeatCount="indefinite"/>
    <animate attributeName="r" values="24;11" dur="6s" begin="-1s" repeatCount="indefinite"/>
  </circle>
  <circle class="svg5-dot" cx="0" cy="0" r="24">
    <animateMotion dur="6s" begin="-2s" repeatCount="indefinite" path="M300 880 C520 880 760 840 700 780 C640 720 340 760 340 690 C340 640 460 640 500 590"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="6s" begin="-2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="24;11" dur="6s" begin="-2s" repeatCount="indefinite"/>
  </circle>
  <circle class="svg5-dot" cx="0" cy="0" r="24">
    <animateMotion dur="6s" begin="-3s" repeatCount="indefinite" path="M300 880 C520 880 760 840 700 780 C640 720 340 760 340 690 C340 640 460 640 500 590"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="6s" begin="-3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="24;11" dur="6s" begin="-3s" repeatCount="indefinite"/>
  </circle>
  <circle class="svg5-dot" cx="0" cy="0" r="24">
    <animateMotion dur="6s" begin="-4s" repeatCount="indefinite" path="M300 880 C520 880 760 840 700 780 C640 720 340 760 340 690 C340 640 460 640 500 590"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="6s" begin="-4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="24;11" dur="6s" begin="-4s" repeatCount="indefinite"/>
  </circle>
  <circle class="svg5-dot" cx="0" cy="0" r="24">
    <animateMotion dur="6s" begin="-5s" repeatCount="indefinite" path="M300 880 C520 880 760 840 700 780 C640 720 340 760 340 690 C340 640 460 640 500 590"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="6s" begin="-5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="24;11" dur="6s" begin="-5s" repeatCount="indefinite"/>
  </circle>
</svg>
