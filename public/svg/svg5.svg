<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="svg5-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="svg5-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0.08"/>
    </linearGradient>
    <style>
      @keyframes svg5-k1 {
        0%   { transform: scale(0.6); opacity: 0.7; }
        30%  { transform: scale(1);   opacity: 1; }
        90%  { transform: scale(1);   opacity: 1; }
        100% { transform: scale(0.6); opacity: 0.7; }
      }
      @keyframes svg5-k2 {
        0%, 30%   { opacity: 0; }
        45%, 88%  { opacity: 1; }
        100%      { opacity: 0; }
      }
      @keyframes svg5-k3 {
        0%, 63%   { opacity: 0; transform: scale(0.9); }
        78%, 88%  { opacity: 1; transform: scale(1); }
        100%      { opacity: 0; transform: scale(0.9); }
      }
      @keyframes svg5-beam {
        0%, 32%  { transform: scaleY(0); }
        50%, 88% { transform: scaleY(1); }
        100%     { transform: scaleY(0); }
      }
      @keyframes svg5-ra {
        0%, 66%  { opacity: 0; transform: scale(0.5); }
        69%      { opacity: 0.9; transform: scale(0.6); }
        90%      { opacity: 0; transform: scale(2.4); }
        100%     { opacity: 0; transform: scale(2.4); }
      }
      @keyframes svg5-rb {
        0%, 72%  { opacity: 0; transform: scale(0.5); }
        75%      { opacity: 0.8; transform: scale(0.6); }
        96%      { opacity: 0; transform: scale(2.4); }
        100%     { opacity: 0; transform: scale(2.4); }
      }
      @keyframes svg5-fill {
        0%, 64%  { fill-opacity: 0; }
        80%, 88% { fill-opacity: 0.85; }
        100%     { fill-opacity: 0; }
      }
      @keyframes svg5-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes svg5-twinkle { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      .svg5-s1 { animation: svg5-k1 6s ease-in-out infinite; transform-origin: 500px 220px; }
      .svg5-s2 { animation: svg5-k2 6s ease-in-out infinite; }
      .svg5-s3 { animation: svg5-k3 6s ease-in-out infinite; transform-origin: 500px 720px; }
      .svg5-beam { animation: svg5-beam 6s ease-in-out infinite; transform-origin: 500px 290px; }
      .svg5-r1 { animation: svg5-ra 6s ease-out infinite; transform-origin: 500px 720px; }
      .svg5-r2 { animation: svg5-rb 6s ease-out infinite; transform-origin: 500px 720px; }
      .svg5-fill { animation: svg5-fill 6s ease-in-out infinite; }
      .svg5-halo { animation: svg5-spin 6s linear infinite; transform-origin: 500px 220px; }
      .svg5-tw { animation: svg5-twinkle 2s ease-in-out infinite; }
      .svg5-tw2 { animation: svg5-twinkle 2s ease-in-out infinite; animation-delay: -1s; }
    </style>
  </defs>

  <!-- Stage 1: a bright star -->
  <g class="svg5-s1">
    <circle cx="500" cy="220" r="150" fill="url(#svg5-glow)"/>
    <polygon points="500,140 520,192 576,195 532,231 547,285 500,254 453,285 468,231 424,195 480,192" fill="#f0c040" stroke="#fff6c8" stroke-width="8" stroke-linejoin="round"/>
    <g class="svg5-halo">
      <circle cx="500" cy="220" r="115" fill="none" stroke="#f5d77a" stroke-width="5" stroke-dasharray="8 22" stroke-opacity="0.8"/>
    </g>
  </g>

  <!-- Stage 2: light descends to a small heart -->
  <g class="svg5-s2">
    <polygon class="svg5-beam" points="480,290 520,290 600,640 400,640" fill="url(#svg5-beam)"/>
    <line x1="500" y1="300" x2="500" y2="640" stroke="#ffffff" stroke-width="4" stroke-dasharray="4 14" stroke-opacity="0.8"/>
    <path d="M500 800 C405 735 395 655 450 648 C480 645 495 665 500 682 C505 665 520 645 550 648 C605 655 595 735 500 800 Z" fill="#8fd3ff" fill-opacity="0.15" stroke="#f5d77a" stroke-width="12" stroke-linejoin="round"/>
  </g>

  <!-- Stage 3: heart fills with light, ripples spread -->
  <g class="svg5-s3">
    <circle cx="500" cy="720" r="260" fill="url(#svg5-glow)"/>
    <path class="svg5-fill" d="M500 800 C405 735 395 655 450 648 C480 645 495 665 500 682 C505 665 520 645 550 648 C605 655 595 735 500 800 Z" fill="#2ecc71" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
    <circle class="svg5-r1" cx="500" cy="720" r="130" fill="none" stroke="#2ecc71" stroke-width="6"/>
    <circle class="svg5-r2" cx="500" cy="720" r="130" fill="none" stroke="#f5d77a" stroke-width="6"/>
    <circle class="svg5-tw" cx="290" cy="470" r="9" fill="#ffffff"/>
    <circle class="svg5-tw2" cx="710" cy="470" r="9" fill="#8fd3ff"/>
  </g>
</svg>
