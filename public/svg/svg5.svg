<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="svg5-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <style>
      /* ===== ১০ stage, ৬ সেকেন্ড লুপ: প্রতি stage = ১০% = ০.৬ সেকেন্ড ===== */

      /* Stage 1 (0-10%): হিজরতের পথ, সবসময় দৃশ্যমান */
      @keyframes svg5-k1 {
        0%   { transform: scale(0.6); opacity: 0.7; }
        8%   { transform: scale(1);   opacity: 1; }
        96%  { transform: scale(1);   opacity: 1; }
        100% { transform: scale(0.6); opacity: 0.7; }
      }
      /* Stage 2..10: নিজের stage-এ ফোটে, ৯৬% থেকে ১০০% এ মিলিয়ে যায় */
      @keyframes svg5-k2  { 0%, 10% { opacity: 0; } 14%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg5-k3  { 0%, 20% { opacity: 0; } 24%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg5-k4  { 0%, 30% { opacity: 0; } 34%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg5-k5  { 0%, 40% { opacity: 0; } 44%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg5-k6  { 0%, 50% { opacity: 0; } 54%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg5-k7  { 0%, 60% { opacity: 0; } 64%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg5-k8  { 0%, 70% { opacity: 0; } 74%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg5-k9  { 0%, 80% { opacity: 0; } 84%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg5-k10 { 0%, 90% { opacity: 0; } 94%, 96% { opacity: 1; } 100% { opacity: 0; } }

      /* পথের শাখা আঁকা (stage 4) */
      @keyframes svg5-dA { 0%, 30% { stroke-dashoffset: 100; } 38%, 100% { stroke-dashoffset: 0; } }
      @keyframes svg5-dB { 0%, 34% { stroke-dashoffset: 100; } 42%, 100% { stroke-dashoffset: 0; } }

      /* মুদ্রা (stage 5) ও আংটি (stage 6) ফুটে ওঠা */
      @keyframes svg5-pCoin { 0%, 40% { transform: scale(0); } 46% { transform: scale(1.15); } 50%, 100% { transform: scale(1); } }
      @keyframes svg5-pRing { 0%, 50% { transform: scale(0); } 56% { transform: scale(1.15); } 60%, 100% { transform: scale(1); } }

      /* গন্তব্যের দিকে আলোর প্রবাহ (৩০ একক = এক পুনরাবৃত্তি) */
      @keyframes svg5-dash { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -30; } }

      /* দিকনির্দেশক কাঁটা দোলে */
      @keyframes svg5-sway { 0%, 100% { transform: rotate(-25deg); } 50% { transform: rotate(25deg); } }

      /* ছোট বাড়তি অ্যানিমেশন (৬ সেকেন্ডে সমান ভাগ হয়) */
      @keyframes svg5-twinkle { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes svg5-pulse   { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @keyframes svg5-spin    { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      .svg5-s1  { animation: svg5-k1 6s ease-in-out infinite; transform-origin: 500px 650px; }
      .svg5-s2  { animation: svg5-k2 6s ease-in-out infinite; }
      .svg5-s3  { animation: svg5-k3 6s ease-in-out infinite; }
      .svg5-s4  { animation: svg5-k4 6s ease-in-out infinite; }
      .svg5-s5  { animation: svg5-k5 6s ease-in-out infinite; }
      .svg5-s6  { animation: svg5-k6 6s ease-in-out infinite; }
      .svg5-s7  { animation: svg5-k7 6s ease-in-out infinite; }
      .svg5-s8  { animation: svg5-k8 6s ease-in-out infinite; }
      .svg5-s9  { animation: svg5-k9 6s ease-in-out infinite; }
      .svg5-s10 { animation: svg5-k10 6s ease-in-out infinite; }

      .svg5-branch { stroke-dasharray: 100; stroke-dashoffset: 100; }
      .svg5-bA { animation: svg5-dA 6s ease-in-out infinite; }
      .svg5-bB { animation: svg5-dB 6s ease-in-out infinite; }

      .svg5-coins { animation: svg5-pCoin 6s ease-out infinite; transform-origin: 282px 245px; }
      .svg5-rings { animation: svg5-pRing 6s ease-out infinite; transform-origin: 722px 250px; }

      .svg5-flow { stroke-dasharray: 14 16; animation: svg5-dash 1.5s linear infinite; }
      .svg5-needle { animation: svg5-sway 3s ease-in-out infinite; transform-origin: 800px 790px; }

      .svg5-halo  { animation: svg5-pulse 2s ease-in-out infinite; }
      .svg5-star  { animation: svg5-twinkle 2s ease-in-out infinite; }
      .svg5-star2 { animation: svg5-twinkle 2s ease-in-out infinite; animation-delay: -1s; }
      .svg5-ring  { animation: svg5-spin 6s linear infinite; transform-origin: 500px 500px; }
    </style>
  </defs>

  <!-- Stage 1 (0.0-0.6 s): হিজরতের পথ — যাত্রার শুরু -->
  <g class="svg5-s1">
    <path d="M250 850 C330 780 380 740 440 650 S500 540 500 470" fill="none" stroke="#f5d77a" stroke-width="30" stroke-linecap="round" opacity="0.35"/>
    <path d="M250 850 C330 780 380 740 440 650 S500 540 500 470" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-dasharray="20 20"/>
    <circle cx="250" cy="850" r="14" fill="#ffffff" stroke="#f5d77a" stroke-width="6"/>
  </g>

  <!-- Stage 2 (0.6-1.2 s): যাত্রার স্থান — গম্বুজসহ ভবন -->
  <g class="svg5-s2">
    <rect x="110" y="795" width="100" height="55" rx="4" fill="#1abc9c" fill-opacity="0.2" stroke="#1abc9c" stroke-width="8" stroke-linejoin="round"/>
    <path d="M110 795 Q160 735 210 795 Z" fill="#1abc9c" fill-opacity="0.3" stroke="#1abc9c" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="160" cy="745" r="8" fill="#ffffff"/>
  </g>

  <!-- Stage 3 (1.2-1.8 s): দিকনির্দেশক কম্পাস — উদ্দেশ্য/দিক -->
  <g class="svg5-s3">
    <circle cx="800" cy="790" r="60" fill="#8fd3ff" fill-opacity="0.15" stroke="#8fd3ff" stroke-width="8"/>
    <g class="svg5-needle">
      <path d="M800 735 L813 790 L787 790 Z" fill="#f0c040"/>
      <path d="M800 845 L813 790 L787 790 Z" fill="#ffffff"/>
    </g>
    <circle cx="800" cy="790" r="7" fill="#ffffff"/>
  </g>

  <!-- Stage 4 (1.8-2.4 s): পথ দুই দিকে ভাগ হয় -->
  <g class="svg5-s4">
    <path class="svg5-branch svg5-bA" pathLength="100" d="M500 470 C480 400 380 350 300 300" fill="none" stroke="#f5d77a" stroke-width="22" stroke-linecap="round" opacity="0.75"/>
    <path class="svg5-branch svg5-bB" pathLength="100" d="M500 470 C520 400 620 350 700 300" fill="none" stroke="#f5d77a" stroke-width="22" stroke-linecap="round" opacity="0.75"/>
    <circle cx="500" cy="470" r="16" fill="#ffffff" stroke="#f5d77a" stroke-width="6"/>
  </g>

  <!-- Stage 5 (2.4-3.0 s): বাঁ পথের শেষে দুনিয়ার মুদ্রা -->
  <g class="svg5-s5">
    <g class="svg5-coins">
      <g fill="#f0c040" stroke="#ffffff" stroke-width="5">
        <circle cx="255" cy="265" r="34"/>
        <circle cx="310" cy="265" r="34"/>
        <circle cx="282" cy="215" r="34"/>
      </g>
      <g fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8">
        <circle cx="255" cy="265" r="20"/>
        <circle cx="310" cy="265" r="20"/>
        <circle cx="282" cy="215" r="20"/>
      </g>
    </g>
  </g>

  <!-- Stage 6 (3.0-3.6 s): ডান পথের শেষে বিয়ের আংটি -->
  <g class="svg5-s6">
    <g class="svg5-rings">
      <circle cx="700" cy="250" r="36" fill="none" stroke="#f5d77a" stroke-width="12"/>
      <circle cx="745" cy="250" r="36" fill="none" stroke="#ffffff" stroke-width="12"/>
      <path d="M722 190 L736 206 L722 222 L708 206 Z" fill="#8fd3ff"/>
    </g>
  </g>

  <!-- Stage 7 (3.6-4.2 s): দুই লক্ষ্যের দিকে আলোর প্রবাহ -->
  <g class="svg5-s7">
    <path class="svg5-flow" d="M500 470 C480 400 380 350 300 300" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <path class="svg5-flow" d="M500 470 C520 400 620 350 700 300" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Stage 8 (4.2-4.8 s): যে লক্ষ্যে চলেছে সেটাই প্রাপ্য — দুই লক্ষ্যে আভা -->
  <g class="svg5-s8">
    <circle class="svg5-halo" cx="282" cy="245" r="130" fill="url(#svg5-glow)"/>
    <circle class="svg5-halo" cx="722" cy="250" r="130" fill="url(#svg5-glow)"/>
  </g>

  <!-- Stage 9 (4.8-5.4 s): অর্ধচন্দ্র ও ঝিকিমিকি তারা -->
  <g class="svg5-s9">
    <path d="M530 125 A50 50 0 1 0 530 215 A46 46 0 0 1 530 125 Z" fill="#f5d77a"/>
    <path class="svg5-star" d="M130 138 L136 154 L152 160 L136 166 L130 182 L124 166 L108 160 L124 154 Z" fill="#8fd3ff"/>
    <path class="svg5-star2" d="M870 138 L876 154 L892 160 L876 166 L870 182 L864 166 L848 160 L864 154 Z" fill="#8fd3ff"/>
    <path class="svg5-star2" d="M120 498 L126 514 L142 520 L126 526 L120 542 L114 526 L98 520 L114 514 Z" fill="#ffffff"/>
    <path class="svg5-star" d="M885 498 L891 514 L907 520 L891 526 L885 542 L879 526 L863 520 L879 514 Z" fill="#ffffff"/>
  </g>

  <!-- Stage 10 (5.4-6.0 s): আলোর বলয় ও পথের মিলনস্থলে আভা -->
  <g class="svg5-s10">
    <circle class="svg5-ring" cx="500" cy="500" r="400" fill="none" stroke="#f0c040" stroke-width="6" stroke-dasharray="20 18" opacity="0.7"/>
    <circle class="svg5-halo" cx="500" cy="470" r="44" fill="none" stroke="#ffffff" stroke-width="5"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
