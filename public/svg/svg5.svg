<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialGradient id="svg5-glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6c8" stop-opacity=".9"/><stop offset="1" stop-color="#f5d77a" stop-opacity="0"/></radialGradient>
<radialGradient id="svg5-rayg" gradientUnits="userSpaceOnUse" cx="500" cy="520" r="440"><stop offset="0" stop-color="#f5d77a" stop-opacity=".42"/><stop offset="1" stop-color="#f5d77a" stop-opacity="0"/></radialGradient>
<linearGradient id="svg5-gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fe3b8"/><stop offset="1" stop-color="#1abc9c"/></linearGradient>
<linearGradient id="svg5-gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset="1" stop-color="#f0c040"/></linearGradient>
<path id="svg5-rl" d="M500,890 L500,650 Q420,600 300,520"/>
<path id="svg5-rr" d="M500,890 L500,650 Q580,600 700,520"/>
<style>
@keyframes svg5-k1 { 0% { opacity:.5; transform:scale(.85); } 10%,90% { opacity:1; transform:scale(1); } 100% { opacity:.5; transform:scale(.85); } }
@keyframes svg5-k2 { 0%,9% { opacity:0; transform:scale(.6); } 14% { opacity:1; transform:scale(1.08); } 17%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg5-k3 { 0%,19% { opacity:0; } 25%,90% { opacity:1; } 100% { opacity:0; } }
@keyframes svg5-k4 { 0%,29% { opacity:0; transform:scale(.6); } 34% { opacity:1; transform:scale(1.08); } 37%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg5-k5 { 0%,39% { opacity:0; transform:scale(.6); } 44% { opacity:1; transform:scale(1.08); } 47%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg5-k6 { 0%,49% { opacity:0; transform:scale(.6); } 54% { opacity:1; transform:scale(1.08); } 57%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg5-k7 { 0%,59% { opacity:0; transform:scale(.6); } 64% { opacity:1; transform:scale(1.08); } 67%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg5-k8 { 0%,68% { opacity:0; } 71%,90% { opacity:1; } 100% { opacity:0; } }
@keyframes svg5-k9 { 0%,79% { opacity:0; } 85%,90% { opacity:1; } 100% { opacity:0; } }
@keyframes svg5-k10 { 0%,89% { opacity:0; transform:scale(.5); } 93% { opacity:.9; } 100% { opacity:0; transform:scale(2.6); } }
@keyframes svg5-spin { from { transform:rotate(0deg); } to { transform:rotate(22.5deg); } }
@keyframes svg5-twinkle { 0%,100% { opacity:.25; transform:scale(.6); } 50% { opacity:1; transform:scale(1.15); } }
.svg5-s1 { animation:svg5-k1 6s ease-in-out infinite; transform-origin:500px 520px; }
.svg5-rays { animation:svg5-spin 6s linear infinite; transform-origin:500px 520px; }
.svg5-s2 { animation:svg5-k2 6s ease-in-out infinite; transform-origin:500px 900px; }
.svg5-s3 { animation:svg5-k3 6s ease-in-out infinite; }
.svg5-s4 { animation:svg5-k4 6s ease-in-out infinite; transform-origin:500px 470px; }
.svg5-s5 { animation:svg5-k5 6s ease-in-out infinite; transform-origin:500px 650px; }
.svg5-s6 { animation:svg5-k6 6s ease-in-out infinite; transform-origin:290px 520px; }
.svg5-s7 { animation:svg5-k7 6s ease-in-out infinite; transform-origin:710px 520px; }
.svg5-s8 { animation:svg5-k8 6s ease-in-out infinite; }
.svg5-s9 { animation:svg5-k9 6s ease-in-out infinite; }
.svg5-s10 { animation:svg5-k10 6s ease-out infinite; transform-origin:500px 520px; }
.svg5-tw { animation:svg5-twinkle 2s ease-in-out infinite; }
</style>
</defs>

<!-- Stage 1 (0-10%): sunburst rays + soft glow -->
<g class="svg5-s1">
<circle cx="500" cy="520" r="330" fill="url(#svg5-glow)" opacity=".35"/>
<g class="svg5-rays"><polygon points="500,520 470,80 530,80" fill="url(#svg5-rayg)" transform="rotate(0.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg5-rayg)" transform="rotate(22.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg5-rayg)" transform="rotate(45.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg5-rayg)" transform="rotate(67.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg5-rayg)" transform="rotate(90.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg5-rayg)" transform="rotate(112.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg5-rayg)" transform="rotate(135.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg5-rayg)" transform="rotate(157.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg5-rayg)" transform="rotate(180.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg5-rayg)" transform="rotate(202.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg5-rayg)" transform="rotate(225.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg5-rayg)" transform="rotate(247.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg5-rayg)" transform="rotate(270.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg5-rayg)" transform="rotate(292.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg5-rayg)" transform="rotate(315.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg5-rayg)" transform="rotate(337.5 500 520)"/></g>
</g>

<!-- Stage 2 (10-20%): the road of hijra -->
<g class="svg5-s2">
<path d="M410,900 L590,900 L540,640 L460,640 Z" fill="#fff6dc" stroke="#f0c040" stroke-width="6" stroke-linejoin="round"/>
<path d="M500,890 L500,650" stroke="#f0c040" stroke-width="7" stroke-linecap="round" stroke-dasharray="26 20"/>
</g>

<!-- Stage 3 (20-30%): hills on both sides -->
<g class="svg5-s3">
<path d="M70,900 Q230,730 395,900 Z" fill="url(#svg5-gt)" opacity=".75"/>
<path d="M605,900 Q770,730 930,900 Z" fill="url(#svg5-gt)" opacity=".75"/>
<path d="M130,860 Q220,780 300,860 M700,860 Q780,780 870,860" fill="none" stroke="#fff6dc" stroke-opacity=".5" stroke-width="6" stroke-linecap="round"/>
</g>

<!-- Stage 4 (30-40%): the destination, a mosque silhouette without people -->
<g class="svg5-s4">
<rect x="426" y="400" width="14" height="72" rx="5" fill="#1abc9c"/><circle cx="433" cy="394" r="9" fill="#fff0b0"/>
<rect x="560" y="400" width="14" height="72" rx="5" fill="#1abc9c"/><circle cx="567" cy="394" r="9" fill="#fff0b0"/>
<rect x="452" y="438" width="96" height="34" fill="url(#svg5-gt)" stroke="#f0c040" stroke-width="4"/>
<path d="M458,440 Q458,380 500,368 Q542,380 542,440 Z" fill="url(#svg5-gg)" stroke="#f5d77a" stroke-width="4" stroke-linejoin="round"/>
<path d="M509,330 A15,15 0 1 0 509,360 A12,12 0 1 1 509,330 Z" fill="#fff0b0"/>
</g>

<!-- Stage 5 (40-50%): the road forks in two -->
<g class="svg5-s5">
<path d="M500,660 L500,650 Q420,600 300,520" fill="none" stroke="#fff6dc" stroke-width="46" stroke-linecap="round"/>
<path d="M500,660 L500,650 Q580,600 700,520" fill="none" stroke="#fff6dc" stroke-width="46" stroke-linecap="round"/>
<path d="M500,650 Q420,600 300,520 M500,650 Q580,600 700,520" fill="none" stroke="#f0c040" stroke-width="6" stroke-linecap="round" stroke-dasharray="18 16"/>
</g>

<!-- Stage 6 (50-60%): left end, a stack of coins (dunya) -->
<g class="svg5-s6">
<rect x="236" y="500" width="108" height="22" fill="#f0c040"/><ellipse cx="290" cy="522" rx="54" ry="16" fill="#f0c040"/><ellipse cx="290" cy="500" rx="54" ry="16" fill="#fff0b0" stroke="#f0c040" stroke-width="4"/><rect x="236" y="478" width="108" height="22" fill="#f0c040"/><ellipse cx="290" cy="500" rx="54" ry="16" fill="#f0c040"/><ellipse cx="290" cy="478" rx="54" ry="16" fill="#fff0b0" stroke="#f0c040" stroke-width="4"/><rect x="236" y="456" width="108" height="22" fill="#f0c040"/><ellipse cx="290" cy="478" rx="54" ry="16" fill="#f0c040"/><ellipse cx="290" cy="456" rx="54" ry="16" fill="#fff0b0" stroke="#f0c040" stroke-width="4"/>
<path class="svg5-tw" style="transform-origin:220px 420px; animation-delay:0s" d="M220,404 Q220,420 236,420 Q220,420 220,436 Q220,420 204,420 Q220,420 220,404 Z" fill="#fff6c8"/>
</g>

<!-- Stage 7 (60-70%): right end, two interlocked rings (marriage) -->
<g class="svg5-s7">
<circle cx="680" cy="500" r="38" fill="none" stroke="#f0c040" stroke-width="13"/>
<circle cx="740" cy="500" r="38" fill="none" stroke="#fff0b0" stroke-width="13"/>
<path d="M680,446 L692,458 L680,470 L668,458 Z" fill="#8fd3ff"/>
<path class="svg5-tw" style="transform-origin:790px 420px; animation-delay:-0.8s" d="M790,404 Q790,420 806,420 Q790,420 790,436 Q790,420 774,420 Q790,420 790,404 Z" fill="#fff6c8"/>
</g>

<!-- Stage 8 (70-80%): two lights travel, one to each end -->
<g class="svg5-s8">
<g><circle cx="0" cy="0" r="42" fill="url(#svg5-glow)"/><circle cx="0" cy="0" r="13" fill="#ffffff"/><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7;0.8;1"><mpath href="#svg5-rl"/></animateMotion></g>
<g><circle cx="0" cy="0" r="42" fill="url(#svg5-glow)"/><circle cx="0" cy="0" r="13" fill="#ffffff"/><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7;0.8;1"><mpath href="#svg5-rr"/></animateMotion></g>
</g>

<!-- Stage 9 (80-90%): both ends glow -->
<g class="svg5-s9">
<circle cx="290" cy="480" r="120" fill="url(#svg5-glow)"/>
<circle cx="710" cy="500" r="120" fill="url(#svg5-glow)"/>
<path class="svg5-tw" style="transform-origin:170px 560px; animation-delay:-0.3s" d="M170,540 Q170,560 190,560 Q170,560 170,580 Q170,560 150,560 Q170,560 170,540 Z" fill="#fff6c8"/><path class="svg5-tw" style="transform-origin:850px 580px; animation-delay:-0.9s" d="M850,558 Q850,580 872,580 Q850,580 850,602 Q850,580 828,580 Q850,580 850,558 Z" fill="#fff6c8"/><path class="svg5-tw" style="transform-origin:380px 360px; animation-delay:-1.5s" d="M380,346 Q380,360 394,360 Q380,360 380,374 Q380,360 366,360 Q380,360 380,346 Z" fill="#fff6c8"/><path class="svg5-tw" style="transform-origin:620px 360px; animation-delay:-0.6s" d="M620,344 Q620,360 636,360 Q620,360 620,376 Q620,360 604,360 Q620,360 620,344 Z" fill="#fff6c8"/>
</g>

<!-- Stage 10 (90-100%): halo pulse, then fade back to stage 1 -->
<g class="svg5-s10">
<circle cx="500" cy="520" r="150" fill="none" stroke="#f5d77a" stroke-width="12"/>
<circle cx="500" cy="520" r="150" fill="url(#svg5-glow)" opacity=".5"/>
</g>
</svg>
