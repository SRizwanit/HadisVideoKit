<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="svg6-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes svg6-float {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-18px); }
      }
      @keyframes svg6-halo {
        0%, 100% { transform: scale(0.85); opacity: 0.45; }
        50%      { transform: scale(1.1); opacity: 1; }
      }
      @keyframes svg6-sway {
        0%, 100% { transform: rotate(-2deg); }
        50%      { transform: rotate(2deg); }
      }
      @keyframes svg6-grow {
        0%, 100% { transform: scale(0.55); opacity: 0.35; }
        25%, 80% { transform: scale(1); opacity: 0.9; }
      }
      @keyframes svg6-fruit {
        0%, 100% { opacity: 0.1; }
        50%      { opacity: 1; }
      }
      @keyframes svg6-twinkle {
        0%, 100% { opacity: 0.2; }
        50%      { opacity: 0.95; }
      }
      .svg6-moon { animation: svg6-float 6s ease-in-out infinite; }
      .svg6-halo { animation: svg6-halo 3s ease-in-out infinite; transform-origin: 790px 230px; }
      .svg6-crescent { fill: #f5d77a; stroke: #ffffff; stroke-width: 6; stroke-linejoin: round; }
      .svg6-sway { animation: svg6-sway 6s ease-in-out infinite; transform-origin: 500px 640px; }
      .svg6-trunk { fill: #f5d77a; fill-opacity: 0.85; stroke: #ffffff; stroke-width: 6; stroke-linejoin: round; }
      .svg6-branch { stroke: #f5d77a; stroke-width: 14; stroke-linecap: round; opacity: 0.85; }
      .svg6-ground { fill: none; stroke: #1abc9c; stroke-width: 10; stroke-linecap: round; opacity: 0.8; }
      .svg6-leaf { stroke: #ffffff; stroke-width: 4; animation: svg6-grow 6s ease-in-out infinite; }
      .svg6-green { fill: #2ecc71; }
      .svg6-teal { fill: #1abc9c; }
      .svg6-c1 { transform-origin: 500px 330px; animation-delay: 0s; }
      .svg6-c2 { transform-origin: 395px 410px; animation-delay: -1s; }
      .svg6-c3 { transform-origin: 605px 410px; animation-delay: -2s; }
      .svg6-c4 { transform-origin: 450px 490px; animation-delay: -3s; }
      .svg6-c5 { transform-origin: 550px 490px; animation-delay: -4s; }
      .svg6-c6 { transform-origin: 500px 420px; animation-delay: -5s; }
      .svg6-fruitglow { animation: svg6-fruit 3s ease-in-out infinite; }
      .svg6-fruit { fill: #f0c040; stroke: #ffffff; stroke-width: 4; }
      .svg6-f2 { animation-delay: -0.6s; }
      .svg6-f3 { animation-delay: -1.2s; }
      .svg6-f4 { animation-delay: -1.8s; }
      .svg6-f5 { animation-delay: -2.4s; }
      .svg6-star { fill: #ffffff; animation: svg6-twinkle 3s ease-in-out infinite; }
      .svg6-s2 { animation-delay: -1s; }
      .svg6-s3 { animation-delay: -2s; }
    </style>
  </defs>

  <circle class="svg6-star" cx="170" cy="200" r="8"/>
  <circle class="svg6-star svg6-s2" cx="230" cy="720" r="7"/>
  <circle class="svg6-star svg6-s3" cx="800" cy="720" r="9"/>
  <circle class="svg6-star" cx="140" cy="500" r="7"/>

  <g class="svg6-moon">
    <circle class="svg6-halo" cx="790" cy="230" r="125" fill="url(#svg6-glow)"/>
    <path class="svg6-crescent" d="M810 165 A70 70 0 1 0 810 295 A55 55 0 1 1 810 165 Z"/>
  </g>

  <path class="svg6-ground" d="M300 870 Q500 835 700 870"/>
  <path class="svg6-trunk" d="M468 860 C480 780 486 680 478 560 L522 560 C514 680 520 780 532 860 Z"/>

  <g class="svg6-sway">
    <line class="svg6-branch" x1="500" y1="650" x2="440" y2="520"/>
    <line class="svg6-branch" x1="500" y1="650" x2="560" y2="520"/>

    <circle class="svg6-leaf svg6-teal svg6-c6" cx="500" cy="420" r="90"/>
    <circle class="svg6-leaf svg6-green svg6-c1" cx="500" cy="330" r="100"/>
    <circle class="svg6-leaf svg6-teal svg6-c2" cx="395" cy="410" r="85"/>
    <circle class="svg6-leaf svg6-green svg6-c3" cx="605" cy="410" r="85"/>
    <circle class="svg6-leaf svg6-green svg6-c4" cx="450" cy="490" r="80"/>
    <circle class="svg6-leaf svg6-teal svg6-c5" cx="550" cy="490" r="80"/>

    <circle class="svg6-fruitglow" cx="445" cy="380" r="40" fill="url(#svg6-glow)"/>
    <circle class="svg6-fruit" cx="445" cy="380" r="16"/>
    <circle class="svg6-fruitglow svg6-f2" cx="565" cy="360" r="40" fill="url(#svg6-glow)"/>
    <circle class="svg6-fruit" cx="565" cy="360" r="16"/>
    <circle class="svg6-fruitglow svg6-f3" cx="500" cy="470" r="40" fill="url(#svg6-glow)"/>
    <circle class="svg6-fruit" cx="500" cy="470" r="16"/>
    <circle class="svg6-fruitglow svg6-f4" cx="370" cy="440" r="40" fill="url(#svg6-glow)"/>
    <circle class="svg6-fruit" cx="370" cy="440" r="16"/>
    <circle class="svg6-fruitglow svg6-f5" cx="630" cy="445" r="40" fill="url(#svg6-glow)"/>
    <circle class="svg6-fruit" cx="630" cy="445" r="16"/>
  </g>
</svg>
