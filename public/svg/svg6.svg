<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialGradient id="svg6-glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6c8" stop-opacity=".9"/><stop offset="1" stop-color="#f5d77a" stop-opacity="0"/></radialGradient>
<radialGradient id="svg6-rayg" gradientUnits="userSpaceOnUse" cx="500" cy="520" r="440"><stop offset="0" stop-color="#f5d77a" stop-opacity=".42"/><stop offset="1" stop-color="#f5d77a" stop-opacity="0"/></radialGradient>
<radialGradient id="svg6-gh" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#7ff0c0"/><stop offset="1" stop-color="#1abc9c"/></radialGradient>
<linearGradient id="svg6-gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fe3b8"/><stop offset="1" stop-color="#1abc9c"/></linearGradient>
<linearGradient id="svg6-gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset="1" stop-color="#f0c040"/></linearGradient>
<linearGradient id="svg6-gb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff0b0" stop-opacity=".75"/><stop offset="1" stop-color="#f5d77a" stop-opacity=".08"/></linearGradient>
<radialGradient id="svg6-gi" cx="50%" cy="60%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f5d77a"/></radialGradient>
<path id="svg6-route" d="M500,800 L500,540"/>
<style>
@keyframes svg6-k1 { 0% { opacity:.5; transform:scale(.85); } 10%,90% { opacity:1; transform:scale(1); } 100% { opacity:.5; transform:scale(.85); } }
@keyframes svg6-k2 { 0%,9% { opacity:0; transform:scale(.6); } 14% { opacity:1; transform:scale(1.08); } 17%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg6-k3 { 0%,19% { opacity:0; } 25%,90% { opacity:1; } 100% { opacity:0; } }
@keyframes svg6-k4 { 0%,29% { opacity:0; transform:scale(.6); } 34% { opacity:1; transform:scale(1.08); } 37%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg6-k5 { 0%,39% { opacity:0; transform:scaleY(.1); } 46% { opacity:1; transform:scaleY(1.04); } 48%,90% { opacity:1; transform:scaleY(1); } 100% { opacity:0; transform:scaleY(.1); } }
@keyframes svg6-k6 { 0%,49% { opacity:0; transform:scale(.6); } 54% { opacity:1; transform:scale(1.08); } 57%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg6-k7 { 0%,59% { opacity:0; } 65%,90% { opacity:1; } 100% { opacity:0; } }
@keyframes svg6-k8 { 0%,68% { opacity:0; } 71%,90% { opacity:1; } 100% { opacity:0; } }
@keyframes svg6-k9 { 0%,79% { opacity:0; } 85%,90% { opacity:1; } 100% { opacity:0; } }
@keyframes svg6-k10 { 0%,89% { opacity:0; transform:scale(.5); } 93% { opacity:.9; } 100% { opacity:0; transform:scale(2.6); } }
@keyframes svg6-spin { from { transform:rotate(0deg); } to { transform:rotate(22.5deg); } }
@keyframes svg6-twinkle { 0%,100% { opacity:.25; transform:scale(.6); } 50% { opacity:1; transform:scale(1.15); } }
@keyframes svg6-flicker { 0%,100% { transform:scale(1,1); } 50% { transform:scale(.9,1.12); } }
.svg6-s1 { animation:svg6-k1 6s ease-in-out infinite; transform-origin:500px 520px; }
.svg6-rays { animation:svg6-spin 6s linear infinite; transform-origin:500px 520px; }
.svg6-s2 { animation:svg6-k2 6s ease-in-out infinite; transform-origin:500px 884px; }
.svg6-s3 { animation:svg6-k3 6s ease-in-out infinite; }
.svg6-s4 { animation:svg6-k4 6s ease-in-out infinite; transform-origin:500px 690px; }
.svg6-s5 { animation:svg6-k5 6s ease-out infinite; transform-origin:500px 745px; }
.svg6-s6 { animation:svg6-k6 6s ease-in-out infinite; transform-origin:500px 540px; }
.svg6-s7 { animation:svg6-k7 6s ease-in-out infinite; }
.svg6-s8 { animation:svg6-k8 6s ease-in-out infinite; }
.svg6-s9 { animation:svg6-k9 6s ease-in-out infinite; }
.svg6-s10 { animation:svg6-k10 6s ease-out infinite; transform-origin:500px 520px; }
.svg6-tw { animation:svg6-twinkle 2s ease-in-out infinite; }
.svg6-flame { animation:svg6-flicker 2s ease-in-out infinite; transform-origin:500px 850px; }
</style>
</defs>

<!-- Stage 1 (0-10%): sunburst rays + soft glow -->
<g class="svg6-s1">
<circle cx="500" cy="520" r="330" fill="url(#svg6-glow)" opacity=".35"/>
<g class="svg6-rays"><polygon points="500,520 470,80 530,80" fill="url(#svg6-rayg)" transform="rotate(0.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg6-rayg)" transform="rotate(22.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg6-rayg)" transform="rotate(45.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg6-rayg)" transform="rotate(67.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg6-rayg)" transform="rotate(90.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg6-rayg)" transform="rotate(112.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg6-rayg)" transform="rotate(135.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg6-rayg)" transform="rotate(157.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg6-rayg)" transform="rotate(180.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg6-rayg)" transform="rotate(202.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg6-rayg)" transform="rotate(225.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg6-rayg)" transform="rotate(247.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg6-rayg)" transform="rotate(270.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg6-rayg)" transform="rotate(292.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg6-rayg)" transform="rotate(315.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg6-rayg)" transform="rotate(337.5 500 520)"/></g>
</g>

<!-- Stage 5 (40-50%): the beam of light rises (drawn early so the heart sits on top) -->
<g class="svg6-s5">
<path d="M470,745 L530,745 L590,525 L410,525 Z" fill="url(#svg6-gb)"/>
</g>

<!-- Stage 2 (10-20%): the small lantern (a small deed) -->
<g class="svg6-s2">
<ellipse cx="500" cy="892" rx="90" ry="10" fill="#ffffff" opacity=".12"/>
<rect x="452" y="770" width="96" height="102" rx="14" fill="#fff6dc" stroke="#f0c040" stroke-width="7"/>
<path d="M450,772 L550,772 L534,744 L466,744 Z" fill="url(#svg6-gg)" stroke="#f0c040" stroke-width="4" stroke-linejoin="round"/>
<rect x="446" y="868" width="108" height="16" rx="6" fill="url(#svg6-gt)" stroke="#f0c040" stroke-width="4"/>
</g>

<!-- Stage 3 (20-30%): handle, frame bars and the flame lights up -->
<g class="svg6-s3">
<path d="M470,744 Q500,696 530,744" fill="none" stroke="#f0c040" stroke-width="7" stroke-linecap="round"/>
<path d="M500,772 V868" stroke="#f0c040" stroke-width="5" opacity=".7"/>
<circle cx="500" cy="822" r="46" fill="url(#svg6-glow)"/>
<path class="svg6-flame" d="M500,794 Q474,826 500,852 Q526,826 500,794 Z" fill="#f5d77a" stroke="#ffffff" stroke-width="3"/>
</g>

<!-- Stage 4 (30-40%): the heart (intention for Allah) rises above the lantern -->
<g class="svg6-s4">
<path d="M500,830 C380,750 330,690 345,640 C360,590 440,585 500,650 C560,585 640,590 655,640 C670,690 620,750 500,830 Z" transform="translate(500,690) scale(.22) translate(-500,-830)" fill="url(#svg6-gh)" stroke="#f0c040" stroke-width="36" stroke-linejoin="round"/>
</g>

<!-- Stage 6 (50-60%): the gate (najat) frame with steps -->
<g class="svg6-s6">
<path fill-rule="evenodd" d="M370,520 L370,300 Q370,170 500,170 Q630,170 630,300 L630,520 Z M414,520 L414,305 Q414,214 500,214 Q586,214 586,305 L586,520 Z" fill="url(#svg6-gt)" stroke="#f0c040" stroke-width="7" stroke-linejoin="round"/>
<rect x="350" y="520" width="300" height="20" rx="6" fill="url(#svg6-gg)"/>
<rect x="330" y="540" width="340" height="20" rx="6" fill="#f0c040"/>
</g>

<!-- Stage 7 (60-70%): the gate opens with light, crescent above -->
<g class="svg6-s7">
<path d="M414,520 L414,305 Q414,214 500,214 Q586,214 586,305 L586,520 Z" fill="url(#svg6-gi)"/>
<path d="M500,520 L500,230 M500,520 L450,260 M500,520 L550,260" stroke="#ffffff" stroke-opacity=".7" stroke-width="6" stroke-linecap="round"/>
<path d="M512,92 A30,30 0 1 0 512,152 A23,23 0 1 1 512,92 Z" fill="#fff0b0" stroke="#f0c040" stroke-width="4"/>
<rect x="529" y="111" width="22" height="22" fill="#ffffff" transform="rotate(45 540 122)"/><rect x="529" y="111" width="22" height="22" fill="#ffffff"/>
</g>

<!-- Stage 8 (70-80%): the light of the small deed travels up to the gate -->
<g class="svg6-s8">
<g>
<circle cx="0" cy="0" r="46" fill="url(#svg6-glow)"/>
<circle cx="0" cy="0" r="14" fill="#ffffff"/>
<animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7;0.8;1"><mpath href="#svg6-route"/></animateMotion>
</g>
</g>

<!-- Stage 9 (80-90%): the gate blazes, everything glows -->
<g class="svg6-s9">
<circle cx="500" cy="360" r="230" fill="url(#svg6-glow)"/>
<circle cx="500" cy="820" r="110" fill="url(#svg6-glow)"/>
<path class="svg6-tw" style="transform-origin:300px 330px; animation-delay:-0.3s" d="M300,308 Q300,330 322,330 Q300,330 300,352 Q300,330 278,330 Q300,330 300,308 Z" fill="#fff6c8"/><path class="svg6-tw" style="transform-origin:710px 300px; animation-delay:-0.9s" d="M710,280 Q710,300 730,300 Q710,300 710,320 Q710,300 690,300 Q710,300 710,280 Z" fill="#fff6c8"/><path class="svg6-tw" style="transform-origin:660px 620px; animation-delay:-1.5s" d="M660,604 Q660,620 676,620 Q660,620 660,636 Q660,620 644,620 Q660,620 660,604 Z" fill="#fff6c8"/><path class="svg6-tw" style="transform-origin:340px 640px; animation-delay:-0.6s" d="M340,622 Q340,640 358,640 Q340,640 340,658 Q340,640 322,640 Q340,640 340,622 Z" fill="#fff6c8"/>
</g>

<!-- Stage 10 (90-100%): halo pulse, then fade back to stage 1 -->
<g class="svg6-s10">
<circle cx="500" cy="520" r="150" fill="none" stroke="#f5d77a" stroke-width="12"/>
<circle cx="500" cy="520" r="150" fill="url(#svg6-glow)" opacity=".5"/>
</g>
</svg>
