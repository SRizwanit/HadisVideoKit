<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="svg6-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <style>
      /* Stage 1 (0-2s): a small lamp (a small deed with a pure intention) */
      @keyframes svg6-k1 {
        0%   { transform: scale(0.65); opacity: 0.7; }
        30%  { transform: scale(1);    opacity: 1; }
        90%  { transform: scale(1);    opacity: 1; }
        100% { transform: scale(0.65); opacity: 0.7; }
      }
      /* Stage 2 (2-4s): its light rises to a closed gate */
      @keyframes svg6-k2 {
        0%, 30%  { opacity: 0; }
        42%, 88% { opacity: 1; }
        100%     { opacity: 0; }
      }
      @keyframes svg6-draw {
        0%, 30%   { stroke-dashoffset: 1; }
        46%, 100% { stroke-dashoffset: 0; }
      }
      @keyframes svg6-openL {
        0%, 63%   { transform: scaleX(1); }
        82%, 100% { transform: scaleX(0.12); }
      }
      @keyframes svg6-inner {
        0%, 60%   { opacity: 0; }
        78%, 100% { opacity: 1; }
      }
      /* Stage 3 (4-6s): the gate opens, light and salvation */
      @keyframes svg6-k3 {
        0%, 63%  { opacity: 0; }
        75%, 88% { opacity: 1; }
        100%     { opacity: 0; }
      }
      @keyframes svg6-flicker {
        0%, 100% { transform: scale(0.92); }
        50%      { transform: scale(1.08); }
      }
      @keyframes svg6-pulse {
        0%, 100% { transform: scale(0.9); opacity: 0.55; }
        50%      { transform: scale(1.1); opacity: 1; }
      }
      @keyframes svg6-twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.7); }
        50%      { opacity: 1;   transform: scale(1.2); }
      }
      @keyframes svg6-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      .svg6-s1 { animation: svg6-k1 6s ease-in-out infinite; transform-origin: 500px 840px; }
      .svg6-s2 { animation: svg6-k2 6s ease-in-out infinite; }
      .svg6-s3 { animation: svg6-k3 6s ease-in-out infinite; }

      .svg6-halo1 { animation: svg6-pulse 3s ease-in-out infinite; transform-origin: 500px 790px; }
      .svg6-flame { animation: svg6-flicker 2s ease-in-out infinite; transform-origin: 500px 800px; }

      .svg6-ray1 { stroke-dasharray: 1; stroke-dashoffset: 1; animation: svg6-draw 6s ease-in-out infinite; }
      .svg6-ray2 { stroke-dasharray: 1; stroke-dashoffset: 1; animation: svg6-draw 6s ease-in-out infinite; }
      .svg6-ray3 { stroke-dasharray: 1; stroke-dashoffset: 1; animation: svg6-draw 6s ease-in-out infinite; }
      .svg6-inner { animation: svg6-inner 6s ease-in-out infinite; }
      .svg6-leafL { animation: svg6-openL 6s ease-in-out infinite; transform-origin: 380px 440px; }
      .svg6-leafR { animation: svg6-openL 6s ease-in-out infinite; transform-origin: 620px 440px; }

      .svg6-halo3 { animation: svg6-pulse 3s ease-in-out infinite; transform-origin: 500px 440px; }
      .svg6-ring  { animation: svg6-spin 6s linear infinite; transform-origin: 500px 440px; }
      .svg6-moon  { animation: svg6-pulse 3s ease-in-out infinite; transform-origin: 500px 215px; }
      .svg6-sp1 { animation: svg6-twinkle 2s ease-in-out infinite;       transform-origin: 250px 300px; }
      .svg6-sp2 { animation: svg6-twinkle 2s ease-in-out infinite -0.7s; transform-origin: 750px 300px; }
      .svg6-sp3 { animation: svg6-twinkle 3s ease-in-out infinite -1.4s; transform-origin: 230px 520px; }
      .svg6-sp4 { animation: svg6-twinkle 3s ease-in-out infinite -0.5s; transform-origin: 770px 520px; }
      .svg6-sp5 { animation: svg6-twinkle 2s ease-in-out infinite -1.2s; transform-origin: 340px 190px; }
      .svg6-sp6 { animation: svg6-twinkle 2s ease-in-out infinite -0.3s; transform-origin: 660px 190px; }
    </style>
  </defs>

  <!-- Stage 1: a small lamp with a flame -->
  <g class="svg6-s1">
    <circle class="svg6-halo1" cx="500" cy="790" r="170" fill="url(#svg6-glow)"/>
    <path d="M455 735 L545 735 L560 750 L440 750 Z" fill="#f5d77a" fill-opacity="0.35" stroke="#f5d77a" stroke-width="8" stroke-linejoin="round"/>
    <rect x="450" y="750" width="100" height="90" rx="10" fill="#f5d77a" fill-opacity="0.18" stroke="#f5d77a" stroke-width="10"/>
    <rect x="435" y="840" width="130" height="20" rx="8" fill="#f0c040"/>
    <path d="M470 735 Q500 695 530 735" fill="none" stroke="#f0c040" stroke-width="8" stroke-linecap="round"/>
    <g class="svg6-flame">
      <path d="M500 825 Q468 795 500 755 Q532 795 500 825 Z" fill="#fff6c8" stroke="#f5d77a" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="500" cy="800" r="10" fill="#ffffff"/>
    </g>
  </g>

  <!-- Stage 2: the lamp's light rises toward a closed gate, which then opens -->
  <g class="svg6-s2">
    <path class="svg6-ray1" pathLength="1" d="M500 725 L500 615" fill="none" stroke="#f5d77a" stroke-width="10" stroke-linecap="round"/>
    <path class="svg6-ray2" pathLength="1" d="M470 735 L405 625" fill="none" stroke="#f0c040" stroke-width="10" stroke-linecap="round"/>
    <path class="svg6-ray3" pathLength="1" d="M530 735 L595 625" fill="none" stroke="#f0c040" stroke-width="10" stroke-linecap="round"/>
    <path d="M380 600 L380 440 A120 120 0 0 1 620 440 L620 600 Z" fill="#1abc9c" fill-opacity="0.12" stroke="#1abc9c" stroke-width="10" stroke-linejoin="round"/>
    <g class="svg6-inner">
      <circle cx="500" cy="450" r="130" fill="url(#svg6-glow)"/>
      <circle cx="500" cy="450" r="26" fill="#ffffff"/>
    </g>
    <g class="svg6-leafL">
      <path d="M380 600 L380 440 A120 120 0 0 1 500 320 L500 600 Z" fill="#f5d77a" fill-opacity="0.3" stroke="#f5d77a" stroke-width="8" stroke-linejoin="round"/>
      <circle cx="478" cy="470" r="9" fill="#ffffff"/>
    </g>
    <g class="svg6-leafR">
      <path d="M500 320 A120 120 0 0 1 620 440 L620 600 L500 600 Z" fill="#f5d77a" fill-opacity="0.3" stroke="#f5d77a" stroke-width="8" stroke-linejoin="round"/>
      <circle cx="522" cy="470" r="9" fill="#ffffff"/>
    </g>
  </g>

  <!-- Stage 3: crescent, glow and sparkles around the open gate -->
  <g class="svg6-s3">
    <circle class="svg6-halo3" cx="500" cy="440" r="290" fill="url(#svg6-glow)"/>
    <g class="svg6-ring">
      <circle cx="500" cy="440" r="210" fill="none" stroke="#8fd3ff" stroke-width="5" stroke-dasharray="10 18" opacity="0.8"/>
    </g>
    <g class="svg6-moon">
      <path d="M500 170 A42 42 0 1 0 532 248 A34 34 0 1 1 500 170 Z" fill="#f0c040" stroke="#fff6c8" stroke-width="4"/>
    </g>
    <circle class="svg6-sp1" cx="250" cy="300" r="9" fill="#ffffff"/>
    <circle class="svg6-sp2" cx="750" cy="300" r="9" fill="#f0c040"/>
    <circle class="svg6-sp3" cx="230" cy="520" r="8" fill="#8fd3ff"/>
    <circle class="svg6-sp4" cx="770" cy="520" r="8" fill="#ffffff"/>
    <circle class="svg6-sp5" cx="340" cy="190" r="7" fill="#f5d77a"/>
    <circle class="svg6-sp6" cx="660" cy="190" r="7" fill="#2ecc71"/>
  </g>
</svg>
