<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="svg6-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes svg6-k1 {
        0%   { transform: scale(0.6); opacity: 0.7; }
        30%  { transform: scale(1);   opacity: 1; }
        90%  { transform: scale(1);   opacity: 1; }
        100% { transform: scale(0.6); opacity: 0.7; }
      }
      @keyframes svg6-k2 {
        0%, 30%   { opacity: 0; }
        45%, 80%  { opacity: 1; }
        100%      { opacity: 0; }
      }
      @keyframes svg6-k3 {
        0%, 63%   { opacity: 0; }
        78%, 88%  { opacity: 1; }
        100%      { opacity: 0; }
      }
      @keyframes svg6-drop {
        0%, 2%  { opacity: 0; transform: translateY(-100px); }
        8%      { opacity: 1; transform: translateY(-80px); }
        28%     { opacity: 1; transform: translateY(100px); }
        34%     { opacity: 0; transform: translateY(110px); }
        100%    { opacity: 0; transform: translateY(-100px); }
      }
      @keyframes svg6-hfill {
        0%, 26%  { fill-opacity: 0.08; }
        36%, 88% { fill-opacity: 0.45; }
        100%     { fill-opacity: 0.08; }
      }
      @keyframes svg6-ra {
        0%, 32%  { opacity: 0; transform: scale(0.5); }
        36%      { opacity: 0.9; transform: scale(0.6); }
        62%      { opacity: 0; transform: scale(2.4); }
        100%     { opacity: 0; transform: scale(2.4); }
      }
      @keyframes svg6-rb {
        0%, 40%  { opacity: 0; transform: scale(0.5); }
        44%      { opacity: 0.8; transform: scale(0.6); }
        70%      { opacity: 0; transform: scale(2.4); }
        100%     { opacity: 0; transform: scale(2.4); }
      }
      @keyframes svg6-rc {
        0%, 48%  { opacity: 0; transform: scale(0.5); }
        52%      { opacity: 0.7; transform: scale(0.6); }
        78%      { opacity: 0; transform: scale(2.4); }
        100%     { opacity: 0; transform: scale(2.4); }
      }
      @keyframes svg6-book {
        0%, 63%   { transform: translateY(150px); }
        80%, 88%  { transform: translateY(0); }
        100%      { transform: translateY(150px); }
      }
      @keyframes svg6-twinkle { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      .svg6-s1 { animation: svg6-k1 6s ease-in-out infinite; transform-origin: 500px 600px; }
      .svg6-s2 { animation: svg6-k2 6s ease-in-out infinite; }
      .svg6-s3 { animation: svg6-k3 6s ease-in-out infinite; }
      .svg6-drop { animation: svg6-drop 6s ease-in infinite; }
      .svg6-heart { animation: svg6-hfill 6s ease-in-out infinite; }
      .svg6-r1 { animation: svg6-ra 6s ease-out infinite; transform-origin: 500px 600px; }
      .svg6-r2 { animation: svg6-rb 6s ease-out infinite; transform-origin: 500px 600px; }
      .svg6-r3 { animation: svg6-rc 6s ease-out infinite; transform-origin: 500px 600px; }
      .svg6-book { animation: svg6-book 6s ease-in-out infinite; }
      .svg6-tw { animation: svg6-twinkle 2s ease-in-out infinite; }
      .svg6-tw2 { animation: svg6-twinkle 2s ease-in-out infinite; animation-delay: -1s; }
    </style>
  </defs>

  <!-- Stage 1: a heart, a drop of light falls on it -->
  <g class="svg6-s1">
    <path class="svg6-heart" transform="translate(0 -120)" d="M500 800 C405 735 395 655 450 648 C480 645 495 665 500 682 C505 665 520 645 550 648 C605 655 595 735 500 800 Z" fill="#f5d77a" stroke="#f5d77a" stroke-width="12" stroke-linejoin="round"/>
    <g class="svg6-drop">
      <path d="M500 340 C470 390 465 420 500 435 C535 420 530 390 500 340 Z" fill="#ffffff"/>
      <circle cx="500" cy="395" r="48" fill="url(#svg6-glow)"/>
    </g>
  </g>

  <!-- Stage 2: round ripples spread from the heart -->
  <g class="svg6-s2">
    <circle class="svg6-r1" cx="500" cy="600" r="130" fill="none" stroke="#ffffff" stroke-width="6"/>
    <circle class="svg6-r2" cx="500" cy="600" r="130" fill="none" stroke="#1abc9c" stroke-width="6"/>
    <circle class="svg6-r3" cx="500" cy="600" r="130" fill="none" stroke="#8fd3ff" stroke-width="6"/>
  </g>

  <!-- Stage 3: a book rises out of the ripples -->
  <g class="svg6-s3">
    <circle cx="500" cy="370" r="230" fill="url(#svg6-glow)"/>
    <g class="svg6-book">
      <path d="M500 330 Q440 305 360 320 L360 430 Q440 415 500 440 Z" fill="#ffffff" fill-opacity="0.15" stroke="#f5d77a" stroke-width="8" stroke-linejoin="round"/>
      <path d="M500 330 Q560 305 640 320 L640 430 Q560 415 500 440 Z" fill="#ffffff" fill-opacity="0.15" stroke="#f5d77a" stroke-width="8" stroke-linejoin="round"/>
      <line x1="395" y1="352" x2="470" y2="360" stroke="#2ecc71" stroke-width="6" stroke-linecap="round"/>
      <line x1="395" y1="382" x2="470" y2="390" stroke="#2ecc71" stroke-width="6" stroke-linecap="round"/>
      <line x1="530" y1="360" x2="605" y2="352" stroke="#2ecc71" stroke-width="6" stroke-linecap="round"/>
      <line x1="530" y1="390" x2="605" y2="382" stroke="#2ecc71" stroke-width="6" stroke-linecap="round"/>
    </g>
    <circle class="svg6-tw" cx="300" cy="260" r="9" fill="#ffffff"/>
    <circle class="svg6-tw2" cx="700" cy="260" r="9" fill="#8fd3ff"/>
    <circle class="svg6-tw2" cx="500" cy="210" r="8" fill="#f5d77a"/>
  </g>
</svg>
