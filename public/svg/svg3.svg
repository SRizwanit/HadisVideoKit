<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="svg3-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <style>
      /* Stage 1 (0-2s): the heart of intention appears */
      @keyframes svg3-k1 {
        0%   { transform: scale(0.65); opacity: 0.7; }
        30%  { transform: scale(1);    opacity: 1; }
        90%  { transform: scale(1);    opacity: 1; }
        100% { transform: scale(0.65); opacity: 0.7; }
      }
      /* Stage 2 (2-4s): the deed grows from it (stem and leaves) */
      @keyframes svg3-k2 {
        0%, 30%  { opacity: 0; }
        42%, 88% { opacity: 1; }
        100%     { opacity: 0; }
      }
      /* Stage 3 (4-6s): the reward blooms */
      @keyframes svg3-k3 {
        0%, 63%  { opacity: 0; }
        75%, 88% { opacity: 1; }
        100%     { opacity: 0; }
      }
      @keyframes svg3-draw {
        0%, 30%   { stroke-dashoffset: 1; }
        48%, 100% { stroke-dashoffset: 0; }
      }
      @keyframes svg3-leaf {
        0%, 40%   { transform: scale(0); }
        54%       { transform: scale(1.12); }
        62%, 100% { transform: scale(1); }
      }
      @keyframes svg3-bloom {
        0%, 63%   { transform: scale(0.2); }
        80%       { transform: scale(1.12); }
        88%, 100% { transform: scale(1); }
      }
      @keyframes svg3-beat {
        0%, 100% { transform: scale(0.94); }
        50%      { transform: scale(1.06); }
      }
      @keyframes svg3-pulse {
        0%, 100% { transform: scale(0.9); opacity: 0.55; }
        50%      { transform: scale(1.1); opacity: 1; }
      }
      @keyframes svg3-twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.7); }
        50%      { opacity: 1;   transform: scale(1.2); }
      }
      @keyframes svg3-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      .svg3-s1 { animation: svg3-k1 6s ease-in-out infinite; transform-origin: 500px 720px; }
      .svg3-s2 { animation: svg3-k2 6s ease-in-out infinite; }
      .svg3-s3 { animation: svg3-k3 6s ease-in-out infinite; }

      .svg3-halo1 { animation: svg3-pulse 3s ease-in-out infinite; transform-origin: 500px 720px; }
      .svg3-heart { animation: svg3-beat 3s ease-in-out infinite; transform-origin: 500px 720px; }

      .svg3-stem  { stroke-dasharray: 1; stroke-dashoffset: 1; animation: svg3-draw 6s ease-in-out infinite; }
      .svg3-leafL { animation: svg3-leaf 6s ease-in-out infinite; transform-origin: 500px 520px; }
      .svg3-leafR { animation: svg3-leaf 6s ease-in-out infinite; transform-origin: 500px 520px; }

      .svg3-halo3  { animation: svg3-pulse 3s ease-in-out infinite; transform-origin: 500px 330px; }
      .svg3-flower { animation: svg3-bloom 6s ease-in-out infinite; transform-origin: 500px 330px; }
      .svg3-ring   { animation: svg3-spin 6s linear infinite; transform-origin: 500px 330px; }
      .svg3-sp1 { animation: svg3-twinkle 2s ease-in-out infinite;       transform-origin: 330px 180px; }
      .svg3-sp2 { animation: svg3-twinkle 2s ease-in-out infinite -0.7s; transform-origin: 670px 180px; }
      .svg3-sp3 { animation: svg3-twinkle 3s ease-in-out infinite -1.4s; transform-origin: 260px 330px; }
      .svg3-sp4 { animation: svg3-twinkle 3s ease-in-out infinite -0.5s; transform-origin: 740px 330px; }
      .svg3-sp5 { animation: svg3-twinkle 2s ease-in-out infinite -1.2s; transform-origin: 380px 480px; }
      .svg3-sp6 { animation: svg3-twinkle 2s ease-in-out infinite -0.3s; transform-origin: 620px 480px; }
    </style>
  </defs>

  <!-- Stage 1: the heart of intention, glowing -->
  <g class="svg3-s1">
    <circle class="svg3-halo1" cx="500" cy="720" r="190" fill="url(#svg3-glow)"/>
    <g class="svg3-heart">
      <path d="M500 810 C375 725 375 615 450 615 C482 615 500 638 500 662 C500 638 518 615 550 615 C625 615 625 725 500 810 Z" fill="#f5d77a" fill-opacity="0.28" stroke="#f5d77a" stroke-width="12" stroke-linejoin="round"/>
      <path d="M500 780 C415 722 415 650 458 650 C480 650 500 668 500 686 C500 668 520 650 542 650 C585 650 585 722 500 780 Z" fill="#1abc9c" fill-opacity="0.2" stroke="#2ecc71" stroke-width="6" stroke-linejoin="round"/>
    </g>
    <circle cx="500" cy="715" r="20" fill="#ffffff"/>
  </g>

  <!-- Stage 2: the deed grows out of the intention (stem and two leaves) -->
  <g class="svg3-s2">
    <path class="svg3-stem" pathLength="1" d="M500 615 L500 400" fill="none" stroke="#2ecc71" stroke-width="12" stroke-linecap="round"/>
    <g class="svg3-leafL">
      <path d="M500 540 Q405 525 385 440 Q485 450 500 540 Z" fill="#2ecc71" fill-opacity="0.35" stroke="#2ecc71" stroke-width="8" stroke-linejoin="round"/>
    </g>
    <g class="svg3-leafR">
      <path d="M500 500 Q595 485 615 400 Q515 410 500 500 Z" fill="#1abc9c" fill-opacity="0.35" stroke="#1abc9c" stroke-width="8" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Stage 3: the reward blooms into a golden flower with light -->
  <g class="svg3-s3">
    <circle class="svg3-halo3" cx="500" cy="330" r="240" fill="url(#svg3-glow)"/>
    <g class="svg3-ring">
      <circle cx="500" cy="330" r="150" fill="none" stroke="#8fd3ff" stroke-width="5" stroke-dasharray="10 18" opacity="0.8"/>
    </g>
    <g class="svg3-flower">
      <ellipse cx="500" cy="262" rx="26" ry="62" fill="#f5d77a" fill-opacity="0.35" stroke="#f5d77a" stroke-width="8" transform="rotate(0 500 330)"/>
      <ellipse cx="500" cy="262" rx="26" ry="62" fill="#f0c040" fill-opacity="0.35" stroke="#f0c040" stroke-width="8" transform="rotate(45 500 330)"/>
      <ellipse cx="500" cy="262" rx="26" ry="62" fill="#f5d77a" fill-opacity="0.35" stroke="#f5d77a" stroke-width="8" transform="rotate(90 500 330)"/>
      <ellipse cx="500" cy="262" rx="26" ry="62" fill="#f0c040" fill-opacity="0.35" stroke="#f0c040" stroke-width="8" transform="rotate(135 500 330)"/>
      <ellipse cx="500" cy="262" rx="26" ry="62" fill="#f5d77a" fill-opacity="0.35" stroke="#f5d77a" stroke-width="8" transform="rotate(180 500 330)"/>
      <ellipse cx="500" cy="262" rx="26" ry="62" fill="#f0c040" fill-opacity="0.35" stroke="#f0c040" stroke-width="8" transform="rotate(225 500 330)"/>
      <ellipse cx="500" cy="262" rx="26" ry="62" fill="#f5d77a" fill-opacity="0.35" stroke="#f5d77a" stroke-width="8" transform="rotate(270 500 330)"/>
      <ellipse cx="500" cy="262" rx="26" ry="62" fill="#f0c040" fill-opacity="0.35" stroke="#f0c040" stroke-width="8" transform="rotate(315 500 330)"/>
      <circle cx="500" cy="330" r="30" fill="#ffffff"/>
    </g>
    <circle class="svg3-sp1" cx="330" cy="180" r="9" fill="#ffffff"/>
    <circle class="svg3-sp2" cx="670" cy="180" r="9" fill="#f0c040"/>
    <circle class="svg3-sp3" cx="260" cy="330" r="8" fill="#8fd3ff"/>
    <circle class="svg3-sp4" cx="740" cy="330" r="8" fill="#ffffff"/>
    <circle class="svg3-sp5" cx="380" cy="480" r="7" fill="#f5d77a"/>
    <circle class="svg3-sp6" cx="620" cy="480" r="7" fill="#2ecc71"/>
  </g>
</svg>
