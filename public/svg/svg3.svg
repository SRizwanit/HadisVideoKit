<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="svg3-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes svg3-pulse {
        0%, 100% { transform: scale(0.8); opacity: 0.45; }
        50%      { transform: scale(1.1); opacity: 1; }
      }
      @keyframes svg3-flicker {
        0%, 100% { transform: scale(1, 0.92); }
        50%      { transform: scale(1, 1.06); }
      }
      @keyframes svg3-twinkle {
        0%, 100% { opacity: 0.15; }
        50%      { opacity: 1; }
      }
      .svg3-halo { animation: svg3-pulse 3s ease-in-out infinite; transform-origin: 500px 490px; }
      .svg3-handle { fill: none; stroke: #f5d77a; stroke-width: 12; stroke-linecap: round; }
      .svg3-cap { fill: #f5d77a; fill-opacity: 0.9; stroke: #ffffff; stroke-width: 8; stroke-linejoin: round; }
      .svg3-body { fill: #f5d77a; fill-opacity: 0.12; stroke: #f5d77a; stroke-width: 12; stroke-linejoin: round; }
      .svg3-bar { fill: none; stroke: #1abc9c; stroke-width: 10; stroke-linecap: round; }
      .svg3-base { fill: #f5d77a; fill-opacity: 0.9; stroke: #ffffff; stroke-width: 8; stroke-linejoin: round; }
      .svg3-knob { fill: #ffffff; }
      .svg3-flame { animation: svg3-flicker 2s ease-in-out infinite; transform-origin: 500px 575px; }
      .svg3-flame-out { fill: #f0c040; }
      .svg3-flame-in { fill: #ffffff; }
      .svg3-star { fill: #8fd3ff; animation: svg3-twinkle 3s ease-in-out infinite; }
      .svg3-d1 { animation-delay: -0.375s; }
      .svg3-d2 { animation-delay: -0.75s; }
      .svg3-d3 { animation-delay: -1.125s; }
      .svg3-d4 { animation-delay: -1.5s; }
      .svg3-d5 { animation-delay: -1.875s; }
      .svg3-d6 { animation-delay: -2.25s; }
      .svg3-d7 { animation-delay: -2.625s; }
    </style>
  </defs>

  <circle class="svg3-halo" cx="500" cy="490" r="300" fill="url(#svg3-glow)"/>

  <polygon class="svg3-star" points="0,-22 6,-6 22,0 6,6 0,22 -6,6 -22,0 -6,-6" transform="translate(833 628)"/>
  <polygon class="svg3-star svg3-d1" points="0,-22 6,-6 22,0 6,6 0,22 -6,6 -22,0 -6,-6" transform="translate(638 823)"/>
  <polygon class="svg3-star svg3-d2" points="0,-22 6,-6 22,0 6,6 0,22 -6,6 -22,0 -6,-6" transform="translate(362 823)"/>
  <polygon class="svg3-star svg3-d3" points="0,-22 6,-6 22,0 6,6 0,22 -6,6 -22,0 -6,-6" transform="translate(167 628)"/>
  <polygon class="svg3-star svg3-d4" points="0,-22 6,-6 22,0 6,6 0,22 -6,6 -22,0 -6,-6" transform="translate(167 352)"/>
  <polygon class="svg3-star svg3-d5" points="0,-22 6,-6 22,0 6,6 0,22 -6,6 -22,0 -6,-6" transform="translate(362 157)"/>
  <polygon class="svg3-star svg3-d6" points="0,-22 6,-6 22,0 6,6 0,22 -6,6 -22,0 -6,-6" transform="translate(638 157)"/>
  <polygon class="svg3-star svg3-d7" points="0,-22 6,-6 22,0 6,6 0,22 -6,6 -22,0 -6,-6" transform="translate(833 352)"/>

  <path class="svg3-handle" d="M440 230 C440 130 560 130 560 230"/>
  <path class="svg3-body" d="M400 290 L380 400 Q370 490 380 580 L400 690 L600 690 L620 580 Q630 490 620 400 L600 290 Z"/>
  <path class="svg3-bar" d="M460 290 Q440 490 460 690"/>
  <path class="svg3-bar" d="M540 290 Q560 490 540 690"/>
  <polygon class="svg3-cap" points="400,290 440,230 560,230 600,290"/>
  <polygon class="svg3-base" points="400,690 600,690 580,740 420,740"/>
  <circle class="svg3-knob" cx="500" cy="765" r="14"/>

  <g class="svg3-flame">
    <path class="svg3-flame-out" d="M500 390 C545 450 560 510 500 575 C440 510 455 450 500 390 Z"/>
    <path class="svg3-flame-in" d="M500 450 C522 485 528 520 500 550 C472 520 478 485 500 450 Z"/>
  </g>
</svg>
