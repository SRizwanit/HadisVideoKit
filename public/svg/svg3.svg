<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="svg3-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes svg3-k1 {
        0%   { transform: scale(0.6); opacity: 0.7; }
        30%  { transform: scale(1);   opacity: 1; }
        90%  { transform: scale(1);   opacity: 1; }
        100% { transform: scale(0.6); opacity: 0.7; }
      }
      @keyframes svg3-k2 {
        0%, 30%   { opacity: 0; transform: scale(0.8); }
        45%, 88%  { opacity: 1; transform: scale(1); }
        100%      { opacity: 0; transform: scale(0.8); }
      }
      @keyframes svg3-k3 {
        0%, 63%   { opacity: 0; }
        78%, 88%  { opacity: 1; }
        100%      { opacity: 0; }
      }
      @keyframes svg3-rise {
        0%, 63%   { transform: translateY(24px); }
        78%, 88%  { transform: translateY(0); }
        100%      { transform: translateY(24px); }
      }
      @keyframes svg3-top {
        0%   { transform: scaleY(1); }
        88%  { transform: scaleY(0.4); }
        100% { transform: scaleY(1); }
      }
      @keyframes svg3-bot {
        0%   { transform: scaleY(0.2); }
        88%  { transform: scaleY(1); }
        100% { transform: scaleY(0.2); }
      }
      @keyframes svg3-flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -32; } }
      @keyframes svg3-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes svg3-twinkle {
        0%, 100% { opacity: 0.35; }
        50%      { opacity: 1; }
      }
      .svg3-s1 { animation: svg3-k1 6s ease-in-out infinite; transform-origin: 500px 420px; }
      .svg3-s2 { animation: svg3-k2 6s ease-in-out infinite; transform-origin: 500px 420px; }
      .svg3-s3 { animation: svg3-k3 6s ease-in-out infinite; transform-origin: 500px 420px; }
      .svg3-note { animation: svg3-rise 6s ease-in-out infinite; }
      .svg3-sandtop { animation: svg3-top 6s ease-in-out infinite; transform-origin: 500px 405px; }
      .svg3-sandbot { animation: svg3-bot 6s ease-in-out infinite; transform-origin: 500px 580px; }
      .svg3-stream { stroke-dasharray: 6 10; animation: svg3-flow 2s linear infinite; }
      .svg3-orbit { animation: svg3-spin 6s linear infinite; transform-origin: 500px 420px; }
      .svg3-star { animation: svg3-twinkle 2s ease-in-out infinite; }
      .svg3-star2 { animation: svg3-twinkle 2s ease-in-out infinite; animation-delay: -1s; }
    </style>
  </defs>

  <!-- Stage 1: hourglass -->
  <g class="svg3-s1">
    <rect x="370" y="230" width="260" height="20" rx="10" fill="#f5d77a"/>
    <rect x="370" y="590" width="260" height="20" rx="10" fill="#f5d77a"/>
    <path d="M400 250 L600 250 L520 420 L600 590 L400 590 L480 420 Z" fill="#ffffff" fill-opacity="0.08" stroke="#f5d77a" stroke-width="12" stroke-linejoin="round"/>
    <polygon class="svg3-sandtop" points="430,262 570,262 515,405 485,405" fill="#f0c040"/>
    <polygon class="svg3-sandbot" points="420,580 580,580 530,535 500,505 470,535" fill="#f0c040"/>
    <line class="svg3-stream" x1="500" y1="420" x2="500" y2="540" stroke="#f0c040" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Stage 2: sun and moon take turns around the hourglass -->
  <g class="svg3-s2">
    <circle cx="500" cy="420" r="300" fill="none" stroke="#8fd3ff" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="4 14"/>
    <g class="svg3-orbit">
      <g transform="translate(500 120)">
        <circle r="34" fill="#f0c040"/>
        <circle r="48" fill="none" stroke="#f5d77a" stroke-width="6" stroke-dasharray="10 14"/>
      </g>
      <g transform="translate(500 720)">
        <path d="M10 -38 A38 38 0 1 0 10 38 A60 60 0 0 1 10 -38 Z" fill="#8fd3ff"/>
      </g>
    </g>
  </g>

  <!-- Stage 3: a small banknote appears below -->
  <g class="svg3-s3">
    <circle cx="500" cy="420" r="320" fill="url(#svg3-glow)"/>
    <g class="svg3-note">
      <rect x="400" y="775" width="200" height="90" rx="12" fill="#2ecc71" fill-opacity="0.15" stroke="#2ecc71" stroke-width="8"/>
      <circle cx="500" cy="820" r="22" fill="none" stroke="#f5d77a" stroke-width="7"/>
      <circle cx="428" cy="820" r="6" fill="#ffffff"/>
      <circle cx="572" cy="820" r="6" fill="#ffffff"/>
    </g>
    <circle class="svg3-star" cx="250" cy="300" r="10" fill="#ffffff"/>
    <circle class="svg3-star2" cx="750" cy="300" r="10" fill="#8fd3ff"/>
    <circle class="svg3-star2" cx="270" cy="600" r="8" fill="#f5d77a"/>
    <circle class="svg3-star" cx="730" cy="600" r="8" fill="#ffffff"/>
  </g>
</svg>
