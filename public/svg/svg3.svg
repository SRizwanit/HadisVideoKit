<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="svg3-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f5d77a" stop-opacity="0"/>
    </radialGradient>
    <style>
      /* ===== ১০ stage, ৬ সেকেন্ড লুপ: প্রতি stage = ১০% = ০.৬ সেকেন্ড ===== */

      /* Stage 1 (0-10%): নিয়তের হৃদয়, সবসময় দৃশ্যমান */
      @keyframes svg3-k1 {
        0%   { transform: scale(0.6); opacity: 0.7; }
        8%   { transform: scale(1);   opacity: 1; }
        96%  { transform: scale(1);   opacity: 1; }
        100% { transform: scale(0.6); opacity: 0.7; }
      }
      /* Stage 2..10: নিজের stage-এ ফোটে, ৯৬% থেকে ১০০% এ মিলিয়ে যায় */
      @keyframes svg3-k2  { 0%, 10% { opacity: 0; } 14%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg3-k3  { 0%, 20% { opacity: 0; } 24%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg3-k4  { 0%, 30% { opacity: 0; } 34%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg3-k5  { 0%, 40% { opacity: 0; } 44%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg3-k6  { 0%, 50% { opacity: 0; } 54%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg3-k7  { 0%, 60% { opacity: 0; } 64%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg3-k8  { 0%, 70% { opacity: 0; } 74%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg3-k9  { 0%, 80% { opacity: 0; } 84%, 96% { opacity: 1; } 100% { opacity: 0; } }
      @keyframes svg3-k10 { 0%, 90% { opacity: 0; } 94%, 96% { opacity: 1; } 100% { opacity: 0; } }

      /* হৃদয়ের মৃদু স্পন্দন */
      @keyframes svg3-beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

      /* আলোর ধারা নিচে নামে (৩০ একক = এক পুনরাবৃত্তি) */
      @keyframes svg3-beam { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -30; } }

      /* অঙ্কুর, ডাল ও গাছের মুকুট বেড়ে ওঠা */
      @keyframes svg3-g5 { 0%, 40% { transform: scaleY(0); } 50%, 100% { transform: scaleY(1); } }
      @keyframes svg3-g6 { 0%, 50% { transform: scaleY(0); } 60%, 100% { transform: scaleY(1); } }
      @keyframes svg3-g7 { 0%, 60% { transform: scale(0); } 72% { transform: scale(1.08); } 76%, 100% { transform: scale(1); } }

      /* ছোট বাড়তি অ্যানিমেশন (৬ সেকেন্ডে সমান ভাগ হয়) */
      @keyframes svg3-twinkle { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes svg3-pulse   { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @keyframes svg3-spin    { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      .svg3-s1  { animation: svg3-k1 6s ease-in-out infinite; transform-origin: 500px 260px; }
      .svg3-s2  { animation: svg3-k2 6s ease-in-out infinite; }
      .svg3-s3  { animation: svg3-k3 6s ease-in-out infinite; }
      .svg3-s4  { animation: svg3-k4 6s ease-in-out infinite; }
      .svg3-s5  { animation: svg3-k5 6s ease-in-out infinite; }
      .svg3-s6  { animation: svg3-k6 6s ease-in-out infinite; }
      .svg3-s7  { animation: svg3-k7 6s ease-in-out infinite; }
      .svg3-s8  { animation: svg3-k8 6s ease-in-out infinite; }
      .svg3-s9  { animation: svg3-k9 6s ease-in-out infinite; }
      .svg3-s10 { animation: svg3-k10 6s ease-in-out infinite; }

      .svg3-beat { animation: svg3-beat 3s ease-in-out infinite; transform-origin: 500px 260px; }
      .svg3-beam { stroke-dasharray: 14 16; animation: svg3-beam 1.5s linear infinite; }
      .svg3-grow5 { animation: svg3-g5 6s ease-out infinite; transform-origin: 500px 780px; }
      .svg3-grow6 { animation: svg3-g6 6s ease-out infinite; transform-origin: 500px 700px; }
      .svg3-crown { animation: svg3-g7 6s ease-out infinite; transform-origin: 500px 600px; }

      .svg3-halo  { animation: svg3-pulse 2s ease-in-out infinite; }
      .svg3-ray   { animation: svg3-twinkle 3s ease-in-out infinite; }
      .svg3-fruit { animation: svg3-twinkle 2s ease-in-out infinite; }
      .svg3-fruit2 { animation: svg3-twinkle 2s ease-in-out infinite; animation-delay: -1s; }
      .svg3-star  { animation: svg3-twinkle 2s ease-in-out infinite; }
      .svg3-star2 { animation: svg3-twinkle 2s ease-in-out infinite; animation-delay: -1s; }
      .svg3-ring  { animation: svg3-spin 6s linear infinite; transform-origin: 500px 500px; }
    </style>
  </defs>

  <!-- Stage 1 (0.0-0.6 s): নিয়তের প্রতীক — হৃদয় -->
  <g class="svg3-s1">
    <g class="svg3-beat">
      <path d="M500 350 C380 270 390 170 450 170 C475 170 495 185 500 205 C505 185 525 170 550 170 C610 170 620 270 500 350 Z" fill="#f5d77a" fill-opacity="0.3" stroke="#f5d77a" stroke-width="10" stroke-linejoin="round"/>
      <circle cx="500" cy="258" r="16" fill="#ffffff"/>
    </g>
  </g>

  <!-- Stage 2 (0.6-1.2 s): হৃদয়ের ভেতরের আলো ও রশ্মি -->
  <g class="svg3-s2">
    <circle class="svg3-halo" cx="500" cy="260" r="230" fill="url(#svg3-glow)"/>
    <g stroke="#f0c040" stroke-width="6" stroke-linecap="round">
      <line class="svg3-ray" x1="650" y1="260" x2="695" y2="260"/>
      <line class="svg3-ray" x1="606" y1="366" x2="638" y2="398"/>
      <line class="svg3-ray" x1="500" y1="410" x2="500" y2="455"/>
      <line class="svg3-ray" x1="394" y1="366" x2="362" y2="398"/>
      <line class="svg3-ray" x1="350" y1="260" x2="305" y2="260"/>
      <line class="svg3-ray" x1="394" y1="154" x2="362" y2="122"/>
      <line class="svg3-ray" x1="500" y1="110" x2="500" y2="85"/>
      <line class="svg3-ray" x1="606" y1="154" x2="638" y2="122"/>
    </g>
  </g>

  <!-- Stage 3 (1.2-1.8 s): মাটি ও বীজ — আমলের শুরু -->
  <g class="svg3-s3">
    <path d="M200 800 Q500 770 800 800" fill="none" stroke="#1abc9c" stroke-width="10" stroke-linecap="round"/>
    <path d="M260 815 Q500 790 740 815" fill="none" stroke="#1abc9c" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
    <ellipse cx="500" cy="778" rx="18" ry="26" fill="#f0c040" stroke="#ffffff" stroke-width="4"/>
  </g>

  <!-- Stage 4 (1.8-2.4 s): নিয়ত থেকে আলোর ধারা বীজের দিকে নামে -->
  <g class="svg3-s4">
    <line x1="500" y1="470" x2="500" y2="735" stroke="#fff6c8" stroke-width="22" stroke-linecap="round" opacity="0.25"/>
    <line class="svg3-beam" x1="500" y1="470" x2="500" y2="735" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Stage 5 (2.4-3.0 s): অঙ্কুর গজায় -->
  <g class="svg3-s5">
    <g class="svg3-grow5">
      <path d="M500 770 L500 700" fill="none" stroke="#2ecc71" stroke-width="10" stroke-linecap="round"/>
      <path d="M500 720 Q455 700 450 660 Q495 670 500 720 Z" fill="#2ecc71" fill-opacity="0.5" stroke="#2ecc71" stroke-width="6" stroke-linejoin="round"/>
      <path d="M500 720 Q545 700 550 660 Q505 670 500 720 Z" fill="#2ecc71" fill-opacity="0.5" stroke="#2ecc71" stroke-width="6" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Stage 6 (3.0-3.6 s): চারা লম্বা হয়, আরও পাতা -->
  <g class="svg3-s6">
    <g class="svg3-grow6">
      <path d="M500 700 L500 610" fill="none" stroke="#2ecc71" stroke-width="12" stroke-linecap="round"/>
      <path d="M500 660 Q440 640 430 590 Q490 600 500 660 Z" fill="#2ecc71" fill-opacity="0.5" stroke="#2ecc71" stroke-width="6" stroke-linejoin="round"/>
      <path d="M500 660 Q560 640 570 590 Q510 600 500 660 Z" fill="#2ecc71" fill-opacity="0.5" stroke="#2ecc71" stroke-width="6" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Stage 7 (3.6-4.2 s): গাছের ঘন মুকুট -->
  <g class="svg3-s7">
    <g class="svg3-crown">
      <circle cx="500" cy="520" r="90" fill="#2ecc71" fill-opacity="0.35" stroke="#2ecc71" stroke-width="8"/>
      <circle cx="420" cy="575" r="70" fill="#2ecc71" fill-opacity="0.35" stroke="#2ecc71" stroke-width="8"/>
      <circle cx="580" cy="575" r="70" fill="#2ecc71" fill-opacity="0.35" stroke="#2ecc71" stroke-width="8"/>
    </g>
  </g>

  <!-- Stage 8 (4.2-4.8 s): সোনালি ফল — নিয়ত অনুযায়ী ফল -->
  <g class="svg3-s8">
    <g fill="#f0c040" stroke="#ffffff" stroke-width="4">
      <circle class="svg3-fruit" cx="470" cy="500" r="14"/>
      <circle class="svg3-fruit2" cx="540" cy="520" r="14"/>
      <circle class="svg3-fruit2" cx="415" cy="575" r="14"/>
      <circle class="svg3-fruit" cx="585" cy="575" r="14"/>
      <circle class="svg3-fruit" cx="500" cy="585" r="14"/>
    </g>
  </g>

  <!-- Stage 9 (4.8-5.4 s): অর্ধচন্দ্র ও ঝিকিমিকি তারা -->
  <g class="svg3-s9">
    <path transform="translate(-340 0)" d="M530 125 A50 50 0 1 0 530 215 A46 46 0 0 1 530 125 Z" fill="#f5d77a"/>
    <path class="svg3-star" d="M800 178 L806 194 L822 200 L806 206 L800 222 L794 206 L778 200 L794 194 Z" fill="#8fd3ff"/>
    <path class="svg3-star2" d="M860 338 L866 354 L882 360 L866 366 L860 382 L854 366 L838 360 L854 354 Z" fill="#ffffff"/>
    <path class="svg3-star2" d="M140 358 L146 374 L162 380 L146 386 L140 402 L134 386 L118 380 L134 374 Z" fill="#ffffff"/>
    <path class="svg3-star" d="M130 598 L135 611 L148 616 L135 621 L130 634 L125 621 L112 616 L125 611 Z" fill="#8fd3ff"/>
    <path class="svg3-star" d="M875 578 L880 591 L893 596 L880 601 L875 614 L870 601 L857 596 L870 591 Z" fill="#8fd3ff"/>
  </g>

  <!-- Stage 10 (5.4-6.0 s): পুরো দৃশ্যে আলোর বলয় -->
  <g class="svg3-s10">
    <circle class="svg3-ring" cx="500" cy="500" r="400" fill="none" stroke="#f0c040" stroke-width="6" stroke-dasharray="20 18" opacity="0.7"/>
    <circle class="svg3-halo" cx="500" cy="260" r="215" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.7"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
