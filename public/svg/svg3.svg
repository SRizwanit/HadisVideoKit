<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialGradient id="svg3-glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6c8" stop-opacity=".9"/><stop offset="1" stop-color="#f5d77a" stop-opacity="0"/></radialGradient>
<radialGradient id="svg3-rayg" gradientUnits="userSpaceOnUse" cx="500" cy="520" r="440"><stop offset="0" stop-color="#f5d77a" stop-opacity=".42"/><stop offset="1" stop-color="#f5d77a" stop-opacity="0"/></radialGradient>
<radialGradient id="svg3-gh" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#7ff0c0"/><stop offset="1" stop-color="#1abc9c"/></radialGradient>
<style>
@keyframes svg3-k1 { 0% { opacity:.5; transform:scale(.85); } 10%,90% { opacity:1; transform:scale(1); } 100% { opacity:.5; transform:scale(.85); } }
@keyframes svg3-k2 { 0%,9% { opacity:0; transform:scale(.6); } 14% { opacity:1; transform:scale(1.08); } 17%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg3-k3 { 0%,19% { opacity:0; } 25%,90% { opacity:1; } 100% { opacity:0; } }
@keyframes svg3-k4 { 0%,29% { opacity:0; transform:scaleY(.1); } 36% { opacity:1; transform:scaleY(1.04); } 38%,90% { opacity:1; transform:scaleY(1); } 100% { opacity:0; transform:scaleY(.1); } }
@keyframes svg3-k5 { 0%,39% { opacity:0; transform:scale(.6); } 44% { opacity:1; transform:scale(1.08); } 47%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg3-k6 { 0%,49% { opacity:0; transform:scale(.6); } 54% { opacity:1; transform:scale(1.08); } 57%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg3-k7 { 0%,59% { opacity:0; transform:scale(.6); } 64% { opacity:1; transform:scale(1.08); } 67%,90% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(.6); } }
@keyframes svg3-k8 { 0%,68% { opacity:0; } 71%,90% { opacity:1; } 100% { opacity:0; } }
@keyframes svg3-k9 { 0%,79% { opacity:0; } 85%,90% { opacity:1; } 100% { opacity:0; } }
@keyframes svg3-k10 { 0%,89% { opacity:0; transform:scale(.5); } 93% { opacity:.9; } 100% { opacity:0; transform:scale(2.6); } }
@keyframes svg3-spin { from { transform:rotate(0deg); } to { transform:rotate(22.5deg); } }
@keyframes svg3-twinkle { 0%,100% { opacity:.25; transform:scale(.6); } 50% { opacity:1; transform:scale(1.15); } }
@keyframes svg3-ripple { 0% { opacity:.9; transform:scale(.4); } 100% { opacity:0; transform:scale(1.8); } }
@keyframes svg3-float { 0% { transform:translateY(0); opacity:0; } 20% { opacity:.9; } 100% { transform:translateY(-110px); opacity:0; } }
.svg3-s1 { animation:svg3-k1 6s ease-in-out infinite; transform-origin:500px 520px; }
.svg3-rays { animation:svg3-spin 6s linear infinite; transform-origin:500px 520px; }
.svg3-s2 { animation:svg3-k2 6s ease-in-out infinite; transform-origin:500px 730px; }
.svg3-s3 { animation:svg3-k3 6s ease-in-out infinite; }
.svg3-s4 { animation:svg3-k4 6s ease-out infinite; transform-origin:500px 655px; }
.svg3-s5 { animation:svg3-k5 6s ease-in-out infinite; transform-origin:500px 590px; }
.svg3-s6 { animation:svg3-k6 6s ease-in-out infinite; transform-origin:500px 510px; }
.svg3-s7 { animation:svg3-k7 6s ease-in-out infinite; transform-origin:500px 380px; }
.svg3-s8 { animation:svg3-k8 6s ease-in-out infinite; }
.svg3-s9 { animation:svg3-k9 6s ease-in-out infinite; }
.svg3-s10 { animation:svg3-k10 6s ease-out infinite; transform-origin:500px 520px; }
.svg3-tw { animation:svg3-twinkle 2s ease-in-out infinite; }
.svg3-rp { animation:svg3-ripple 2s ease-out infinite; transform-origin:500px 730px; }
.svg3-mote { animation:svg3-float 2s ease-out infinite; }
</style>
</defs>

<!-- Stage 1 (0-10%): sunburst rays + soft glow -->
<g class="svg3-s1">
<circle cx="500" cy="520" r="330" fill="url(#svg3-glow)" opacity=".35"/>
<g class="svg3-rays"><polygon points="500,520 470,80 530,80" fill="url(#svg3-rayg)" transform="rotate(0.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg3-rayg)" transform="rotate(22.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg3-rayg)" transform="rotate(45.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg3-rayg)" transform="rotate(67.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg3-rayg)" transform="rotate(90.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg3-rayg)" transform="rotate(112.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg3-rayg)" transform="rotate(135.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg3-rayg)" transform="rotate(157.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg3-rayg)" transform="rotate(180.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg3-rayg)" transform="rotate(202.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg3-rayg)" transform="rotate(225.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg3-rayg)" transform="rotate(247.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg3-rayg)" transform="rotate(270.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg3-rayg)" transform="rotate(292.5 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg3-rayg)" transform="rotate(315.0 500 520)"/><polygon points="500,520 470,80 530,80" fill="url(#svg3-rayg)" transform="rotate(337.5 500 520)"/></g>
</g>

<!-- Stage 2 (10-20%): the heart (niyyah) pops in -->
<g class="svg3-s2">
<ellipse cx="500" cy="872" rx="170" ry="16" fill="#ffffff" opacity=".12"/>
<path d="M500,830 C380,750 330,690 345,640 C360,590 440,585 500,650 C560,585 640,590 655,640 C670,690 620,750 500,830 Z" fill="url(#svg3-gh)" stroke="#f0c040" stroke-width="10" stroke-linejoin="round"/>
</g>

<!-- Stage 3 (20-30%): star inside the heart + highlight -->
<g class="svg3-s3">
<path d="M370,650 C375,625 410,615 440,628" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="9" stroke-linecap="round"/>
<rect x="470" y="695" width="60" height="60" fill="#ffffff" transform="rotate(45 500 725)"/><rect x="470" y="695" width="60" height="60" fill="#ffffff"/><circle cx="500" cy="725" r="11" fill="#f0c040"/>
</g>

<!-- Stage 4 (30-40%): the stem grows from the heart -->
<g class="svg3-s4">
<path d="M500,655 C494,590 506,520 500,420" fill="none" stroke="#2ecc71" stroke-width="14" stroke-linecap="round"/>
</g>

<!-- Stage 5 (40-50%): first pair of leaves -->
<g class="svg3-s5">
<path d="M500,590 C440,590 395,555 380,520 C440,520 490,545 500,590 Z" fill="#2ecc71" stroke="#8ff0b8" stroke-width="4" stroke-linejoin="round"/><path d="M496,584 C455,572 420,548 392,528" fill="none" stroke="#d9ffe8" stroke-opacity=".7" stroke-width="4" stroke-linecap="round"/>
<path d="M500,590 C560,590 605,555 620,520 C560,520 510,545 500,590 Z" fill="#2ecc71" stroke="#8ff0b8" stroke-width="4" stroke-linejoin="round"/><path d="M504,584 C545,572 580,548 608,528" fill="none" stroke="#d9ffe8" stroke-opacity=".7" stroke-width="4" stroke-linecap="round"/>
<path class="svg3-tw" style="transform-origin:330px 500px; animation-delay:0s" d="M330,482 Q330,500 348,500 Q330,500 330,518 Q330,500 312,500 Q330,500 330,482 Z" fill="#fff6c8"/>
</g>

<!-- Stage 6 (50-60%): second, bigger pair of leaves -->
<g class="svg3-s6">
<path d="M500,510 C430,515 375,470 355,425 C435,420 490,455 500,510 Z" fill="#2ecc71" stroke="#8ff0b8" stroke-width="4" stroke-linejoin="round"/><path d="M496,504 C450,490 405,462 372,436" fill="none" stroke="#d9ffe8" stroke-opacity=".7" stroke-width="4" stroke-linecap="round"/>
<path d="M500,510 C570,515 625,470 645,425 C565,420 510,455 500,510 Z" fill="#2ecc71" stroke="#8ff0b8" stroke-width="4" stroke-linejoin="round"/><path d="M504,504 C550,490 595,462 628,436" fill="none" stroke="#d9ffe8" stroke-opacity=".7" stroke-width="4" stroke-linecap="round"/>
<path class="svg3-tw" style="transform-origin:670px 470px; animation-delay:-0.8s" d="M670,454 Q670,470 686,470 Q670,470 670,486 Q670,470 654,470 Q670,470 670,454 Z" fill="#fff6c8"/>
</g>

<!-- Stage 7 (60-70%): the flower of the deed opens at the top -->
<g class="svg3-s7">
<circle cx="500" cy="380" r="70" fill="url(#svg3-glow)"/>
<rect x="454" y="334" width="92" height="92" fill="#f5d77a" transform="rotate(45 500 380)"/><rect x="454" y="334" width="92" height="92" fill="#f5d77a"/>
<circle cx="500" cy="380" r="22" fill="#ffffff"/><circle cx="500" cy="380" r="10" fill="#f0c040"/>
</g>

<!-- Stage 8 (70-80%): the intention glows outward (ripples + rising motes) -->
<g class="svg3-s8">
<circle class="svg3-rp" cx="500" cy="730" r="150" fill="none" stroke="#8fd3ff" stroke-width="7"/>
<circle class="svg3-rp" style="animation-delay:-.67s" cx="500" cy="730" r="150" fill="none" stroke="#8fd3ff" stroke-width="7"/>
<circle class="svg3-rp" style="animation-delay:-1.34s" cx="500" cy="730" r="150" fill="none" stroke="#8fd3ff" stroke-width="7"/>
<circle class="svg3-mote" cx="560" cy="520" r="8" fill="#fff6c8"/>
<circle class="svg3-mote" style="animation-delay:-.7s" cx="440" cy="480" r="10" fill="#ffffff"/>
<circle class="svg3-mote" style="animation-delay:-1.4s" cx="540" cy="440" r="7" fill="#fff6c8"/>
</g>

<!-- Stage 9 (80-90%): the whole scene glows -->
<g class="svg3-s9">
<circle cx="500" cy="560" r="300" fill="url(#svg3-glow)"/>
<path class="svg3-tw" style="transform-origin:290px 700px; animation-delay:-0.3s" d="M290,680 Q290,700 310,700 Q290,700 290,720 Q290,700 270,700 Q290,700 290,680 Z" fill="#fff6c8"/><path class="svg3-tw" style="transform-origin:720px 640px; animation-delay:-0.9s" d="M720,618 Q720,640 742,640 Q720,640 720,662 Q720,640 698,640 Q720,640 720,618 Z" fill="#fff6c8"/><path class="svg3-tw" style="transform-origin:600px 330px; animation-delay:-1.5s" d="M600,314 Q600,330 616,330 Q600,330 600,346 Q600,330 584,330 Q600,330 600,314 Z" fill="#fff6c8"/><path class="svg3-tw" style="transform-origin:400px 340px; animation-delay:-0.6s" d="M400,326 Q400,340 414,340 Q400,340 400,354 Q400,340 386,340 Q400,340 400,326 Z" fill="#fff6c8"/>
</g>

<!-- Stage 10 (90-100%): halo pulse, then fade back to stage 1 -->
<g class="svg3-s10">
<circle cx="500" cy="520" r="150" fill="none" stroke="#f5d77a" stroke-width="12"/>
<circle cx="500" cy="520" r="150" fill="url(#svg3-glow)" opacity=".5"/>
</g>
</svg>
